                      - timestamp
        sourceObjectKind:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/DatasetSourceObjectKind'
        fieldSourceKind:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/DatasetFieldSourceKind'
        grainKind:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/DatasetGrainKind'
        dimensionKind:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/DimensionKind'
        dimensionPurpose:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/DimensionPurpose'
        definitionOrigin:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/DefinitionOrigin'
        rangeDataType:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/RangeDataType'
        editPolicy:
          type: array
          description: How far a dimension profile lets users edit a profiled dimension.
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/DimensionEditPolicy'
        bindingKind:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/BindingKind'
        groupingMode:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    type: string
                    enum:
                      - member
                      - level
                      - ancestor
                      - depth
        raggedBehavior:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/DatasetRaggedBehavior'
        periodAlignment:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/DatasetPeriodAlignment'
        unmappedBehavior:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/DatasetUnmappedBehavior'
        timeValueType:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/DatasetTimeValueType'
        observationKind:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:

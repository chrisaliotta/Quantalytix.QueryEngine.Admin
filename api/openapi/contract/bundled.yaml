                    $ref: '#/components/schemas/VersionStatus'
        assumptionSetStatus:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/AssumptionSetStatus'
        dataType:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VocabularyTerm'
              - required:
                  - value
                properties:
                  value:
                    $ref: '#/components/schemas/DatasetDataType'
        measureOutputDataType:
          type: array

openapi: 3.1.0
info:
  title: Quantalytix Query Engine Admin API
  version: 1.0.0
  description: |
    Metadata administration for Query Engine tenants. Conventions (routing, ids, problems, change sets) are defined in
    docs/blueprint/01-api-conventions.md; each tag's module is specified by the blueprint file named in its description.
  license:
    name: Proprietary
    identifier: LicenseRef-Quantalytix-Proprietary
servers:
  - url: http://localhost:5180
    description: Local development host (api/src launch profile "http").
security:
  - Bearer: []
tags:
  - name: tenant
    x-displayName: Tenant, session and catalog
    description: Session, tenant directory, overview, catalog and vocabularies. Blueprint 10-tenant-session-catalog.md.
  - name: datasets
    x-displayName: Datasets
    description: Datasets, dataset versions, fields, grains, bindings, measures and source objects. Blueprint 11-datasets.md.
  - name: dimensions
    x-displayName: Dimensions
    description: Dimensions, roles, the live and frozen versions, levels, members and range bands. Blueprint 12-dimensions.md.
  - name: mappings
    x-displayName: Mapping sets and bridges
    description: Mapping sets, bridges and their live and frozen versions. Blueprint 13-mappings-and-bridges.md.
  - name: releases
    x-displayName: Releases and assumption sets
    description: Semantic releases, activation and assumption sets. Blueprint 14-releases-and-assumption-sets.md.
  - name: models
    x-displayName: Calculation models
    description: Calculation models, variables, calculated measures, parameters and attributions. Blueprint 15-calculation-models.md.
  - name: reports
    x-displayName: Reports
    description: Reports and their rows, sources, profiles, scenarios, scopes, columns and styles. Blueprint 16-reports.md.
paths:
  /api/me:
    get:
      operationId: getSession
      summary: Read who the caller is
      tags:
        - tenant
      responses:
        '200':
          description: The caller as the API sees its bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tenants:
    get:
      operationId: listTenants
      summary: List the tenants the caller can reach
      description: A system admin reaches every tenant in the directory; any other caller reaches its token's tenant.
      tags:
        - tenant
      responses:
        '200':
          description: The accessible tenants, ordered by tenant id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessibleTenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vocabularies:
    get:
      operationId: getVocabularies
      summary: Read every enumeration the UI renders
      tags:
        - tenant
      responses:
        '200':
          description: Every vocabulary, keyed by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vocabularies'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tenants/{tenantId}/overview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getOverview
      summary: Read the tenant's state, counts and work in progress
      tags:
        - tenant
      responses:
        '200':
          description: The tenant overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tenants/{tenantId}/catalog:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getCatalog
      summary: Read the names and ids every picker and cross-module link resolves against
      description: One catalog for every module, cached by the client on `tenant.semanticRevision` (OI-13). Report-owned dimensions and bridges are included only so references resolve; pickers and lists never offer them (OI-22).
      tags:
        - tenant
      responses:
        '200':
          description: The tenant catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tenants/{tenantId}/dimensions/{dimensionId}/published-members:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: dimensionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getPublishedMembers
      summary: Read the members of a dimension's published version
      tags:
        - tenant
      responses:
        '200':
          description: The published version's members, in hierarchy order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedMembers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The dimension does not exist or has no published version.
  /api/system/tenants:
    get:
      operationId: listSystemTenants
      summary: List every tenant in the directory
      tags:
        - tenant
      responses:
        '200':
          description: The directory entries, ordered by tenant id, with masked connection strings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantDirectoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSystemTenant
      summary: Register a tenant after verifying its connection string
      tags:
        - tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateInput'
      responses:
        '201':
          description: The tenant was registered; the body is its entry with a masked connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDirectoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: A field breaks a rule; a `connectionString` error gives the reason verification failed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/system/tenants/verify:
    post:
      operationId: verifySystemTenantConnection
      summary: Test a connection string for a tenant without storing it
      description: The connection must open, and its `qe_database_info` must name the tenant and have the metadata schema version this API supports.
      tags:
        - tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantVerifyInput'
      responses:
        '200':
          description: The test ran; `isValid` and `message` give its outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConnectionCheck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/system/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getSystemTenant
      summary: Read one tenant's directory entry
      tags:
        - tenant
      responses:
        '200':
          description: The directory entry with a masked connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDirectoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The directory has no such tenant.
    put:
      operationId: updateSystemTenant
      summary: Change a tenant's provider, cache lifetime and connection string
      tags:
        - tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateInput'
      responses:
        '200':
          description: The updated entry with a masked connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDirectoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: A field breaks a rule; a `connectionString` error gives the reason verification failed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The directory has no such tenant.
  /api/system/tenants/{tenantId}/enabled:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    put:
      operationId: setSystemTenantEnabled
      summary: Permit or stop query routing for a tenant
      tags:
        - tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantEnabledInput'
      responses:
        '200':
          description: The updated entry with a masked connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDirectoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The directory has no such tenant.
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A JWT carrying `sub`, exactly one `tenant_id`, and `role: SystemAdmin` for callers who may reach any tenant (blueprint 01, Authentication and authorization).'
  schemas:
    Id:
      type: string
      description: Opaque identifier. Tables use BIGINT ids below 2^53; the API serializes them as strings. Inside a change set, an item created by an earlier operation is referenced by its client-generated temporary id, `tmp:<uuid>`.
      examples:
        - '1042'
    Key:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_]*$
      description: Natural key, fixed after creation (OI-29, OI-36).
    DottedKey:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_.]*$
      description: Natural key of a mapping set or bridge; also allows `.` (OI-29).
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC timestamp.
    VersionStatus:
      type: string
      enum:
        - draft
        - validated
        - published
        - retired
    Problem:
      type: object
      description: The one error body (`application/problem+json`) for every 4xx and 5xx response (OI-06). 400 carries `errors`; 409 carries `violations` for delete blockers and `detail` otherwise; 422 carries `violations`; 401, 403 and 404 carry the title only; 500 carries `traceId`.
      required:
        - type
        - title
        - status
        - errors
      properties:
        type:
          type: string
          format: uri
          description: Stable problem code.
          examples:
            - urn:qe:problem:rules-violated
        title:
          type: string
          description: Short, user-facing summary.
        status:
          type: integer
          enum:
            - 400
            - 401
            - 403
            - 404
            - 409
            - 422
            - 500
        detail:
          type: string
        errors:
          type: object
          description: Input path to messages. `''` is the form-level key. Paths are camelCase, dotted and indexed (`components[0].fieldId`); inside a change set they are prefixed by the failing operation (`operations[3].memberKey`).
          additionalProperties:
            type: array
            items:
              type: string
        violations:
          type: array
          description: Rule violations (422) and delete blockers (409).
          items:
            $ref: '#/components/schemas/Violation'
        traceId:
          type: string
    Violation:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: The rule code, snake_case.
          examples:
            - member_key_unique
        message:
          type: string
          description: Phrased for display.
        target:
          $ref: '#/components/schemas/ViolationTarget'
    ViolationTarget:
      type: object
      description: Where to take the user to fix a violation.
      required:
        - area
      properties:
        area:
          type: string
          description: Module-specific area such as a dataset tab, a dimension tab, a release manifest row or a report section.
        itemId:
          $ref: '#/components/schemas/Id'
        itemKey:
          type: string
        filter:
          type: string
          description: Search text that narrows a table to the offending rows.
    DeleteCheck:
      type: object
      description: Answer of `GET <resource>/delete-check`; `DELETE <resource>` answers 409 with the same violations when blocked (OI-07).
      required:
        - allowed
        - message
        - reasons
      properties:
        allowed:
          type: boolean
        message:
          type:
            - string
            - 'null'
          description: One-sentence summary when blocked.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    ValidationReport:
      type: object
      description: Answer of a read-only `check`; never writes.
      required:
        - versionId
        - checkedAt
        - violations
      properties:
        versionId:
          $ref: '#/components/schemas/Id'
        checkedAt:
          $ref: '#/components/schemas/Timestamp'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    ChangeSetRequest:
      type: object
      description: 'Body of `POST <aggregate>/changes/preview` and `POST <aggregate>/changes` (OI-01). Generic over the aggregate''s operation union: an aggregate specializes it with `allOf` and a narrowed `operations.items` (see README.md).'
      required:
        - operations
      properties:
        operations:
          type: array
          items:
            description: One operation of the aggregate's union, discriminated by `op`.
    ChangeSetPreview:
      type: object
      description: '200 answer of `POST <aggregate>/changes/preview`: the operations apply. Generic over the aggregate content: an aggregate specializes it with `allOf` and a narrowed `state`.'
      required:
        - state
        - violations
      properties:
        state:
          description: The aggregate content after the operations apply; what the editor renders.
        violations:
          type: array
          description: Publication-rule findings that do not block saving.
          items:
            $ref: '#/components/schemas/Violation'
    ChangeSetCommit:
      type: object
      description: '200 answer of `POST <aggregate>/changes`: every operation applied and was written. Generic over the aggregate content: an aggregate specializes it with `allOf` and a narrowed `state`.'
      required:
        - state
        - idMap
      properties:
        state:
          description: The aggregate content as stored after the commit.
        idMap:
          type: object
          description: Temporary id (`tmp:<uuid>`) to the real id of each item the commit created.
          additionalProperties:
            $ref: '#/components/schemas/Id'
    VocabularyTerm:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
          description: The schema's value.
        label:
          type: string
        description:
          type: string
    Session:
      type: object
      description: Who the caller is, as the API sees its bearer token. There are no tenant roles (OI-09).
      required:
        - subject
        - displayName
        - tenantId
        - isSystemAdmin
      properties:
        subject:
          type: string
          description: The token's `sub`.
        displayName:
          type:
            - string
            - 'null'
          description: The token's name claim; null when it carries none.
        tenantId:
          type:
            - string
            - 'null'
          description: The caller's tenant when the token carries exactly one tenant claim; otherwise null.
        isSystemAdmin:
          type: boolean
          description: Whether the caller may reach every tenant and the tenant directory.
    AccessibleTenant:
      type: object
      required:
        - tenantId
        - isEnabled
      properties:
        tenantId:
          type: string
          description: The tenant directory key.
        isEnabled:
          type: boolean
          description: Whether query routing is permitted for the tenant.
    TenantInfo:
      type: object
      description: The tenant database's identity and the revision the engine keys its metadata cache by.
      required:
        - tenantKey
        - metadataSchemaVersion
        - semanticRevision
        - activeReleaseId
      properties:
        tenantKey:
          type: string
          description: '`qe_database_info.tenant_key`.'
        metadataSchemaVersion:
          type: integer
        semanticRevision:
          type: integer
          format: int64
          description: Advances once per commit or command that changes what the engine reads.
        activeReleaseId:
          type:
            - string
            - 'null'
          description: The release runtime queries use; null when the tenant has none.
    TenantOverview:
      description: The tenant at a glance for the overview screen.
      allOf:
        - $ref: '#/components/schemas/TenantInfo'
        - type: object
          required:
            - counts
            - drafts
          properties:
            counts:
              $ref: '#/components/schemas/TenantOverviewCounts'
            drafts:
              $ref: '#/components/schemas/TenantOverviewDrafts'
    TenantOverviewCounts:
      type: object
      description: How much metadata the tenant holds.
      required:
        - datasets
        - dimensions
        - mappingSets
        - bridges
        - releases
        - assumptionSets
        - models
        - reports
        - activeMeasures
      properties:
        datasets:
          type: integer
        dimensions:
          type: integer
          description: Analytical dimensions; report-owned dimensions are not counted (OI-22).
        mappingSets:
          type: integer
        bridges:
          type: integer
          description: Analytical bridges; report-owned bridges are not counted (OI-22).
        releases:
          type: integer
        assumptionSets:
          type: integer
        models:
          type: integer
        reports:
          type: integer
        activeMeasures:
          type: integer
          description: Measures of the dataset versions the active release pins.
    TenantOverviewDrafts:
      type: object
      description: 'Work in progress: the kinds that still have a draft status. Dimensions, mapping sets and bridges follow the living lifecycle and have no drafts (OI-14).'
      required:
        - datasetVersions
        - releases
      properties:
        datasetVersions:
          type: integer
        releases:
          type: integer
    TenantCatalog:
      type: object
      description: The union of what every module's pickers and cross-module links read (OI-13).
      required:
        - tenant
        - datasets
        - dimensions
        - roles
        - mappingSets
        - bridges
        - models
        - reports
        - releases
        - assumptionSets
      properties:
        tenant:
          $ref: '#/components/schemas/TenantInfo'
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogDataset'
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogDimension'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogRole'
        mappingSets:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogMappingSet'
        bridges:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogBridge'
        models:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogModel'
        reports:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogReport'
        releases:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogRelease'
        assumptionSets:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogAssumptionSet'
    TenantCatalogDataset:
      type: object
      required:
        - id
        - key
        - displayName
        - isEnabled
        - activeVersionId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        isEnabled:
          type: boolean
        activeVersionId:
          type:
            - string
            - 'null'
          description: The dataset version the active release pins; null when it pins none.
    TenantCatalogDimension:
      type: object
      required:
        - id
        - key
        - displayName
        - kind
        - purpose
        - origin
        - isEnabled
        - publishedVersionId
        - publishedVersionNumber
        - ownerReportId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        kind:
          $ref: '#/components/schemas/VocabularyDimensionKind'
        purpose:
          $ref: '#/components/schemas/VocabularyDimensionPurpose'
        origin:
          $ref: '#/components/schemas/VocabularyDefinitionOrigin'
        isEnabled:
          type: boolean
        publishedVersionId:
          type:
            - string
            - 'null'
          description: The live version; null when none is published.
        publishedVersionNumber:
          type:
            - integer
            - 'null'
        ownerReportId:
          type:
            - string
            - 'null'
          description: The report that owns a `report` purpose dimension; null otherwise.
    TenantCatalogRole:
      type: object
      required:
        - id
        - key
        - displayName
        - dimensionId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        dimensionId:
          $ref: '#/components/schemas/Id'
    TenantCatalogMappingSet:
      type: object
      required:
        - id
        - key
        - displayName
        - dimensionId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        dimensionId:
          $ref: '#/components/schemas/Id'
    TenantCatalogBridge:
      type: object
      required:
        - id
        - key
        - displayName
        - sourceDimensionId
        - targetDimensionId
        - ownerReportId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        sourceDimensionId:
          $ref: '#/components/schemas/Id'
        targetDimensionId:
          $ref: '#/components/schemas/Id'
        ownerReportId:
          type:
            - string
            - 'null'
          description: The report that owns a report bridge; null for an analytical bridge.
    TenantCatalogModel:
      type: object
      required:
        - id
        - key
        - displayName
        - isEnabled
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        isEnabled:
          type: boolean
    TenantCatalogReport:
      type: object
      required:
        - id
        - key
        - displayName
        - isEnabled
        - modelId
        - reportDimensionId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        isEnabled:
          type: boolean
        modelId:
          $ref: '#/components/schemas/Id'
        reportDimensionId:
          $ref: '#/components/schemas/Id'
    TenantCatalogRelease:
      type: object
      description: A release has a key and no display name (OI-39).
      required:
        - id
        - key
        - status
        - isActive
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        isActive:
          type: boolean
    TenantCatalogAssumptionSet:
      type: object
      required:
        - id
        - key
        - displayName
        - status
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          type: string
        displayName:
          type: string
        status:
          $ref: '#/components/schemas/VocabularyAssumptionSetStatus'
    PublishedMembers:
      type: object
      description: The members of a dimension's published version, fetched per picker.
      required:
        - dimensionId
        - versionId
        - members
      properties:
        dimensionId:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
        members:
          type: array
          items:
            $ref: '#/components/schemas/PublishedMember'
    PublishedMember:
      type: object
      required:
        - key
        - displayName
        - parentKey
        - isAssignable
        - levelKey
      properties:
        key:
          type: string
        displayName:
          type: string
        parentKey:
          type:
            - string
            - 'null'
        isAssignable:
          type: boolean
        levelKey:
          type:
            - string
            - 'null'
    Vocabularies:
      type: object
      description: Every enumeration a select renders, keyed by name (OI-11). Values are the schema's; open vocabularies (`expressionLanguageVersion`, `displayFormat`, `timeZone`) list the offered values of a free-text column.
      required:
        - versionStatus
        - assumptionSetStatus
        - dataType
        - measureOutputDataType
        - sourceObjectKind
        - fieldSourceKind
        - grainKind
        - dimensionKind
        - dimensionPurpose
        - definitionOrigin
        - rangeDataType
        - editPolicy
        - bindingKind
        - groupingMode

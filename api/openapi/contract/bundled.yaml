    VocabularyProvider:
      type: string
      enum:
        - starrocks
    VocabularyComponentRoleRequirements:
      type: array
      description: The component roles a measure kind reads.
      items:
        type: object
        required:
          - role
          - required
        properties:
          role:
            $ref: '#/components/schemas/ComponentRole'
          required:
            type: boolean
    TenantDirectoryEntry:
      type: object
      description: A `query_control.qe_tenant_directory` row; the connection string's password is masked.
      required:
        - tenantId
        - providerId
        - connectionString
        - isEnabled
        - metadataCacheSeconds
        - updatedAt
      properties:
        tenantId:
          type: string
        providerId:
          $ref: '#/components/schemas/VocabularyProvider'
        connectionString:
          type: string
          description: The connection string with its password replaced by `*****`.
        isEnabled:
          type: boolean
          description: Whether query routing is permitted for the tenant.
        metadataCacheSeconds:
          type: integer
          description: The suggested metadata cache lifetime.
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    TenantCreateInput:
      type: object
      required:
        - tenantId
        - providerId
        - connectionString
        - isEnabled
        - metadataCacheSeconds
      properties:
        tenantId:
          type: string
          description: Fixed once created; the database's `tenant_key` must equal it.
        providerId:
          $ref: '#/components/schemas/VocabularyProvider'
        connectionString:
          type: string
          description: Verified before it is stored.
        isEnabled:
          type: boolean
        metadataCacheSeconds:
          type: integer
    TenantUpdateInput:
      type: object
      description: The tenant id is fixed and enabling has its own request.
      required:
        - providerId
        - connectionString
        - metadataCacheSeconds
      properties:
        providerId:
          $ref: '#/components/schemas/VocabularyProvider'
        connectionString:
          type:
            - string
            - 'null'
          description: A new connection string, verified before it is stored; null keeps the current one.
        metadataCacheSeconds:
          type: integer
    TenantEnabledInput:
      type: object
      required:
        - isEnabled
      properties:
        isEnabled:
          type: boolean
    TenantVerifyInput:
      type: object
      required:
        - tenantId
        - connectionString
      properties:
        tenantId:
          type: string
          description: The tenant the connection string must route to.
        connectionString:
          type: string
    TenantConnectionCheck:
      type: object
      required:
        - isValid
        - message
      properties:
        isValid:
          type: boolean
          description: Whether the connection opens a database of the supported metadata schema version that belongs to the tenant.
        message:
          type: string
          description: What the connection reached, or why it is rejected.
    DatasetSourceObjectKind:
      type: string
      enum:
        - table
        - view
    DatasetFieldSourceKind:
      type: string
      enum:
        - column
        - json_path
        - expression
    DatasetDataType:
      type: string
      enum:

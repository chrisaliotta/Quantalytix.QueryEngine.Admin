openapi: 3.1.0
info:
  title: Quantalytix Query Engine Admin API
  version: 1.0.0
  description: |
    Metadata administration for Query Engine tenants. Conventions (routing, ids, problems, change sets) are defined in
    docs/blueprint/01-api-conventions.md; each tag's module is specified by the blueprint file named in its description.
  license:
    name: Proprietary
    identifier: LicenseRef-Quantalytix-Proprietary
servers:
  - url: http://localhost:5180
    description: Local development host (api/src launch profile "http").
security:
  - Bearer: []
tags:
  - name: tenant
    x-displayName: Tenant, session and catalog
    description: Session, tenant directory, overview, catalog and vocabularies. Blueprint 10-tenant-session-catalog.md.
  - name: datasets
    x-displayName: Datasets
    description: Datasets, dataset versions, fields, grains, bindings, measures and source objects. Blueprint 11-datasets.md.
  - name: dimensions
    x-displayName: Dimensions
    description: Dimensions, roles, the live and frozen versions, levels, members and range bands. Blueprint 12-dimensions.md.
  - name: mappings
    x-displayName: Mapping sets and bridges
    description: Mapping sets, bridges and their live and frozen versions. Blueprint 13-mappings-and-bridges.md.
  - name: releases
    x-displayName: Releases and assumption sets
    description: Semantic releases, activation and assumption sets. Blueprint 14-releases-and-assumption-sets.md.
  - name: models
    x-displayName: Calculation models
    description: Calculation models, variables, calculated measures, parameters and attributions. Blueprint 15-calculation-models.md.
  - name: reports
    x-displayName: Reports
    description: Reports and their rows, sources, profiles, scenarios, scopes, columns and styles. Blueprint 16-reports.md.
paths:
  /api/me:
    get:
      operationId: getSession
      summary: Read who the caller is
      tags:
        - tenant
      responses:
        '200':
          description: The caller as the API sees its bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tenants:
    get:
      operationId: listTenants
      summary: List the tenants the caller can reach
      description: A system admin reaches every tenant in the directory; any other caller reaches its token's tenant.
      tags:
        - tenant
      responses:
        '200':
          description: The accessible tenants, ordered by tenant id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessibleTenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vocabularies:
    get:
      operationId: getVocabularies
      summary: Read every enumeration the UI renders
      tags:
        - tenant
      responses:
        '200':
          description: Every vocabulary, keyed by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vocabularies'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tenants/{tenantId}/overview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getOverview
      summary: Read the tenant's state, counts and work in progress
      tags:
        - tenant
      responses:
        '200':
          description: The tenant overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tenants/{tenantId}/catalog:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getCatalog
      summary: Read the names and ids every picker and cross-module link resolves against
      description: One catalog for every module, cached by the client on `tenant.semanticRevision` (OI-13). Report-owned dimensions and bridges are included only so references resolve; pickers and lists never offer them (OI-22).
      tags:
        - tenant
      responses:
        '200':
          description: The tenant catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tenants/{tenantId}/dimensions/{dimensionId}/published-members:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: dimensionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getPublishedMembers
      summary: Read the members of a dimension's published version
      tags:
        - tenant
      responses:
        '200':
          description: The published version's members, in hierarchy order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedMembers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The dimension does not exist or has no published version.
  /api/system/tenants:
    get:
      operationId: listSystemTenants
      summary: List every tenant in the directory
      tags:
        - tenant
      responses:
        '200':
          description: The directory entries, ordered by tenant id, with masked connection strings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantDirectoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSystemTenant
      summary: Register a tenant after verifying its connection string
      tags:
        - tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateInput'
      responses:
        '201':
          description: The tenant was registered; the body is its entry with a masked connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDirectoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: A field breaks a rule; a `connectionString` error gives the reason verification failed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/system/tenants/verify:
    post:
      operationId: verifySystemTenantConnection
      summary: Test a connection string for a tenant without storing it
      description: The connection must open, and its `qe_database_info` must name the tenant and have the metadata schema version this API supports.
      tags:
        - tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantVerifyInput'
      responses:
        '200':
          description: The test ran; `isValid` and `message` give its outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConnectionCheck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/system/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getSystemTenant
      summary: Read one tenant's directory entry
      tags:
        - tenant
      responses:
        '200':
          description: The directory entry with a masked connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDirectoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The directory has no such tenant.
    put:
      operationId: updateSystemTenant
      summary: Change a tenant's provider, cache lifetime and connection string
      tags:
        - tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateInput'
      responses:
        '200':
          description: The updated entry with a masked connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDirectoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: A field breaks a rule; a `connectionString` error gives the reason verification failed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The directory has no such tenant.
  /api/system/tenants/{tenantId}/enabled:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    put:
      operationId: setSystemTenantEnabled
      summary: Permit or stop query routing for a tenant
      tags:
        - tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantEnabledInput'
      responses:
        '200':
          description: The updated entry with a masked connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDirectoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The directory has no such tenant.
  /api/tenants/{tenantId}/source-objects:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listSourceObjects
      summary: List the tables and views of the tenant database
      tags:
        - datasets
      responses:
        '200':
          description: Every table and view, with live storage statistics (OI-34).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetSourceObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tenants/{tenantId}/source-objects/{kind}/{name}/columns:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetSourceObjectKindPath'
      - $ref: '#/components/parameters/DatasetSourceObjectNamePath'
    get:
      operationId: getSourceColumns
      summary: List the columns of a table or view
      tags:
        - datasets
      responses:
        '200':
          description: The object's columns in ordinal order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetSourceColumn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: No table or view of that kind and name.
  /api/tenants/{tenantId}/datasets:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listDatasets
      summary: List datasets with their version summaries
      tags:
        - datasets
      responses:
        '200':
          description: Every dataset of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createDataset
      summary: Create a dataset and its draft version 1
      description: Mode `existing` registers a table or view that already exists. Mode `new` creates a managed table (OI-33) with the given columns, then a draft whose fields read them.
      tags:
        - datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreateInput'
      responses:
        '201':
          description: The dataset, with draft version 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The dataset key or table name is taken.
  /api/tenants/{tenantId}/datasets/{datasetId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetIdPath'
    get:
      operationId: getDataset
      summary: Get one dataset with its version summaries
      tags:
        - datasets
      responses:
        '200':
          description: The dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDataset
      summary: Delete a dataset and all its versions
      description: Allowed only when every version is a draft or validated and no release lists the dataset (D10, OI-17).
      tags:
        - datasets
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Delete blocked; `violations` are the reasons of the delete check.
  /api/tenants/{tenantId}/datasets/{datasetId}/delete-check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetIdPath'
    get:
      operationId: checkDeleteDataset
      summary: Tell whether a dataset can be deleted, and why not
      description: Never writes. Reasons carry the codes `has_published_versions` (a version is published or retired) and `referenced_by_release` (a release lists the dataset).
      tags:
        - datasets
      responses:
        '200':
          description: The delete check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCheck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/datasets/{datasetId}/versions:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetIdPath'
    post:
      operationId: createDatasetDraft
      summary: Create a draft version, empty or cloned from another version of the dataset
      tags:
        - datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreateDraftInput'
      responses:
        '201':
          description: The new draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The dataset already has an open (draft or validated) version (OI-23).
  /api/tenants/{tenantId}/dataset-versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    get:
      operationId: getDatasetVersion
      summary: Get the whole content of one dataset version
      tags:
        - datasets
      responses:
        '200':
          description: Settings, fields, grains, bindings, measures and dependents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDatasetDraft
      summary: Delete a draft or validated version that no release pins
      tags:
        - datasets
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Delete blocked; `violations` are the reasons of the delete check.
  /api/tenants/{tenantId}/dataset-versions/{versionId}/delete-check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    get:
      operationId: checkDeleteDatasetVersion
      summary: Tell whether a dataset version can be deleted, and why not
      description: Never writes. Reasons carry the codes `published_version` (the version is published or retired) and `referenced_by_release` (a release pins the version).
      tags:
        - datasets
      responses:
        '200':
          description: The delete check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCheck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/dataset-versions/{versionId}/changes/preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: previewDatasetChanges
      summary: Apply staged operations to a dataset version in memory and return the result
      description: Never writes. `errors` keys of a refused operation are prefixed `operations[n].` (OI-01).
      tags:
        - datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetChangeSetRequest'
      responses:
        '200':
          description: The operations apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetChangeSetPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Not a draft (only `updateDataset` applies then), not a managed table, or an item delete is blocked by its dependents.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /api/tenants/{tenantId}/dataset-versions/{versionId}/changes:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: commitDatasetChanges
      summary: Apply and write staged operations to a dataset version
      description: Replays the operations onto the stored version (last write wins, OI-02) and writes them; any failure writes nothing except DDL already run for `createColumn`, which leaves an unread column.
      tags:
        - datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetChangeSetRequest'
      responses:
        '200':
          description: Every operation applied and was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetChangeSetCommit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Not a draft (only `updateDataset` applies then), not a managed table, or an item delete is blocked by its dependents.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /api/tenants/{tenantId}/dataset-versions/{versionId}/check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: checkDatasetVersion
      summary: Run the publication rules on a dataset version without writing
      description: 'Rule codes: `source_object_exists`, `version_supports_a_mode`, `default_time_binding_in_version`, `field_key_unique`, `field_columns_exist`, `expression_field_references`, `expression_field_acyclic`, `grain_key_unique`, `grain_fields_in_version`, `series_grain_excludes_time_field`, `binding_fields_in_version`, `binding_source_field_groupable`, `bound_roles_distinct`, `mapped_binding_mapping_set_dimension`, `range_binding_dimension_kind`, `time_binding_dimension_kind`, `bridge_binding_route`, `unknown_members_in_version`, `interval_estimates_for_finer_periods`, `measure_key_unique`, `component_fields_in_version`, `component_roles_match_kind`, `formula_references_known_measures`, `formula_acyclic`, `time_policy_series_grain`, `time_policy_time_binding_in_version`. Each violation''s `target.area` is a `DatasetTab`.'
      tags:
        - datasets
      responses:
        '200':
          description: The rule report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/dataset-versions/{versionId}/validate:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: validateDatasetVersion
      summary: Move a draft to validated when every publication rule passes
      tags:
        - datasets
      responses:
        '200':
          description: The validated version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Not a draft.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: A publication rule fails; nothing was written.
  /api/tenants/{tenantId}/dataset-versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: publishDatasetVersion
      summary: Publish a draft or validated version when every publication rule passes
      description: A draft is validated first, in the same call.
      tags:
        - datasets
      responses:
        '200':
          description: The published version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Not a draft or validated.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: A publication rule fails; nothing was written.
  /api/tenants/{tenantId}/dataset-versions/{versionId}/reopen:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: reopenDatasetVersion
      summary: Return a validated version to draft
      tags:
        - datasets
      responses:
        '200':
          description: The draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Not validated.
  /api/tenants/{tenantId}/dataset-versions/{versionId}/retire:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: retireDatasetVersion
      summary: Retire a published version that the active release does not pin
      tags:
        - datasets
      responses:
        '200':
          description: The retired version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionSummary'
        '400':

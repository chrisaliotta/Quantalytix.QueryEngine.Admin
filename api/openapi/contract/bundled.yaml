openapi: 3.1.0
info:
  title: Quantalytix Query Engine Admin API
  version: 1.0.0
  description: |
    Metadata administration for Query Engine tenants. Conventions (routing, ids, problems, change sets) are defined in
    docs/blueprint/01-api-conventions.md; each tag's module is specified by the blueprint file named in its description.
  license:
    name: Proprietary
    identifier: LicenseRef-Quantalytix-Proprietary
servers:
  - url: http://localhost:5180
    description: Local development host (api/src launch profile "http").
security:
  - Bearer: []
tags:
  - name: tenant
    x-displayName: Tenant, session and catalog
    description: Session, tenant directory, overview, catalog and vocabularies. Blueprint 10-tenant-session-catalog.md.
  - name: datasets
    x-displayName: Datasets
    description: Datasets, dataset versions, fields, grains, bindings, measures and source objects. Blueprint 11-datasets.md.
  - name: dimensions
    x-displayName: Dimensions
    description: Dimensions, roles, the live and frozen versions, levels, members and range bands. Blueprint 12-dimensions.md.
  - name: mappings
    x-displayName: Mapping sets and bridges
    description: Mapping sets, bridges and their live and frozen versions. Blueprint 13-mappings-and-bridges.md.
  - name: releases
    x-displayName: Releases and assumption sets
    description: Semantic releases, activation and assumption sets. Blueprint 14-releases-and-assumption-sets.md.
  - name: models
    x-displayName: Calculation models
    description: Calculation models, variables, calculated measures, parameters and attributions. Blueprint 15-calculation-models.md.
  - name: reports
    x-displayName: Reports
    description: Reports and their rows, sources, profiles, scenarios, scopes, columns and styles. Blueprint 16-reports.md.
paths:
  /api/me:
    get:
      operationId: getSession
      summary: Read who the caller is
      tags:
        - tenant
      responses:
        '200':
          description: The caller as the API sees its bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tenants:
    get:
      operationId: listTenants
      summary: List the tenants the caller can reach
      description: A system admin reaches every tenant in the directory; any other caller reaches its token's tenant.
      tags:
        - tenant
      responses:
        '200':
          description: The accessible tenants, ordered by tenant id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessibleTenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vocabularies:
    get:
      operationId: getVocabularies
      summary: Read every enumeration the UI renders
      tags:
        - tenant
      responses:
        '200':
          description: Every vocabulary, keyed by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vocabularies'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tenants/{tenantId}/overview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getOverview
      summary: Read the tenant's state, counts and work in progress
      tags:
        - tenant
      responses:
        '200':
          description: The tenant overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tenants/{tenantId}/catalog:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getCatalog
      summary: Read the names and ids every picker and cross-module link resolves against
      description: One catalog for every module, cached by the client on `tenant.semanticRevision` (OI-13). Report-owned dimensions and bridges are included only so references resolve; pickers and lists never offer them (OI-22).
      tags:
        - tenant
      responses:
        '200':
          description: The tenant catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tenants/{tenantId}/dimensions/{dimensionId}/published-members:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: dimensionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getPublishedMembers
      summary: Read the members of a dimension's published version
      tags:
        - tenant
      responses:
        '200':
          description: The published version's members, in hierarchy order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedMembers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The dimension does not exist or has no published version.
  /api/system/tenants:
    get:
      operationId: listSystemTenants
      summary: List every tenant in the directory
      tags:
        - tenant
      responses:
        '200':
          description: The directory entries, ordered by tenant id, with masked connection strings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantDirectoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSystemTenant
      summary: Register a tenant after verifying its connection string
      tags:
        - tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateInput'
      responses:
        '201':
          description: The tenant was registered; the body is its entry with a masked connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDirectoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: A field breaks a rule; a `connectionString` error gives the reason verification failed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/system/tenants/verify:
    post:
      operationId: verifySystemTenantConnection
      summary: Test a connection string for a tenant without storing it
      description: The connection must open, and its `qe_database_info` must name the tenant and have the metadata schema version this API supports.
      tags:
        - tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantVerifyInput'
      responses:
        '200':
          description: The test ran; `isValid` and `message` give its outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConnectionCheck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/system/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getSystemTenant
      summary: Read one tenant's directory entry
      tags:
        - tenant
      responses:
        '200':
          description: The directory entry with a masked connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDirectoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The directory has no such tenant.
    put:
      operationId: updateSystemTenant
      summary: Change a tenant's provider, cache lifetime and connection string
      tags:
        - tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateInput'
      responses:
        '200':
          description: The updated entry with a masked connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDirectoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: A field breaks a rule; a `connectionString` error gives the reason verification failed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The directory has no such tenant.
  /api/system/tenants/{tenantId}/enabled:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    put:
      operationId: setSystemTenantEnabled
      summary: Permit or stop query routing for a tenant
      tags:
        - tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantEnabledInput'
      responses:
        '200':
          description: The updated entry with a masked connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDirectoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The directory has no such tenant.
  /api/tenants/{tenantId}/source-objects:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listSourceObjects
      summary: List the tables and views of the tenant database
      tags:
        - datasets
      responses:
        '200':
          description: Every table and view, with live storage statistics (OI-34).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetSourceObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tenants/{tenantId}/source-objects/{kind}/{name}/columns:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetSourceObjectKindPath'
      - $ref: '#/components/parameters/DatasetSourceObjectNamePath'
    get:
      operationId: getSourceColumns
      summary: List the columns of a table or view
      tags:
        - datasets
      responses:
        '200':
          description: The object's columns in ordinal order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetSourceColumn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: No table or view of that kind and name.
  /api/tenants/{tenantId}/datasets:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listDatasets
      summary: List datasets with their version summaries
      tags:
        - datasets
      responses:
        '200':
          description: Every dataset of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createDataset
      summary: Create a dataset and its draft version 1
      description: Mode `existing` registers a table or view that already exists. Mode `new` creates a managed table (OI-33) with the given columns, then a draft whose fields read them.
      tags:
        - datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreateInput'
      responses:
        '201':
          description: The dataset, with draft version 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The dataset key or table name is taken.
  /api/tenants/{tenantId}/datasets/{datasetId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetIdPath'
    get:
      operationId: getDataset
      summary: Get one dataset with its version summaries
      tags:
        - datasets
      responses:
        '200':
          description: The dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDataset
      summary: Delete a dataset and all its versions
      description: Allowed only when every version is a draft or validated and no release lists the dataset (D10, OI-17).
      tags:
        - datasets
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Delete blocked; `violations` are the reasons of the delete check.
  /api/tenants/{tenantId}/datasets/{datasetId}/delete-check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetIdPath'
    get:
      operationId: checkDeleteDataset
      summary: Tell whether a dataset can be deleted, and why not
      description: Never writes. Reasons carry the codes `dataset_version_not_deletable` (a version is published or retired) and `dataset_in_release` (a release lists the dataset).
      tags:
        - datasets
      responses:
        '200':
          description: The delete check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCheck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/datasets/{datasetId}/versions:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetIdPath'
    post:
      operationId: createDatasetDraft
      summary: Create a draft version, empty or cloned from another version of the dataset
      tags:
        - datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreateDraftInput'
      responses:
        '201':
          description: The new draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The dataset already has an open (draft or validated) version (OI-23).
  /api/tenants/{tenantId}/dataset-versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    get:
      operationId: getDatasetVersion
      summary: Get the whole content of one dataset version
      tags:
        - datasets
      responses:
        '200':
          description: Settings, fields, grains, bindings, measures and dependents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDatasetDraft
      summary: Delete a draft or validated version that no release pins
      tags:
        - datasets
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The version is published or retired, or a release pins it.
  /api/tenants/{tenantId}/dataset-versions/{versionId}/changes/preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: previewDatasetChanges
      summary: Apply staged operations to a dataset version in memory and return the result
      description: Never writes. `errors` keys of a refused operation are prefixed `operations[n].` (OI-01).
      tags:
        - datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetChangeSetRequest'
      responses:
        '200':
          description: The operations apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetChangeSetPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Not a draft (only `updateDataset` applies then), not a managed table, or an item delete is blocked by its dependents.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /api/tenants/{tenantId}/dataset-versions/{versionId}/changes:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: commitDatasetChanges
      summary: Apply and write staged operations to a dataset version
      description: Replays the operations onto the stored version (last write wins, OI-02) and writes them; any failure writes nothing except DDL already run for `createColumn`, which leaves an unread column.
      tags:
        - datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetChangeSetRequest'
      responses:
        '200':
          description: Every operation applied and was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetChangeSetCommit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Not a draft (only `updateDataset` applies then), not a managed table, or an item delete is blocked by its dependents.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /api/tenants/{tenantId}/dataset-versions/{versionId}/check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: checkDatasetVersion
      summary: Run the publication rules on a dataset version without writing
      description: 'Rule codes: `source_object_exists`, `version_supports_a_mode`, `default_time_binding_in_version`, `field_key_unique`, `field_columns_exist`, `expression_field_references`, `expression_field_acyclic`, `grain_key_unique`, `grain_fields_in_version`, `series_grain_excludes_time_field`, `binding_fields_in_version`, `binding_source_field_groupable`, `bound_roles_distinct`, `mapped_binding_mapping_set_dimension`, `range_binding_dimension_kind`, `time_binding_dimension_kind`, `bridge_binding_route`, `unknown_members_in_version`, `interval_estimates_for_finer_periods`, `measure_key_unique`, `component_fields_in_version`, `component_roles_match_kind`, `formula_references_known_measures`, `formula_acyclic`, `time_policy_series_grain`, `time_policy_time_binding_in_version`. Each violation''s `target.area` is a `DatasetTab`.'
      tags:
        - datasets
      responses:
        '200':
          description: The rule report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/dataset-versions/{versionId}/validate:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: validateDatasetVersion
      summary: Move a draft to validated when every publication rule passes
      tags:
        - datasets
      responses:
        '200':
          description: The validated version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Not a draft.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: A publication rule fails; nothing was written.
  /api/tenants/{tenantId}/dataset-versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: publishDatasetVersion
      summary: Publish a draft or validated version when every publication rule passes
      description: A draft is validated first, in the same call.
      tags:
        - datasets
      responses:
        '200':
          description: The published version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Not a draft or validated.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: A publication rule fails; nothing was written.
  /api/tenants/{tenantId}/dataset-versions/{versionId}/reopen:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: reopenDatasetVersion
      summary: Return a validated version to draft
      tags:
        - datasets
      responses:
        '200':
          description: The draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Not validated.
  /api/tenants/{tenantId}/dataset-versions/{versionId}/retire:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: retireDatasetVersion
      summary: Retire a published version that the active release does not pin
      tags:
        - datasets
      responses:
        '200':
          description: The retired version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Not published.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: The active release pins the version.
  /api/tenants/{tenantId}/dataset-versions/{versionId}/fields/{fieldId}/materialization:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
      - $ref: '#/components/parameters/DatasetFieldIdPath'
    post:
      operationId: materializeDatasetField
      summary: Add a JSON path field to its source object's materialized view
      description: 'Returns at once with `materialization.state` = `building`; poll the version for `ready` or `failed` (OI-32). Allowed on any non-retired version: storage does not change what the version means.'
      tags:
        - datasets
      responses:
        '200':
          description: The field with its materialization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetField'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The version is retired or the field is not a JSON path field.
    delete:
      operationId: dematerializeDatasetField
      summary: Remove a field's column from the materialized view
      description: The field reads the JSON path again; the view is dropped when no column is left.
      tags:
        - datasets
      responses:
        '200':
          description: The field, with `materialization` null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetField'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The version is retired or the field is not a JSON path field.
  /api/tenants/{tenantId}/dataset-versions/{versionId}/fields/{fieldId}/materialization/refresh:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
      - $ref: '#/components/parameters/DatasetFieldIdPath'
    post:
      operationId: refreshDatasetFieldMaterialization
      summary: Trigger a refresh of a materialized field
      tags:
        - datasets
      responses:
        '200':
          description: The field, with `materialization.state` = `building`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetField'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The version is retired or the field is not materialized.
  /api/tenants/{tenantId}/calculation-models:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listModels
      summary: List the tenant's calculation models with their metric counts and the reports that read them.
      tags:
        - models
      responses:
        '200':
          description: Every model of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelListItem'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createModel
      summary: Create a disabled, empty calculation model (command).
      tags:
        - models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalcModelCreateInput'
      responses:
        '201':
          description: The created model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalcModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The model key is taken.
  /api/tenants/{tenantId}/calculation-models/{modelId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ModelId'
    get:
      operationId: getModel
      summary: Read one model with its variables, measures, parameters, attributions, effective drivers and readers.
      tags:
        - models
      responses:
        '200':
          description: The model document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDocument'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteModel
      summary: Delete a model that no report reads (command, C8).
      tags:
        - models
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: A report reads the model; `violations` carry `model_not_in_use` per report.
  /api/tenants/{tenantId}/calculation-models/{modelId}/delete-check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ModelId'
    get:
      operationId: checkDeleteModel
      summary: Whether the model can be deleted, and the reports that block it.
      tags:
        - models
      responses:
        '200':
          description: The delete check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCheck'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/calculation-models/{modelId}/formula-check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ModelId'
    post:
      operationId: checkFormula
      summary: Parse a formula against the saved model and report errors, reads, parameters and the language it needs (OI-43).
      tags:
        - models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelFormulaCheckRequest'
      responses:
        '200':
          description: The check result; never writes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelFormulaCheck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/calculation-models/{modelId}/changes/preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ModelId'
    post:
      operationId: previewModelChanges
      summary: Apply the staged operations in memory and run the model gate; never writes (OI-42).
      tags:
        - models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelChangeSetRequest'
      responses:
        '200':
          description: The operations apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelChangeSetPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: The last operation introduces a violation of a model rule or of a report rule of an enabled report over the model; it is refused.
  /api/tenants/{tenantId}/calculation-models/{modelId}/changes:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ModelId'
    post:
      operationId: commitModelChanges
      summary: Re-run the model gate over the staged operations and write them as one batch.
      tags:
        - models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelChangeSetRequest'
      responses:
        '200':
          description: Every operation applied and was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelChangeSetCommit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: An operation introduces a model-rule or enabled-report violation; nothing was written.
  /api/tenants/{tenantId}/reports:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listReports
      summary: List the tenant's reports.
      tags:
        - reports
      responses:
        '200':
          description: Every report, enabled or not.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createReport
      summary: Create a report, its report dimension and, when copying, its content.
      description: A new report starts disabled. Without `startFromDimensionId` or `copyFromReportId` its report dimension has a single root row. `startFromDimensionId` copies the published members of a categorical or hierarchical dimension. `copyFromReportId` copies another report's rows, sources, report bridges and content; with a `modelId` other than that report's, whatever does not resolve in the new model is dropped (OI-47).
      tags:
        - reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreateInput'
      responses:
        '201':
          description: The report was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The report key is taken.
  /api/tenants/{tenantId}/reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReportId'
    get:
      operationId: getReport
      summary: Read a report's whole document.
      tags:
        - reports
      responses:
        '200':
          description: The report as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteReport
      summary: Delete a report with its report dimension, report bridges and content.
      description: Never blocked (P12).
      tags:
        - reports
      responses:
        '204':
          description: The report and everything it owns were deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/reports/{reportId}/diagnostics:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReportId'
    get:
      operationId: getReportDiagnostics
      summary: Check the stored report against the report rules, with coverage and profile resolution.
      description: Serves the port's `getDiagnostics`. Pending edits are diagnosed by the change-set preview instead.
      tags:
        - reports
      responses:
        '200':
          description: The diagnostics of the stored report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDiagnostics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/reports/{reportId}/sources/{sourceKey}/unmapped:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReportId'
      - $ref: '#/components/parameters/ReportSourceKey'
    get:
      operationId: getReportUnmappedItems
      summary: List the items a source reads that reach no row and are not left out.
      description: Serves the port's `getUnmappedItems`. Bridge sources list members of the role's dimension; direct sources list values of the field that are not row keys.
      tags:
        - reports
      responses:
        '200':
          description: Item keys, in the source dimension's order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: No such report, or the report has no source with that key.
  /api/tenants/{tenantId}/reports/{reportId}/changes/preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReportId'
    post:
      operationId: previewReportChanges
      summary: Apply staged report operations in memory and return the resulting document and diagnostics.
      description: Never writes. Serves every edit method of the port (01, Change-set protocol).
      tags:
        - reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportChangeSetRequest'
      responses:
        '200':
          description: Every operation applies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportChangeSetPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: An operation names a row, source, profile, dimension or style the report does not have.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: The report is enabled and the result fails the report gate, or a cascade is refused.
  /api/tenants/{tenantId}/reports/{reportId}/changes:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReportId'
    post:
      operationId: commitReportChanges
      summary: Apply and write staged report operations as one batch.
      description: Replays the operations onto the stored report; any failure writes nothing. Serves `commitChanges`.
      tags:
        - reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportChangeSetRequest'
      responses:
        '200':
          description: Every operation applied and was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportChangeSetCommit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: An operation names a row, source, profile, dimension or style the report does not have.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: The report is enabled and the result fails the report gate, or a cascade is refused.
  /api/tenants/{tenantId}/reports/{reportId}/enabled:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReportId'
    put:
      operationId: setReportEnabled
      summary: Enable or disable a report.
      description: Serves the port's `setEnabled`. Enabling runs every report rule on the stored report.
      tags:
        - reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportEnabledInput'
      responses:
        '200':
          description: The report's new state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: A report rule fails; the report stays disabled.
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A JWT carrying `sub`, exactly one `tenant_id`, and `role: SystemAdmin` for callers who may reach any tenant (blueprint 01, Authentication and authorization).'
  schemas:
    Id:
      type: string
      description: Opaque identifier. Tables use BIGINT ids below 2^53; the API serializes them as strings. Inside a change set, an item created by an earlier operation is referenced by its client-generated temporary id, `tmp:<uuid>`.
      examples:
        - '1042'
    Key:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_]*$
      description: Natural key, fixed after creation (OI-29, OI-36).
    DottedKey:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_.]*$
      description: Natural key of a mapping set or bridge; also allows `.` (OI-29).
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC timestamp.
    VersionStatus:
      type: string
      enum:
        - draft
        - validated
        - published
        - retired
    Problem:
      type: object
      description: The one error body (`application/problem+json`) for every 4xx and 5xx response (OI-06). 400 carries `errors`; 409 carries `violations` for delete blockers and `detail` otherwise; 422 carries `violations`; 401, 403 and 404 carry the title only; 500 carries `traceId`.
      required:
        - type
        - title
        - status
        - errors
      properties:
        type:
          type: string
          format: uri
          description: Stable problem code.
          examples:
            - urn:qe:problem:rules-violated
        title:
          type: string
          description: Short, user-facing summary.
        status:
          type: integer
          enum:
            - 400
            - 401
            - 403
            - 404
            - 409
            - 422
            - 500
        detail:
          type: string
        errors:
          type: object
          description: Input path to messages. `''` is the form-level key. Paths are camelCase, dotted and indexed (`components[0].fieldId`); inside a change set they are prefixed by the failing operation (`operations[3].memberKey`).
          additionalProperties:
            type: array
            items:
              type: string
        violations:
          type: array
          description: Rule violations (422) and delete blockers (409).
          items:
            $ref: '#/components/schemas/Violation'
        traceId:
          type: string
    Violation:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: The rule code, snake_case.
          examples:
            - member_key_unique
        message:
          type: string
          description: Phrased for display.
        target:
          $ref: '#/components/schemas/ViolationTarget'
    ViolationTarget:
      type: object
      description: Where to take the user to fix a violation.
      required:
        - area
      properties:
        area:
          type: string
          description: Module-specific area such as a dataset tab, a dimension tab, a release manifest row or a report section.
        itemId:
          $ref: '#/components/schemas/Id'
        itemKey:
          type: string
        filter:
          type: string
          description: Search text that narrows a table to the offending rows.
    DeleteCheck:
      type: object
      description: Answer of `GET <resource>/delete-check`; `DELETE <resource>` answers 409 with the same violations when blocked (OI-07).
      required:
        - allowed
        - message
        - reasons
      properties:
        allowed:
          type: boolean
        message:
          type:
            - string
            - 'null'
          description: One-sentence summary when blocked.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    ValidationReport:
      type: object
      description: Answer of a read-only `check`; never writes.
      required:
        - versionId
        - checkedAt
        - violations
      properties:
        versionId:
          $ref: '#/components/schemas/Id'
        checkedAt:
          $ref: '#/components/schemas/Timestamp'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    ChangeSetRequest:
      type: object
      description: 'Body of `POST <aggregate>/changes/preview` and `POST <aggregate>/changes` (OI-01). Generic over the aggregate''s operation union: an aggregate specializes it with `allOf` and a narrowed `operations.items` (see README.md).'
      required:
        - operations
      properties:
        operations:
          type: array
          items:
            description: One operation of the aggregate's union, discriminated by `op`.
    ChangeSetPreview:
      type: object
      description: '200 answer of `POST <aggregate>/changes/preview`: the operations apply. Generic over the aggregate content: an aggregate specializes it with `allOf` and a narrowed `state`.'
      required:
        - state
        - violations
      properties:
        state:
          description: The aggregate content after the operations apply; what the editor renders.
        violations:
          type: array
          description: Publication-rule findings that do not block saving.
          items:
            $ref: '#/components/schemas/Violation'
    ChangeSetCommit:
      type: object
      description: '200 answer of `POST <aggregate>/changes`: every operation applied and was written. Generic over the aggregate content: an aggregate specializes it with `allOf` and a narrowed `state`.'
      required:
        - state
        - idMap
      properties:
        state:
          description: The aggregate content as stored after the commit.
        idMap:
          type: object
          description: Temporary id (`tmp:<uuid>`) to the real id of each item the commit created.
          additionalProperties:
            $ref: '#/components/schemas/Id'
    VocabularyTerm:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
          description: The schema's value.
        label:
          type: string
        description:
          type: string
    Session:
      type: object
      description: Who the caller is, as the API sees its bearer token. There are no tenant roles (OI-09).
      required:
        - subject
        - displayName
        - tenantId
        - isSystemAdmin
      properties:
        subject:
          type: string
          description: The token's `sub`.
        displayName:
          type:
            - string
            - 'null'
          description: The token's name claim; null when it carries none.
        tenantId:
          type:
            - string
            - 'null'
          description: The caller's tenant when the token carries exactly one tenant claim; otherwise null.
        isSystemAdmin:
          type: boolean
          description: Whether the caller may reach every tenant and the tenant directory.
    AccessibleTenant:
      type: object
      required:
        - tenantId
        - isEnabled
      properties:
        tenantId:
          type: string
          description: The tenant directory key.
        isEnabled:
          type: boolean
          description: Whether query routing is permitted for the tenant.
    TenantInfo:
      type: object
      description: The tenant database's identity and the revision the engine keys its metadata cache by.
      required:
        - tenantKey
        - metadataSchemaVersion
        - semanticRevision
        - activeReleaseId
      properties:
        tenantKey:
          type: string
          description: '`qe_database_info.tenant_key`.'
        metadataSchemaVersion:
          type: integer
        semanticRevision:
          type: integer
          format: int64
          description: Advances once per commit or command that changes what the engine reads.
        activeReleaseId:
          type:
            - string
            - 'null'
          description: The release runtime queries use; null when the tenant has none.
    TenantOverview:
      description: The tenant at a glance for the overview screen.
      allOf:
        - $ref: '#/components/schemas/TenantInfo'
        - type: object
          required:
            - counts
            - drafts
          properties:
            counts:
              $ref: '#/components/schemas/TenantOverviewCounts'
            drafts:
              $ref: '#/components/schemas/TenantOverviewDrafts'
    TenantOverviewCounts:
      type: object
      description: How much metadata the tenant holds.
      required:
        - datasets
        - dimensions
        - mappingSets
        - bridges
        - releases
        - assumptionSets
        - models
        - reports
        - activeMeasures
      properties:
        datasets:
          type: integer
        dimensions:
          type: integer
          description: Analytical dimensions; report-owned dimensions are not counted (OI-22).
        mappingSets:
          type: integer
        bridges:
          type: integer
          description: Analytical bridges; report-owned bridges are not counted (OI-22).
        releases:
          type: integer
        assumptionSets:
          type: integer
        models:
          type: integer
        reports:
          type: integer
        activeMeasures:
          type: integer
          description: Measures of the dataset versions the active release pins.
    TenantOverviewDrafts:
      type: object
      description: 'Work in progress: the kinds that still have a draft status. Dimensions, mapping sets and bridges follow the living lifecycle and have no drafts (OI-14).'
      required:
        - datasetVersions
        - releases
      properties:
        datasetVersions:
          type: integer
        releases:
          type: integer
    TenantCatalog:
      type: object
      description: The union of what every module's pickers and cross-module links read (OI-13).
      required:
        - tenant
        - datasets
        - dimensions
        - roles
        - mappingSets
        - bridges
        - models
        - reports
        - releases
        - assumptionSets
      properties:
        tenant:
          $ref: '#/components/schemas/TenantInfo'
        datasets:
          type: array

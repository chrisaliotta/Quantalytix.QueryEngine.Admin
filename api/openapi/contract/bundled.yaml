      required:
        - versionStatus
        - assumptionSetStatus
        - dataType
        - measureOutputDataType
        - sourceObjectKind
        - fieldSourceKind
        - grainKind
        - dimensionKind
        - dimensionPurpose
        - definitionOrigin
        - rangeDataType
        - editPolicy
        - bindingKind
        - groupingMode
        - raggedBehavior
        - periodAlignment
        - unmappedBehavior
        - timeValueType
        - observationKind
        - periodicity
        - cumulativeOrigin
        - measureKind
        - aggregationFunction
        - componentRole
        - componentRolesByKind
        - valueNullBehavior
        - negativeWeightBehavior
        - emptySetBehavior
        - bridgeFactorBehavior
        - bridgeAllocationBehavior
        - totalBehavior
        - roundingMode
        - observationSelection
        - valueTimeRole
        - boundaryMatch
        - durationUnit
        - partialIntervalBehavior
        - missingPeriodBehavior
        - expressionLanguageVersion
        - timeZone
        - cardinality
        - allocationMode
        - sourceSelection
        - formulaLanguageVersion
        - attributionMethod
        - parameterValueType
        - variableMissingBehavior
        - dayCountConvention
        - displayFormat
        - mappingMethod
        - selectionScope
        - columnValueKind
        - subtotalPosition
        - styleRole
        - fontWeight
        - borderStyle
        - layout
        - provider
      properties:
        versionStatus:
          type: array
          items:
            allOf:

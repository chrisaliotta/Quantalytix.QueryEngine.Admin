          type: string
        columnName:
          type: string
        state:
          $ref: '#/components/schemas/DatasetMaterializationState'
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        refreshedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        error:
          type:
            - string
            - 'null'
    DatasetFieldDefinition:
      type: object
      description: The writable content of a field, shared by `DatasetField` and `DatasetFieldInput`.
      required:
        - key
        - displayName
        - fieldSourceKind
        - sourceColumn
        - jsonPath
        - expressionText
        - dataType
        - numericPrecision
        - numericScale
        - isNullable
        - unitKey
        - isSelectable
        - isFilterable
        - isSortable
        - isGroupable
        - isEnabled
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        fieldSourceKind:
          $ref: '#/components/schemas/DatasetFieldSourceKind'
        sourceColumn:
          type:
            - string
            - 'null'
        jsonPath:
          type:
            - string
            - 'null'
        expressionText:
          type:
            - string
            - 'null'
        dataType:
          $ref: '#/components/schemas/DatasetDataType'
        numericPrecision:
          type:
            - integer
            - 'null'
        numericScale:
          type:
            - integer
            - 'null'
        isNullable:
          type: boolean
        unitKey:
          type:
            - string
            - 'null'
        isSelectable:
          type: boolean
        isFilterable:
          type: boolean
        isSortable:
          type: boolean
        isGroupable:
          type: boolean
        isEnabled:
          type: boolean
    DatasetField:
      allOf:
        - type: object
          required:
            - id
            - materialization
          properties:
            id:
              $ref: '#/components/schemas/Id'
            materialization:
              oneOf:
                - $ref: '#/components/schemas/DatasetFieldMaterialization'
                - type: 'null'
              description: JSON path fields only; managed by the materialization sub-resource, not by `saveField`.
        - $ref: '#/components/schemas/DatasetFieldDefinition'

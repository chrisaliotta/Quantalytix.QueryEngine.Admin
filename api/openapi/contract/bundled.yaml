        unitKey:
          type:
            - string
            - 'null'
        accumulatorPrecision:
          type: integer
        accumulatorScale:
          type: integer
        timePolicy:
          oneOf:
            - $ref: '#/components/schemas/DatasetMeasureTimePolicy'
            - type: 'null'
    DatasetMeasure:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              $ref: '#/components/schemas/Id'
        - $ref: '#/components/schemas/DatasetMeasureDefinition'
    DatasetMeasureInput:
      allOf:
        - $ref: '#/components/schemas/DatasetMeasureDefinition'
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/Id'
              description: Absent or temporary (`tmp:<uuid>`) to create; a stored id to update.
    DatasetNewColumnInput:
      type: object
      description: A physical column the API creates; each one also becomes a column field of the same name.
      required:
        - name
        - dataType
        - numericPrecision
        - numericScale
        - isNullable
      properties:
        name:
          type: string
        dataType:
          $ref: '#/components/schemas/DatasetDataType'
        numericPrecision:
          type:
            - integer
            - 'null'
        numericScale:
          type:
            - integer
            - 'null'
        isNullable:
          type: boolean
    DatasetCreateInput:
      oneOf:
        - $ref: '#/components/schemas/DatasetCreateFromExistingInput'
        - $ref: '#/components/schemas/DatasetCreateWithNewTableInput'
      discriminator:
        propertyName: mode
        mapping:
          existing: '#/components/schemas/DatasetCreateFromExistingInput'
          new: '#/components/schemas/DatasetCreateWithNewTableInput'
    DatasetCreateFromExistingInput:
      type: object
      description: Registers a table or view that already exists in the tenant database.
      required:
        - mode
        - key
        - displayName
        - sourceObjectKind
        - sourceObject
      properties:
        mode:
          const: existing
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        sourceObjectKind:
          $ref: '#/components/schemas/DatasetSourceObjectKind'
        sourceObject:
          type: string
    DatasetCreateWithNewTableInput:
      type: object
      description: Creates and registers a managed table with these columns (possibly none), then a draft whose fields read them.
      required:
        - mode
        - key
        - displayName
        - tableName
        - columns
      properties:
        mode:
          const: new
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        tableName:
          type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/DatasetNewColumnInput'
    DatasetCreateDraftInput:
      oneOf:
        - $ref: '#/components/schemas/DatasetCreateEmptyDraftInput'
        - $ref: '#/components/schemas/DatasetCloneDraftInput'
      discriminator:
        propertyName: mode
        mapping:
          empty: '#/components/schemas/DatasetCreateEmptyDraftInput'
          clone: '#/components/schemas/DatasetCloneDraftInput'
    DatasetCreateEmptyDraftInput:
      type: object
      required:
        - mode
        - sourceObjectKind
        - sourceObject
      properties:
        mode:
          const: empty
        sourceObjectKind:
          $ref: '#/components/schemas/DatasetSourceObjectKind'
        sourceObject:
          type: string
    DatasetCloneDraftInput:
      type: object
      required:
        - mode
        - fromVersionId
      properties:
        mode:
          const: clone
        fromVersionId:
          $ref: '#/components/schemas/Id'
    DatasetOperation:
      description: One staged edit of a dataset version, named after the `DatasetsApi` edit method it records.
      oneOf:
        - $ref: '#/components/schemas/DatasetUpdateDatasetOperation'
        - $ref: '#/components/schemas/DatasetSaveSettingsOperation'
        - $ref: '#/components/schemas/DatasetRenameSourceTableOperation'
        - $ref: '#/components/schemas/DatasetSaveFieldOperation'
        - $ref: '#/components/schemas/DatasetDeleteFieldOperation'
        - $ref: '#/components/schemas/DatasetAddFieldsFromColumnsOperation'
        - $ref: '#/components/schemas/DatasetSaveGrainOperation'
        - $ref: '#/components/schemas/DatasetDeleteGrainOperation'
        - $ref: '#/components/schemas/DatasetSaveBindingOperation'
        - $ref: '#/components/schemas/DatasetDeleteBindingOperation'
        - $ref: '#/components/schemas/DatasetSaveMeasureOperation'
        - $ref: '#/components/schemas/DatasetDeleteMeasureOperation'
      discriminator:
        propertyName: op
        mapping:
          updateDataset: '#/components/schemas/DatasetUpdateDatasetOperation'
          saveSettings: '#/components/schemas/DatasetSaveSettingsOperation'
          renameSourceTable: '#/components/schemas/DatasetRenameSourceTableOperation'
          saveField: '#/components/schemas/DatasetSaveFieldOperation'
          deleteField: '#/components/schemas/DatasetDeleteFieldOperation'
          addFieldsFromColumns: '#/components/schemas/DatasetAddFieldsFromColumnsOperation'
          saveGrain: '#/components/schemas/DatasetSaveGrainOperation'
          deleteGrain: '#/components/schemas/DatasetDeleteGrainOperation'
          saveBinding: '#/components/schemas/DatasetSaveBindingOperation'
          deleteBinding: '#/components/schemas/DatasetDeleteBindingOperation'
          saveMeasure: '#/components/schemas/DatasetSaveMeasureOperation'
          deleteMeasure: '#/components/schemas/DatasetDeleteMeasureOperation'
    DatasetUpdateDatasetOperation:
      type: object
      description: Edits the dataset identity; the only operation a version that is not a draft accepts.
      required:
        - op
        - patch
      properties:
        op:
          const: updateDataset
        patch:
          $ref: '#/components/schemas/DatasetPatch'
    DatasetSaveSettingsOperation:
      type: object
      required:
        - op
        - settings
      properties:
        op:
          const: saveSettings
        settings:
          $ref: '#/components/schemas/DatasetVersionSettings'
    DatasetRenameSourceTableOperation:
      type: object
      description: Renames the managed table the draft reads; refused while a published version reads it (OI-33).
      required:
        - op
        - tableName
      properties:
        op:
          const: renameSourceTable
        tableName:
          type: string
    DatasetSaveFieldOperation:
      type: object
      required:
        - op
        - input
      properties:
        op:
          const: saveField
        input:
          $ref: '#/components/schemas/DatasetFieldInput'
    DatasetDeleteFieldOperation:
      type: object
      required:
        - op
        - fieldId
      properties:
        op:
          const: deleteField
        fieldId:
          $ref: '#/components/schemas/Id'
    DatasetAddFieldsFromColumnsOperation:
      type: object
      description: Creates one column field per named column. The created fields carry temporary ids that stay the same on every replay of the same operation list.
      required:
        - op
        - columns
      properties:
        op:
          const: addFieldsFromColumns
        columns:
          type: array
          items:
            type: string
    DatasetSaveGrainOperation:
      type: object
      required:
        - op
        - input
      properties:
        op:
          const: saveGrain
        input:
          $ref: '#/components/schemas/DatasetGrainInput'
    DatasetDeleteGrainOperation:
      type: object
      required:
        - op
        - grainId
      properties:
        op:
          const: deleteGrain
        grainId:
          $ref: '#/components/schemas/Id'
    DatasetSaveBindingOperation:
      type: object
      required:
        - op
        - input
      properties:
        op:
          const: saveBinding
        input:
          $ref: '#/components/schemas/DatasetBindingInput'
    DatasetDeleteBindingOperation:
      type: object
      required:
        - op
        - bindingId
      properties:
        op:
          const: deleteBinding
        bindingId:
          $ref: '#/components/schemas/Id'
    DatasetSaveMeasureOperation:
      type: object
      required:
        - op
        - input
      properties:
        op:
          const: saveMeasure
        input:
          $ref: '#/components/schemas/DatasetMeasureInput'
    DatasetDeleteMeasureOperation:
      type: object
      required:
        - op
        - measureId
      properties:
        op:
          const: deleteMeasure
        measureId:
          $ref: '#/components/schemas/Id'
    DatasetChangeSetRequest:
      allOf:
        - $ref: '#/components/schemas/ChangeSetRequest'
        - type: object
          required:
            - operations
          properties:
            operations:
              type: array
              items:
                $ref: '#/components/schemas/DatasetOperation'
    DatasetChangeSetPreview:
      allOf:
        - $ref: '#/components/schemas/ChangeSetPreview'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/DatasetVersion'
    DatasetChangeSetCommit:
      allOf:
        - $ref: '#/components/schemas/ChangeSetCommit'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/DatasetVersion'
    DimensionEditPolicy:
      type: string
      enum:
        - open
        - extend
        - locked
      description: '`locked` refuses every edit and freeze (changed through provisioning, OI-24); `extend` refuses deleting or re-keying a required member or role; `open` allows everything except delete (M11).'
    RangeDataType:
      type: string
      enum:
        - decimal
        - date
        - datetime
    DimensionTab:
      type: string
      enum:
        - properties
        - members
        - levels
        - bands
        - roles
        - mappings
        - bridges
        - usage
      description: Areas of the dimension editor; the values of `ViolationTarget.area` in this module.
    DimensionViolationCode:
      type: string
      enum:
        - range_data_type_matches_kind
        - level_key_unique
        - member_key_unique
        - member_parent_in_version
        - member_level_in_version
        - hierarchy_acyclic
        - band_boundary_family
        - band_bounds_ordered
        - bands_non_overlapping
        - band_open_bounds_at_ends
        - band_member_in_version
        - dimension_consumers_resolve
        - profile_required_keys_present
        - profile_properties_valid
      description: Rule codes of this module's `Violation.code`.
    DimensionUsageKind:
      type: string
      enum:
        - dataset_binding
        - mapping_set
        - bridge
        - calculation_dimension
        - report_scenario
        - report_source
        - assumption_set
    DimensionPropertyField:
      type: object
      description: One member property of a profile's schema; the server validates system dimension members against it (OI-18).
      required:
        - key
        - label
        - type
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
            - text
            - number
            - date
            - url
            - image
            - select
            - geo
            - boolean
        options:
          type: array
          description: Choices of a `select` field.
          items:
            type: string
        required:
          type: boolean
        description:
          type: string
        format:
          type: string
          enum:
            - geojson
          description: A text field holding GeoJSON.
    DimensionProfile:
      type: object
      description: A system dimension type from the code registry (OI-16). A system dimension always has one; a user dimension never does.
      required:
        - key
        - displayName
        - kind
        - owner
        - editPolicy
        - visibility
        - requiredRoleKeys
        - requiredMemberKeys
        - memberPropertySchema
        - cardinality
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        kind:
          $ref: '#/components/schemas/DimensionKind'
        owner:
          type: string
          description: The product module that owns the profile.
        editPolicy:
          $ref: '#/components/schemas/DimensionEditPolicy'
        visibility:
          type: string
          enum:
            - manager
            - module
            - hidden
        requiredRoleKeys:
          type: array
          items:
            type: string
        requiredMemberKeys:
          type: array
          items:
            type: string
        memberPropertySchema:
          type: array
          items:
            $ref: '#/components/schemas/DimensionPropertyField'
        cardinality:
          type: string
          enum:
            - one
            - many
        seedNames:
          type: object
          description: Display names of required members and roles, used when the profile is defined.
          additionalProperties:
            type: string
        singleRole:
          type: boolean
          description: Refuses a second role unconditionally (OI-20).
    AvailableDimensionProfile:
      type: object
      required:
        - profile
        - dimensionId
      properties:
        profile:
          $ref: '#/components/schemas/DimensionProfile'
        dimensionId:
          type:
            - string
            - 'null'
          description: The dimension defined from the profile; null when not defined yet.
    Dimension:
      type: object
      required:
        - id
        - key
        - displayName
        - kind
        - origin
        - purpose
        - ownerReport
        - profileKey
        - isEnabled
        - isRemovable
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        kind:
          $ref: '#/components/schemas/DimensionKind'
        origin:
          $ref: '#/components/schemas/DefinitionOrigin'
        purpose:
          $ref: '#/components/schemas/DimensionPurpose'
        ownerReport:
          description: Set only when purpose is `report`.
          oneOf:
            - $ref: '#/components/schemas/DimensionOwnerReport'
            - type: 'null'
        profileKey:
          type:
            - string
            - 'null'
          description: The profile of a system dimension (SG-03); null for user dimensions.
        isEnabled:
          type: boolean
        isRemovable:
          type: boolean
    DimensionOwnerReport:
      type: object
      required:
        - reportKey
        - reportName
      properties:
        reportKey:
          $ref: '#/components/schemas/DottedKey'
        reportName:
          type: string
    DimensionVersion:
      type: object
      description: Live (stored `published`, exactly one, edited in place) or frozen (stored `retired`, read-only). There are no drafts (M3, OI-14).
      required:
        - id
        - dimensionId
        - versionNumber
        - status
        - rangeDataType
        - createdAt
        - publishedAt
        - retiredAt
        - supersededBy
        - freezeNote
      properties:
        id:
          $ref: '#/components/schemas/Id'
        dimensionId:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        rangeDataType:
          description: Range dimensions only.
          oneOf:
            - $ref: '#/components/schemas/RangeDataType'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        retiredAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the version was frozen (SG-04).
        supersededBy:
          type:
            - integer
            - 'null'
          description: Derived; the next version number once frozen (OI-12).
        freezeNote:
          type:
            - string
            - 'null'
          description: Why the version was frozen (SG-05, OI-15).
    DimensionVersionSummary:
      type: object
      required:
        - id
        - versionNumber
        - status
        - publishedAt
        - retiredAt
        - supersededBy
        - freezeNote
        - memberCount
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        retiredAt:
          type:
            - string
            - 'null'
          format: date-time
        supersededBy:
          type:
            - integer
            - 'null'
        freezeNote:
          type:
            - string
            - 'null'
        memberCount:
          type: integer
    DimensionRole:
      type: object
      required:
        - id
        - dimensionId
        - key
        - displayName
        - description
      properties:
        id:
          $ref: '#/components/schemas/Id'
        dimensionId:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        description:
          type:
            - string
            - 'null'
    DimensionLevel:
      type: object
      required:
        - id
        - versionId
        - key
        - displayName
        - ordinal
        - isLeaf
        - periodicity
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        ordinal:
          type: integer
        isLeaf:
          type: boolean
        periodicity:
          description: Time dimensions only.
          oneOf:
            - $ref: '#/components/schemas/Periodicity'
            - type: 'null'
    DimensionMember:
      type: object
      required:
        - id
        - versionId
        - key
        - displayName
        - description
        - parentId
        - levelId
        - isAssignable
        - sortOrder
        - properties
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        description:
          type:
            - string
            - 'null'
        parentId:
          type:
            - string
            - 'null'
          description: Hierarchical dimensions only; a member of the same version.
        levelId:
          type:
            - string
            - 'null'
        isAssignable:
          type: boolean
        sortOrder:
          type: integer
        properties:
          type: object
          description: Free key/value for user dimensions; validated against the profile's property schema for system dimensions (OI-18).
          additionalProperties: true
    RangeBound:
      type:
        - number
        - string
        - 'null'
      description: A number for `decimal`, an ISO date for `date`, an ISO date-time for `datetime`; null is open (only the first band's lower and the last band's upper).
    RangeBand:
      type: object
      required:
        - ordinal
        - memberId
        - lower
        - upper
        - lowerInclusive
        - upperInclusive
      properties:
        ordinal:
          type: integer
        memberId:
          $ref: '#/components/schemas/Id'
        lower:
          $ref: '#/components/schemas/RangeBound'
        upper:
          $ref: '#/components/schemas/RangeBound'
        lowerInclusive:
          type: boolean
        upperInclusive:
          type: boolean
    DimensionUsageReference:
      type: object
      description: Something outside the dimension that references it, one of its roles, or some of its member keys.
      required:
        - kind
        - name
        - detail
      properties:
        kind:
          $ref: '#/components/schemas/DimensionUsageKind'
        name:
          type: string
        detail:
          type: string
        roleKey:
          type: string
        memberKeys:
          type: array
          description: Member keys this object names; deleting them is blocked and `dimension_consumers_resolve` requires them.
          items:
            type: string
        pinsVersion:
          type: integer
          description: Assumption sets only; the version number pinned.
        label:
          type: string
          description: Display label for blocker phrasing, e.g. a dataset version "'loans.details' v3".
    DimensionListItem:
      allOf:
        - $ref: '#/components/schemas/Dimension'
        - type: object
          required:
            - profile
            - roles
            - versions
            - publishedMemberCount
          properties:
            profile:
              oneOf:
                - $ref: '#/components/schemas/DimensionProfile'
                - type: 'null'
            roles:
              type: array
              items:
                $ref: '#/components/schemas/DimensionRole'
            versions:
              type: array
              items:
                $ref: '#/components/schemas/DimensionVersionSummary'
            publishedMemberCount:
              type:
                - integer
                - 'null'
              description: Members in the live version.
    DimensionDetail:
      allOf:
        - $ref: '#/components/schemas/DimensionListItem'
        - type: object
          required:
            - usage
          properties:
            usage:
              type: array
              description: Computed from bindings, mapping sets, bridges, calculation dimensions, report scenarios, report sources and assumption set pins.
              items:
                $ref: '#/components/schemas/DimensionUsageReference'
    DimensionVersionContent:
      type: object
      required:
        - version
        - levels
        - members
        - bands
      properties:
        version:
          $ref: '#/components/schemas/DimensionVersion'
        levels:
          type: array
          items:
            $ref: '#/components/schemas/DimensionLevel'
        members:
          type: array
          items:
            $ref: '#/components/schemas/DimensionMember'
        bands:
          type: array
          items:
            $ref: '#/components/schemas/RangeBand'
    DimensionEditState:
      type: object
      description: The change-set aggregate content; everything the dimension editor shows.
      required:
        - dimension
        - content
      properties:
        dimension:
          $ref: '#/components/schemas/DimensionDetail'
        content:
          $ref: '#/components/schemas/DimensionVersionContent'
    DimensionCreated:
      type: object
      required:
        - dimensionId
        - versionId
      properties:
        dimensionId:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
          description: The live version 1.
    DimensionFreezeResult:
      allOf:
        - $ref: '#/components/schemas/FreezeResult'
        - type: object
          required:
            - live
          properties:
            live:
              $ref: '#/components/schemas/DimensionVersionSummary'
    CreateDimensionInput:
      type: object
      required:
        - key
        - displayName
        - kind
        - rangeDataType
        - firstRole
        - isEnabled
        - isRemovable
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        kind:
          $ref: '#/components/schemas/DimensionKind'
        rangeDataType:
          description: Required for range dimensions; null otherwise.
          oneOf:
            - $ref: '#/components/schemas/RangeDataType'
            - type: 'null'
        firstRole:
          description: Required for non-time dimensions (M6); null for time.
          oneOf:
            - $ref: '#/components/schemas/DimensionFirstRoleInput'
            - type: 'null'
        isEnabled:
          type: boolean
        isRemovable:
          type: boolean
    DimensionFirstRoleInput:
      type: object
      required:
        - key
        - displayName
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
    DimensionPatch:
      type: object
      description: The identity fields that change after creation (M1).
      minProperties: 1
      properties:
        displayName:
          type: string
        isEnabled:
          type: boolean
        isRemovable:
          type: boolean
    DimensionVersionPatch:
      type: object
      required:
        - rangeDataType
      properties:
        rangeDataType:
          description: Changing it clears every band bound.
          oneOf:
            - $ref: '#/components/schemas/RangeDataType'
            - type: 'null'
    DimensionMemberInput:
      type: object
      required:
        - key
        - displayName
        - description
        - parentId
        - levelId
        - isAssignable
        - sortOrder
        - properties
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: A stored id updates that member (its key stays fixed). Absent or a temporary id `tmp:<uuid>` creates one; later operations reference the new member by the temporary id.
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        description:
          type:
            - string
            - 'null'
        parentId:
          type:
            - string
            - 'null'
        levelId:
          type:
            - string
            - 'null'
        isAssignable:
          type: boolean
        sortOrder:
          type:
            - integer
            - 'null'
          description: Null appends to the end of the siblings.
        properties:
          type: object
          additionalProperties: true
    DimensionLevelInput:
      type: object
      required:
        - key
        - displayName
        - isLeaf
        - periodicity
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: A stored id updates that level; absent or `tmp:<uuid>` creates one.
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        isLeaf:
          type: boolean
        periodicity:
          oneOf:
            - $ref: '#/components/schemas/Periodicity'
            - type: 'null'
    DimensionRoleInput:
      type: object
      required:
        - key
        - displayName
        - description
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: A stored id updates that role; absent or `tmp:<uuid>` creates one.
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        description:
          type:
            - string
            - 'null'
    DimensionMemberPosition:
      type: object
      required:
        - parentId
        - index
      properties:
        parentId:
          type:
            - string
            - 'null'
        index:
          type: integer
          minimum: 0
          description: Index among the new siblings after the move.
    DimensionMemberImportRow:
      type: object
      description: One parsed row; CSV/TSV parsing stays in the browser (OI-21).
      required:
        - key
        - displayName
        - parentKey
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        parentKey:
          type:
            - string
            - 'null'
    DimensionMemberImportMode:
      type: string
      enum:
        - merge
        - replace
      description: '`merge` upserts by key and keeps everything else; `replace` makes the version''s members exactly the imported rows and fails when a member it would remove is still needed.'
    DimensionOperation:
      description: One edit of the dimension change set, named after the port's edit methods (OI-01). The set covers the dimension's identity, its roles and its live version's content; edit policy (M11) is enforced per operation.
      oneOf:
        - $ref: '#/components/schemas/DimensionUpdateDimensionOperation'
        - $ref: '#/components/schemas/DimensionUpdateVersionOperation'
        - $ref: '#/components/schemas/DimensionSaveMemberOperation'
        - $ref: '#/components/schemas/DimensionDeleteMemberOperation'
        - $ref: '#/components/schemas/DimensionMoveMemberOperation'
        - $ref: '#/components/schemas/DimensionImportMembersOperation'
        - $ref: '#/components/schemas/DimensionClearMembersOperation'
        - $ref: '#/components/schemas/DimensionSaveLevelOperation'
        - $ref: '#/components/schemas/DimensionDeleteLevelOperation'
        - $ref: '#/components/schemas/DimensionReorderLevelsOperation'
        - $ref: '#/components/schemas/DimensionSaveBandsOperation'
        - $ref: '#/components/schemas/DimensionSaveRoleOperation'
        - $ref: '#/components/schemas/DimensionDeleteRoleOperation'
      discriminator:
        propertyName: op
        mapping:
          updateDimension: '#/components/schemas/DimensionUpdateDimensionOperation'
          updateVersion: '#/components/schemas/DimensionUpdateVersionOperation'
          saveMember: '#/components/schemas/DimensionSaveMemberOperation'
          deleteMember: '#/components/schemas/DimensionDeleteMemberOperation'
          moveMember: '#/components/schemas/DimensionMoveMemberOperation'
          importMembers: '#/components/schemas/DimensionImportMembersOperation'
          clearMembers: '#/components/schemas/DimensionClearMembersOperation'
          saveLevel: '#/components/schemas/DimensionSaveLevelOperation'
          deleteLevel: '#/components/schemas/DimensionDeleteLevelOperation'
          reorderLevels: '#/components/schemas/DimensionReorderLevelsOperation'
          saveBands: '#/components/schemas/DimensionSaveBandsOperation'
          saveRole: '#/components/schemas/DimensionSaveRoleOperation'
          deleteRole: '#/components/schemas/DimensionDeleteRoleOperation'
    DimensionUpdateDimensionOperation:
      type: object
      required:
        - op
        - patch
      properties:
        op:
          const: updateDimension
        patch:
          $ref: '#/components/schemas/DimensionPatch'
    DimensionUpdateVersionOperation:
      type: object
      required:
        - op
        - versionId
        - patch
      properties:
        op:
          const: updateVersion
        versionId:
          $ref: '#/components/schemas/Id'
        patch:
          $ref: '#/components/schemas/DimensionVersionPatch'
    DimensionSaveMemberOperation:
      type: object
      required:
        - op
        - versionId
        - input
      properties:
        op:
          const: saveMember
        versionId:
          $ref: '#/components/schemas/Id'
        input:
          $ref: '#/components/schemas/DimensionMemberInput'
    DimensionDeleteMemberOperation:
      type: object
      required:
        - op
        - versionId
        - memberId
      properties:
        op:
          const: deleteMember
        versionId:
          $ref: '#/components/schemas/Id'
        memberId:
          $ref: '#/components/schemas/Id'
    DimensionMoveMemberOperation:
      type: object
      required:
        - op
        - versionId
        - memberId
        - to
      properties:
        op:
          const: moveMember
        versionId:
          $ref: '#/components/schemas/Id'
        memberId:
          $ref: '#/components/schemas/Id'
        to:
          $ref: '#/components/schemas/DimensionMemberPosition'
    DimensionImportMembersOperation:
      type: object
      required:
        - op
        - versionId
        - rows
        - mode
      properties:
        op:
          const: importMembers
        versionId:
          $ref: '#/components/schemas/Id'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DimensionMemberImportRow'
        mode:
          $ref: '#/components/schemas/DimensionMemberImportMode'
    DimensionClearMembersOperation:
      type: object
      required:
        - op
        - versionId
      properties:
        op:
          const: clearMembers
        versionId:
          $ref: '#/components/schemas/Id'
    DimensionSaveLevelOperation:
      type: object
      required:
        - op
        - versionId
        - input
      properties:
        op:
          const: saveLevel
        versionId:
          $ref: '#/components/schemas/Id'
        input:
          $ref: '#/components/schemas/DimensionLevelInput'
    DimensionDeleteLevelOperation:
      type: object
      required:
        - op
        - versionId
        - levelId
      properties:
        op:
          const: deleteLevel
        versionId:
          $ref: '#/components/schemas/Id'
        levelId:
          $ref: '#/components/schemas/Id'
    DimensionReorderLevelsOperation:
      type: object
      required:
        - op
        - versionId
        - orderedIds
      properties:
        op:
          const: reorderLevels
        versionId:
          $ref: '#/components/schemas/Id'
        orderedIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
    DimensionSaveBandsOperation:
      type: object
      description: Replaces the version's bands as a whole set (M5).
      required:
        - op
        - versionId
        - bands
      properties:
        op:
          const: saveBands
        versionId:
          $ref: '#/components/schemas/Id'
        bands:
          type: array
          items:
            $ref: '#/components/schemas/RangeBand'
    DimensionSaveRoleOperation:
      type: object
      required:
        - op
        - input
      properties:
        op:
          const: saveRole
        input:
          $ref: '#/components/schemas/DimensionRoleInput'
    DimensionDeleteRoleOperation:
      type: object
      required:
        - op
        - roleId
      properties:
        op:
          const: deleteRole
        roleId:
          $ref: '#/components/schemas/Id'
    DimensionChangeSetRequest:
      allOf:
        - $ref: '#/components/schemas/ChangeSetRequest'
        - type: object
          required:
            - operations
          properties:
            operations:
              type: array
              items:
                $ref: '#/components/schemas/DimensionOperation'
    DimensionChangeSetPreview:
      allOf:
        - $ref: '#/components/schemas/ChangeSetPreview'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/DimensionEditState'
    DimensionChangeSetCommit:
      allOf:
        - $ref: '#/components/schemas/ChangeSetCommit'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/DimensionEditState'
    MappingCardinality:
      type: string
      enum:
        - many_to_one
        - many_to_many
    MappingAllocationMode:
      type: string
      enum:
        - none
        - partition
        - replicate
      description: '`many_to_one` allows `none` only; `many_to_many` allows `partition` or `replicate` (B5).'
    MappingDimensionRef:
      type: object
      description: A read-only slice of a dimension, enough to label it and to state which version keys resolve against.
      required:
        - id
        - key
        - displayName
        - kind
        - purpose
        - publishedVersionId
        - publishedVersionNumber
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        kind:
          type: string
          enum:
            - categorical
            - hierarchical
            - range
            - time
        purpose:
          type: string
          enum:
            - analytical
            - report
        publishedVersionId:
          type:
            - string
            - 'null'
          description: The live version, whose members entry and mapping keys resolve against.
        publishedVersionNumber:
          type:
            - integer
            - 'null'
    MappingBindingUsage:
      type: object
      description: A dataset binding that names a mapping set or bridge by identity (B13); drives Used by and delete blockers.
      required:
        - datasetId
        - datasetKey
        - datasetVersionId
        - datasetVersionNumber
        - status
        - fieldKey
        - roleKey
        - sourceRoleKey
      properties:
        datasetId:
          $ref: '#/components/schemas/Id'
        datasetKey:
          $ref: '#/components/schemas/DottedKey'
        datasetVersionId:
          $ref: '#/components/schemas/Id'
        datasetVersionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        fieldKey:
          $ref: '#/components/schemas/Key'
        roleKey:
          $ref: '#/components/schemas/Key'
        sourceRoleKey:
          type:
            - string
            - 'null'
          description: Bridge bindings only, the role of the binding the bridge remaps; null for mapping sets.
    MappingAssumptionPin:
      type: object
      description: An assumption set that pins one version of a mapping set or bridge.
      required:
        - assumptionSetId
        - assumptionSetKey
        - assumptionSetDisplayName
        - isActive
        - versionId
        - versionNumber
      properties:
        assumptionSetId:
          $ref: '#/components/schemas/Id'
        assumptionSetKey:
          type: string
        assumptionSetDisplayName:
          type: string
        isActive:
          type: boolean
          description: The active set always pins the live version; historical sets keep the version they captured.
        versionId:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
    MappingViolationCode:
      type: string
      description: Rule codes of mapping versions.
      enum:
        - source_key_unique
        - dimension_version_published
        - entry_member_in_version
        - entry_member_assignable
    BridgeViolationCode:
      type: string
      description: Rule codes of bridge versions.
      enum:
        - endpoint_versions_published
        - mapping_members_in_endpoint_versions
        - cardinality_many_to_one
        - allocation_none
        - allocation_partition
        - allocation_replicate
        - pair_unique
        - descendants_report_only
    MappingSet:
      type: object
      required:
        - id
        - key
        - displayName
        - sourceNamespace
        - dimensionId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        sourceNamespace:
          type: string
          description: Free text naming the source system (B14).
        dimensionId:
          $ref: '#/components/schemas/Id'
    MappingVersion:
      type: object
      description: Stored `published` is the live version and `retired` a frozen snapshot (B10).
      required:
        - id
        - mappingSetId
        - versionNumber
        - status
        - createdAt
        - publishedAt
        - retiredAt
        - freezeNote
      properties:
        id:
          $ref: '#/components/schemas/Id'
        mappingSetId:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        retiredAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was frozen.
        freezeNote:
          type:
            - string
            - 'null'
    MappingEntry:
      type: object
      required:
        - id
        - versionId
        - sourceKeyValue
        - memberKey
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
        sourceKeyValue:
          type: string
          description: Compared exactly as text, never trimmed or coerced (B2).
        memberKey:
          type: string
    MappingVersionSummary:
      type: object
      required:
        - id
        - versionNumber
        - status
        - createdAt
        - publishedAt
        - retiredAt
        - freezeNote
        - entryCount
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        retiredAt:
          type:
            - string
            - 'null'
          format: date-time
        freezeNote:
          type:
            - string
            - 'null'
        entryCount:
          type: integer
    MappingSetListItem:
      allOf:
        - $ref: '#/components/schemas/MappingSet'
        - type: object
          required:
            - dimension
            - versions
            - publishedEntryCount
            - bindings
          properties:
            dimension:
              $ref: '#/components/schemas/MappingDimensionRef'
            versions:
              type: array
              items:
                $ref: '#/components/schemas/MappingVersionSummary'
            publishedEntryCount:
              type: integer
              description: Entries of the live version.
            bindings:
              type: array
              items:
                $ref: '#/components/schemas/MappingBindingUsage'
    MappingSetDetail:
      allOf:
        - $ref: '#/components/schemas/MappingSetListItem'
        - type: object
          required:
            - pins
          properties:
            pins:
              type: array
              items:
                $ref: '#/components/schemas/MappingAssumptionPin'
    MappingCoverage:
      type: object
      description: Assignable members of the dimension's live version and those no entry maps to.
      required:
        - assignableMemberCount
        - uncoveredMemberKeys
      properties:
        assignableMemberCount:
          type: integer
        uncoveredMemberKeys:
          type: array
          items:
            type: string
    MappingVersionContent:
      type: object
      required:
        - version
        - entries
        - coverage
        - violations
      properties:
        version:
          $ref: '#/components/schemas/MappingVersion'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MappingEntry'
        coverage:
          $ref: '#/components/schemas/MappingCoverage'
        violations:
          type: array
          description: Rule findings on this content, with `target.itemId` naming the entry at fault. Empty on a saved live version, because commits refuse violations (B11); a preview's state carries the findings of the pending edits.
          items:
            $ref: '#/components/schemas/Violation'
    MappingSetEditState:
      type: object
      description: What the mapping set editor renders; the state of a mapping set change set.
      required:
        - set
        - content
      properties:
        set:
          $ref: '#/components/schemas/MappingSetDetail'
        content:
          $ref: '#/components/schemas/MappingVersionContent'
    CreateMappingSetInput:
      type: object
      required:
        - key
        - displayName
        - sourceNamespace
        - dimensionId
      properties:
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
          minLength: 1
        sourceNamespace:
          type: string
          minLength: 1
        dimensionId:
          $ref: '#/components/schemas/Id'
    MappingSetCreated:
      type: object
      required:
        - mappingSetId
        - versionId
      properties:
        mappingSetId:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
          description: The empty live v1.
    MappingSetPatch:
      type: object
      description: Key and dimension are fixed after creation.
      properties:
        displayName:
          type: string
          minLength: 1
        sourceNamespace:
          type: string
          minLength: 1
    MappingEntryInput:
      type: object
      required:
        - id
        - sourceKeyValue
        - memberKey
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: The entry's id, or a client-generated `tmp:<uuid>` for a new entry.
        sourceKeyValue:
          type: string
          minLength: 1
        memberKey:
          type: string
          minLength: 1
    MappingFreezeResult:
      allOf:
        - $ref: '#/components/schemas/FreezeResult'
        - type: object
          required:
            - live
          properties:
            live:
              $ref: '#/components/schemas/MappingVersionSummary'
    MappingSetUpdateOperation:
      type: object
      required:
        - op
        - patch
      properties:
        op:
          const: updateMappingSet
        patch:
          $ref: '#/components/schemas/MappingSetPatch'
    MappingEntrySaveOperation:
      type: object
      description: Adds the entry, or replaces the entry with the same id.
      required:
        - op
        - versionId
        - input
      properties:
        op:
          const: saveEntry
        versionId:
          $ref: '#/components/schemas/Id'
        input:
          $ref: '#/components/schemas/MappingEntryInput'
    MappingEntryDeleteOperation:
      type: object
      required:
        - op
        - versionId
        - entryId
      properties:
        op:
          const: deleteEntry
        versionId:
          $ref: '#/components/schemas/Id'
        entryId:
          $ref: '#/components/schemas/Id'
    MappingEntriesReplaceOperation:
      type: object
      description: Replaces every entry of the version (bulk paste).
      required:
        - op
        - versionId
        - entries
      properties:
        op:
          const: replaceEntries
        versionId:
          $ref: '#/components/schemas/Id'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MappingEntryInput'
    MappingOperation:
      description: One edit of a mapping set change set; `versionId` names the live version.
      oneOf:
        - $ref: '#/components/schemas/MappingSetUpdateOperation'
        - $ref: '#/components/schemas/MappingEntrySaveOperation'
        - $ref: '#/components/schemas/MappingEntryDeleteOperation'
        - $ref: '#/components/schemas/MappingEntriesReplaceOperation'
      discriminator:
        propertyName: op
        mapping:
          updateMappingSet: '#/components/schemas/MappingSetUpdateOperation'
          saveEntry: '#/components/schemas/MappingEntrySaveOperation'
          deleteEntry: '#/components/schemas/MappingEntryDeleteOperation'
          replaceEntries: '#/components/schemas/MappingEntriesReplaceOperation'
    MappingSetChangeSetRequest:
      allOf:
        - $ref: '#/components/schemas/ChangeSetRequest'
        - type: object
          required:
            - operations
          properties:
            operations:
              type: array
              items:
                $ref: '#/components/schemas/MappingOperation'
    MappingSetChangeSetPreview:
      allOf:
        - $ref: '#/components/schemas/ChangeSetPreview'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/MappingSetEditState'
    MappingSetChangeSetCommit:
      allOf:
        - $ref: '#/components/schemas/ChangeSetCommit'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/MappingSetEditState'
    BridgeOwner:
      type: object
      description: The report source a report bridge belongs to (B9, OI-31).
      required:
        - reportId
        - reportKey
        - sourceKey
      properties:
        reportId:
          $ref: '#/components/schemas/Id'
        reportKey:
          $ref: '#/components/schemas/DottedKey'
        sourceKey:
          type: string
    Bridge:
      type: object
      required:
        - id
        - key
        - displayName
        - sourceDimensionId
        - targetDimensionId
        - isEnabled
        - owner
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        sourceDimensionId:
          $ref: '#/components/schemas/Id'
        targetDimensionId:
          $ref: '#/components/schemas/Id'
        isEnabled:
          type: boolean
        owner:
          description: Set for report bridges, which are written only through their report's change set.
          oneOf:
            - $ref: '#/components/schemas/BridgeOwner'
            - type: 'null'
    BridgeVersion:
      type: object
      description: Stored `published` is the live version and `retired` a frozen snapshot (B10).
      required:
        - id
        - bridgeId
        - versionNumber
        - status
        - cardinality
        - allocationMode
        - createdAt
        - publishedAt
        - retiredAt
        - freezeNote
      properties:
        id:
          $ref: '#/components/schemas/Id'
        bridgeId:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        cardinality:
          $ref: '#/components/schemas/MappingCardinality'
        allocationMode:
          $ref: '#/components/schemas/MappingAllocationMode'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        retiredAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was frozen.
        freezeNote:
          type:
            - string
            - 'null'
    BridgeMapping:
      type: object
      required:
        - id
        - versionId
        - sourceMemberKey
        - targetMemberKey
        - factor
        - allocationWeight
        - sourceSelection
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
        sourceMemberKey:
          type: string
        targetMemberKey:
          type: string
        factor:
          type: number
          description: Affects only measures with `bridge_factor_behavior = value` (B7).
        allocationWeight:
          type: number
        sourceSelection:
          $ref: '#/components/schemas/SourceSelection'
    BridgeVersionSummary:
      type: object
      required:
        - id
        - versionNumber
        - status
        - cardinality
        - allocationMode
        - createdAt
        - publishedAt
        - retiredAt
        - freezeNote
        - mappingCount
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        cardinality:
          $ref: '#/components/schemas/MappingCardinality'
        allocationMode:
          $ref: '#/components/schemas/MappingAllocationMode'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        retiredAt:
          type:
            - string
            - 'null'
          format: date-time
        freezeNote:
          type:
            - string
            - 'null'
        mappingCount:
          type: integer
    BridgeListItem:
      allOf:
        - $ref: '#/components/schemas/Bridge'
        - type: object
          required:
            - source
            - target
            - versions
            - publishedMappingCount
            - bindings
          properties:
            source:
              $ref: '#/components/schemas/MappingDimensionRef'
            target:
              $ref: '#/components/schemas/MappingDimensionRef'
            versions:
              type: array
              items:
                $ref: '#/components/schemas/BridgeVersionSummary'
            publishedMappingCount:
              type: integer
              description: Mappings of the live version.
            bindings:
              type: array
              items:
                $ref: '#/components/schemas/MappingBindingUsage'
    BridgeDetail:
      allOf:
        - $ref: '#/components/schemas/BridgeListItem'
        - type: object
          required:
            - pins
          properties:
            pins:
              type: array
              items:
                $ref: '#/components/schemas/MappingAssumptionPin'
    BridgeSourceAllocation:
      type: object
      description: One source member's targets and the sum of its allocation weights.
      required:
        - sourceMemberKey
        - targetCount
        - weightSum
      properties:
        sourceMemberKey:
          type: string
        targetCount:
          type: integer
        weightSum:
          type: number
    BridgeAllocationSummary:
      type: object
      required:
        - sources
      properties:
        sources:
          type: array
          description: Every source member the version maps, ordered by key.
          items:
            $ref: '#/components/schemas/BridgeSourceAllocation'
    BridgeVersionContent:
      type: object
      required:
        - version
        - mappings
        - allocation
        - violations
      properties:
        version:
          $ref: '#/components/schemas/BridgeVersion'
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/BridgeMapping'
        allocation:
          $ref: '#/components/schemas/BridgeAllocationSummary'
        violations:
          type: array
          description: Rule findings on this content; `target.itemId` names the mapping at fault, or `target.itemKey` the source member for per-source rules. Empty on a saved live version, because commits refuse violations (B11); a preview's state carries the findings of the pending edits.
          items:
            $ref: '#/components/schemas/Violation'
    BridgeEditState:
      type: object
      description: What the bridge editor renders; the state of a bridge change set.
      required:
        - bridge
        - content
      properties:
        bridge:
          $ref: '#/components/schemas/BridgeDetail'
        content:
          $ref: '#/components/schemas/BridgeVersionContent'
    CreateBridgeInput:
      type: object
      description: Endpoints are fixed at creation, differ, and are never `time` dimensions, source or target (B4); neither is a report dimension, whose bridges its report's sources create.
      required:
        - key
        - displayName
        - sourceDimensionId
        - targetDimensionId
        - isEnabled
      properties:
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
          minLength: 1
        sourceDimensionId:
          $ref: '#/components/schemas/Id'
        targetDimensionId:
          $ref: '#/components/schemas/Id'
        isEnabled:
          type: boolean
    BridgeCreated:
      type: object
      required:
        - bridgeId
        - versionId
      properties:
        bridgeId:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
          description: The empty live v1, `many_to_one` / `none`.
    BridgePatch:
      type: object
      description: Key and endpoints are fixed after creation.
      properties:
        displayName:
          type: string
          minLength: 1
        isEnabled:
          type: boolean
    BridgeVersionPatch:
      type: object
      description: Edited in place on the live version (OI-26); mappings that no longer comply become violations.
      required:
        - cardinality
        - allocationMode
      properties:
        cardinality:
          $ref: '#/components/schemas/MappingCardinality'
        allocationMode:
          $ref: '#/components/schemas/MappingAllocationMode'
    BridgeMappingInput:
      type: object
      required:
        - id
        - sourceMemberKey
        - targetMemberKey
        - factor
        - allocationWeight
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: The mapping's id, or a client-generated `tmp:<uuid>` for a new mapping.
        sourceMemberKey:
          type: string
          minLength: 1
        targetMemberKey:
          type: string
          minLength: 1
        factor:
          type: number
        allocationWeight:
          type: number
        sourceSelection:
          $ref: '#/components/schemas/SourceSelection'
          description: Accepted only on report bridges, written by the report editor; absent means `member` (OI-28).
    BridgeFreezeResult:
      allOf:
        - $ref: '#/components/schemas/FreezeResult'
        - type: object
          required:
            - live
          properties:
            live:
              $ref: '#/components/schemas/BridgeVersionSummary'
    BridgeUpdateOperation:
      type: object
      required:
        - op
        - patch
      properties:
        op:
          const: updateBridge
        patch:
          $ref: '#/components/schemas/BridgePatch'
    BridgeVersionUpdateOperation:
      type: object
      required:
        - op
        - versionId
        - patch
      properties:
        op:
          const: updateBridgeVersion
        versionId:
          $ref: '#/components/schemas/Id'
        patch:
          $ref: '#/components/schemas/BridgeVersionPatch'
    BridgeMappingSaveOperation:
      type: object
      description: Adds the mapping, or replaces the mapping with the same id.
      required:
        - op
        - versionId
        - input
      properties:
        op:
          const: saveBridgeMapping
        versionId:
          $ref: '#/components/schemas/Id'
        input:
          $ref: '#/components/schemas/BridgeMappingInput'
    BridgeMappingDeleteOperation:
      type: object
      required:
        - op
        - versionId
        - mappingId
      properties:
        op:
          const: deleteBridgeMapping
        versionId:
          $ref: '#/components/schemas/Id'
        mappingId:
          $ref: '#/components/schemas/Id'
    BridgeMappingsReplaceOperation:
      type: object
      description: Replaces every mapping of the version (bulk paste).
      required:
        - op
        - versionId
        - rows
      properties:
        op:
          const: replaceBridgeMappings
        versionId:
          $ref: '#/components/schemas/Id'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/BridgeMappingInput'
    BridgeOperation:
      description: One edit of an analytical bridge change set; `versionId` names the live version.
      oneOf:
        - $ref: '#/components/schemas/BridgeUpdateOperation'
        - $ref: '#/components/schemas/BridgeVersionUpdateOperation'
        - $ref: '#/components/schemas/BridgeMappingSaveOperation'
        - $ref: '#/components/schemas/BridgeMappingDeleteOperation'
        - $ref: '#/components/schemas/BridgeMappingsReplaceOperation'
      discriminator:
        propertyName: op
        mapping:
          updateBridge: '#/components/schemas/BridgeUpdateOperation'
          updateBridgeVersion: '#/components/schemas/BridgeVersionUpdateOperation'
          saveBridgeMapping: '#/components/schemas/BridgeMappingSaveOperation'
          deleteBridgeMapping: '#/components/schemas/BridgeMappingDeleteOperation'
          replaceBridgeMappings: '#/components/schemas/BridgeMappingsReplaceOperation'
    BridgeChangeSetRequest:
      allOf:
        - $ref: '#/components/schemas/ChangeSetRequest'
        - type: object
          required:
            - operations
          properties:
            operations:
              type: array
              items:
                $ref: '#/components/schemas/BridgeOperation'
    BridgeChangeSetPreview:
      allOf:
        - $ref: '#/components/schemas/ChangeSetPreview'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/BridgeEditState'
    BridgeChangeSetCommit:
      allOf:
        - $ref: '#/components/schemas/ChangeSetCommit'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/BridgeEditState'
    ReleaseKey:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.\-/]{0,127}$
      description: Natural key of a release, fixed after creation; screens show it as the release's name (R7, OI-39).
      examples:
        - prod/2026-q4
    Release:
      type: object
      description: One row of `qe_semantic_release`.
      required:
        - id
        - key
        - status
        - createdAt
        - publishedAt
        - contentHash
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/ReleaseKey'
        status:
          $ref: '#/components/schemas/VersionStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        contentHash:
          type:
            - string
            - 'null'
          description: Hash of the sorted manifest (`datasetId`, `datasetVersionId` pairs), computed on publish (OI-41).
    ReleaseActivation:
      type: object
      description: One row of the activation log, `qe_release_activation` (OI-40).
      required:
        - releaseId
        - previousReleaseId
        - activatedAt
        - activatedBy
      properties:
        releaseId:
          $ref: '#/components/schemas/Id'
        previousReleaseId:
          type:
            - string
            - 'null'
          description: The release that was active before; null for the tenant's first activation.
        activatedAt:
          $ref: '#/components/schemas/Timestamp'
        activatedBy:
          type: string
          description: The token subject of the caller.
    ReleaseListItem:
      allOf:
        - $ref: '#/components/schemas/Release'
        - type: object
          required:
            - isActive
            - datasetCount
            - diffVsActive
            - activatedAt
            - activatedBy
          properties:
            isActive:
              type: boolean
            datasetCount:
              type: integer
              minimum: 0
            diffVsActive:
              description: What activating this release would change; null for the active release itself.
              oneOf:
                - $ref: '#/components/schemas/ReleaseDiff'
                - type: 'null'
            activatedAt:
              type:
                - string
                - 'null'
              format: date-time
              description: When the active release was last activated; null for every other release.
            activatedBy:
              type:
                - string
                - 'null'
              description: Who last activated the active release; null for every other release.
    ManifestEntry:
      type: object
      description: One pinned dataset version, a row of `qe_release_dataset`.
      required:
        - datasetId
        - datasetVersionId
      properties:
        datasetId:
          $ref: '#/components/schemas/Id'
        datasetVersionId:
          $ref: '#/components/schemas/Id'
    ReleaseDetail:
      type: object
      description: A release page's read model; also the state of a manifest change set.
      required:
        - release
        - isActive
        - manifest
        - activations
      properties:
        release:
          $ref: '#/components/schemas/Release'
        isActive:
          type: boolean
        manifest:
          type: array
          items:
            $ref: '#/components/schemas/ManifestEntry'
        activations:
          type: array
          description: Every activation of this release, newest first.
          items:
            $ref: '#/components/schemas/ReleaseActivation'
    ReleaseDiffEntry:
      type: object
      required:
        - datasetId
        - versionId
      properties:
        datasetId:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
          description: The pinned dataset version.
    ReleaseDiffRemoval:
      allOf:
        - $ref: '#/components/schemas/ReleaseDiffEntry'
        - type: object
          required:
            - readBy
          properties:
            readBy:
              type: array
              description: Keys of the enabled reports with a source on the dataset.
              items:
                type: string
    ReleaseDiffChange:
      type: object
      required:
        - datasetId
        - fromVersionId
        - toVersionId
      properties:
        datasetId:
          $ref: '#/components/schemas/Id'
        fromVersionId:
          $ref: '#/components/schemas/Id'
        toVersionId:
          $ref: '#/components/schemas/Id'
    ReleaseDiff:
      type: object
      description: The manifest set difference going from one release to another (OI-38).
      required:
        - fromReleaseId
        - toReleaseId
        - added
        - removed
        - changed
        - unchanged
      properties:
        fromReleaseId:
          $ref: '#/components/schemas/Id'
        toReleaseId:
          $ref: '#/components/schemas/Id'
        added:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseDiffEntry'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseDiffRemoval'
        changed:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseDiffChange'
        unchanged:
          type: integer
          minimum: 0
          description: Datasets pinned at the same version in both.
    ReleaseRuleCode:
      type: string
      description: The release rules, in the order the API runs them.
      enum:
        - manifest_not_empty
        - pinned_version_belongs_to_dataset
        - pinned_version_published
        - bound_dimensions_resolvable
        - mapped_bindings_resolvable
        - bridge_bindings_resolvable
        - report_sources_resolve
        - report_factors_apply
    ReleaseTargetArea:
      type: string
      description: What a release finding points at; the identity kinds name a dimension, mapping set or bridge.
      enum:
        - dataset
        - dimension
        - mapping_set
        - bridge
        - report
    ReleaseViolationTarget:
      description: A dataset (`itemId` = dataset id), an identity (`area` = its kind, `itemId` = identity id) or a report source (`itemId` = report id, `itemKey` = source key).
      allOf:
        - $ref: '#/components/schemas/ViolationTarget'
        - type: object
          required:
            - area
            - itemId
          properties:
            area:
              $ref: '#/components/schemas/ReleaseTargetArea'
    ReleaseViolation:
      allOf:
        - $ref: '#/components/schemas/Violation'
        - type: object
          required:
            - code
            - datasetId
          properties:
            code:
              $ref: '#/components/schemas/ReleaseRuleCode'
            datasetId:
              type:
                - string
                - 'null'
              description: The manifest row the finding belongs to, for inline issue icons.
            target:
              $ref: '#/components/schemas/ReleaseViolationTarget'
    ReleaseCheckReport:
      type: object
      required:
        - releaseId
        - unsaved
        - checkedAt
        - violations
      properties:
        releaseId:
          $ref: '#/components/schemas/Id'
        unsaved:
          type: boolean
          description: True when the rules ran over staged, unsaved manifest operations (a change-set preview).
        checkedAt:
          $ref: '#/components/schemas/Timestamp'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseViolation'
    ReleaseTransitionResult:
      type: object
      description: Answer of `validate` and `publish`.
      required:
        - release
        - report
      properties:
        release:
          $ref: '#/components/schemas/Release'
        report:
          $ref: '#/components/schemas/ReleaseCheckReport'
    CreateReleaseInput:
      type: object
      required:
        - key
        - copyFromReleaseId
      properties:
        key:
          $ref: '#/components/schemas/ReleaseKey'
        copyFromReleaseId:
          type:
            - string
            - 'null'
          description: The release whose manifest the draft starts from; null starts empty.
    ReleaseSaveManifestOperation:
      type: object
      description: Replaces the whole manifest; the release editor keeps the manifest as its pending state.
      required:
        - op
        - manifest
      properties:
        op:
          const: saveManifest
        manifest:
          type: array
          items:
            $ref: '#/components/schemas/ManifestEntry'
    ReleaseOperation:
      oneOf:
        - $ref: '#/components/schemas/ReleaseSaveManifestOperation'
      discriminator:
        propertyName: op
        mapping:
          saveManifest: '#/components/schemas/ReleaseSaveManifestOperation'
    ReleaseChangeSetRequest:
      allOf:
        - $ref: '#/components/schemas/ChangeSetRequest'
        - type: object
          required:
            - operations
          properties:
            operations:
              type: array
              items:
                $ref: '#/components/schemas/ReleaseOperation'
    ReleaseChangeSetPreview:
      allOf:
        - $ref: '#/components/schemas/ChangeSetPreview'
        - type: object
          required:
            - state
            - violations
            - report
            - diffVsActive
          properties:
            state:
              $ref: '#/components/schemas/ReleaseDetail'
            violations:
              type: array
              description: The same findings as `report.violations`.
              items:
                $ref: '#/components/schemas/ReleaseViolation'
            report:
              $ref: '#/components/schemas/ReleaseCheckReport'
              description: The release rules over the pending manifest; `unsaved` is true (OI-37).
            diffVsActive:
              description: The pending manifest compared with the active release; null when no release is active.
              oneOf:
                - $ref: '#/components/schemas/ReleaseDiff'
                - type: 'null'
    ReleaseChangeSetCommit:
      allOf:
        - $ref: '#/components/schemas/ChangeSetCommit'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/ReleaseDetail'
    ManifestBinding:
      type: object
      description: A binding of a dataset version, with the identities it resolves through.
      required:
        - displayName
        - kind
        - dimensionId
        - mappingSetId
        - bridgeId
      properties:
        displayName:
          type: string
        kind:
          $ref: '#/components/schemas/BindingKind'
        dimensionId:
          $ref: '#/components/schemas/Id'
        mappingSetId:
          type:
            - string
            - 'null'
        bridgeId:
          type:
            - string
            - 'null'
    ManifestMeasure:
      type: object
      required:
        - key
        - appliesBridgeFactors
      properties:
        key:
          type: string
        appliesBridgeFactors:
          type: boolean
    ManifestDatasetVersion:
      type: object
      required:
        - id
        - versionNumber
        - status
        - publishedAt
        - bindings
        - measures
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/VersionStatus'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/ManifestBinding'
        measures:
          type: array
          items:
            $ref: '#/components/schemas/ManifestMeasure'
    ManifestDataset:
      type: object
      description: A dataset as the manifest editor shows it, with every version.
      required:
        - id
        - key
        - displayName
        - isEnabled
        - versions
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        isEnabled:
          type: boolean
        versions:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/ManifestDatasetVersion'
    PinKind:
      type: string
      enum:
        - dimension
        - mapping_set
        - bridge
    PinIdentityVersion:
      type: object
      description: A version of a living kind; it is live (published) or frozen (retired) (OI-14).
      required:
        - id
        - versionNumber
        - status
        - publishedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - published
            - retired
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
    PinIdentity:
      type: object
      description: A dimension, mapping set or bridge that an assumption set pins a version of.
      required:
        - kind
        - id
        - key
        - displayName
        - dimensionId
        - reportId
        - createdAt
        - versions
      properties:
        kind:
          $ref: '#/components/schemas/PinKind'
        id:
          $ref: '#/components/schemas/Id'
        key:
          type: string
          description: A dimension key, or a mapping set or bridge dotted key.
        displayName:
          type: string
        dimensionId:
          $ref: '#/components/schemas/Id'
          description: The dimension itself, a mapping set's dimension, or a bridge's target dimension.
        reportId:
          type:
            - string
            - 'null'
          description: The owning report of a report dimension or of a bridge into one.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/PinIdentityVersion'
    ReleaseReportSource:
      type: object
      required:
        - key
        - datasetId
        - usesFactors
        - measureKeys
      properties:
        key:
          type: string
        datasetId:
          $ref: '#/components/schemas/Id'
        usesFactors:
          type: boolean
          description: The source adds items into rows with factors other than 1, computed from the report's bridges.
        measureKeys:
          type: array
          items:
            type: string
    ReleaseReportRead:
      type: object
      required:
        - kind
        - identityId
      properties:
        kind:
          $ref: '#/components/schemas/PinKind'
        identityId:
          $ref: '#/components/schemas/Id'
    ReleaseReportRef:
      type: object
      description: What a report reads from a release (its sources) and from an assumption set (its identities).
      required:
        - id
        - key
        - displayName
        - isEnabled
        - sources
        - reads
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          type: string
        displayName:
          type: string
        isEnabled:
          type: boolean
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseReportSource'
        reads:
          type: array
          description: The analytical identities the report reads, computed by the server.
          items:
            $ref: '#/components/schemas/ReleaseReportRead'
    AssumptionSetKey:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_]{0,127}$
      description: Natural key of an assumption set, fixed after creation (R11); requests name the set by it.
      examples:
        - fy2026_q3_close
    AssumptionSet:
      type: object
      description: One row of `qe_assumption_set`.
      required:
        - id
        - key
        - displayName
        - description
        - status
        - releaseId
        - capturedAt
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/AssumptionSetKey'
        displayName:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/AssumptionSetStatus'
        releaseId:
          type:
            - string
            - 'null'
          description: The captured release; null for the active set, which reads the active release.
        capturedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    SetListItem:
      allOf:
        - $ref: '#/components/schemas/AssumptionSet'
        - type: object
          required:
            - pinCount
            - livePins
            - changedSinceCapture
          properties:
            pinCount:
              type: integer
              minimum: 0
            livePins:
              type: integer
              minimum: 0
              description: Pins whose version is still published.
            changedSinceCapture:
              type: integer
              minimum: 0
              description: Pins whose identity now publishes another version; 0 for the active set.
    AssumptionSetList:
      type: object
      required:
        - active
        - historical
      properties:
        active:
          $ref: '#/components/schemas/SetListItem'
        historical:
          type: array
          description: Newest capture first.
          items:
            $ref: '#/components/schemas/SetListItem'
    PinState:
      type: string
      description: '`live`: the pinned version is published; `frozen`: it is retired; `report_owned`: the identity belongs to a report (active set only, captures leave these out).'
      enum:
        - live
        - frozen
        - report_owned
    PinRow:
      type: object
      required:
        - kind
        - identityId
        - versionId
        - publishedVersionId
        - state
      properties:
        kind:
          $ref: '#/components/schemas/PinKind'
        identityId:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
        publishedVersionId:
          type:
            - string
            - 'null'
          description: The identity's published version now.
        state:
          $ref: '#/components/schemas/PinState'
    SetReadinessReason:
      type: object
      required:
        - message
        - target
      properties:
        message:
          type: string
        target:
          $ref: '#/components/schemas/ReleaseViolationTarget'
    SetReadiness:
      type: object
      description: 'Whether a report comparison can name the set: every analytical identity the report reads is pinned and every source dataset is in the set''s release.'
      required:
        - reportId
        - ready
        - reasons
      properties:
        reportId:
          $ref: '#/components/schemas/Id'
        ready:
          type: boolean
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/SetReadinessReason'
    SetDetail:
      type: object
      required:
        - set
        - readsReleaseId
        - pins
        - readiness
      properties:
        set:
          $ref: '#/components/schemas/AssumptionSet'
        readsReleaseId:
          $ref: '#/components/schemas/Id'
          description: The release the set reads; the active release for the active set.
        pins:
          type: array
          items:
            $ref: '#/components/schemas/PinRow'
        readiness:
          description: One entry per enabled report for a historical set; null for the active set.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/SetReadiness'
            - type: 'null'
    SetPinEntry:
      type: object
      required:
        - kind
        - identityId
        - versionId
      properties:
        kind:
          $ref: '#/components/schemas/PinKind'
        identityId:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
    SetPinChange:
      type: object
      required:
        - kind
        - identityId
        - fromVersionId
        - toVersionId
      properties:
        kind:
          $ref: '#/components/schemas/PinKind'
        identityId:
          $ref: '#/components/schemas/Id'
        fromVersionId:
          $ref: '#/components/schemas/Id'
        toVersionId:
          $ref: '#/components/schemas/Id'
    SetComparison:
      type: object
      description: What `toSetId` pins differently from `fromSetId`; report-owned identities are left out.
      required:
        - fromSetId
        - toSetId
        - added
        - removed
        - changed
        - unchanged
        - release
      properties:
        fromSetId:
          $ref: '#/components/schemas/Id'
        toSetId:
          $ref: '#/components/schemas/Id'
        added:
          type: array
          items:
            $ref: '#/components/schemas/SetPinEntry'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/SetPinEntry'
        changed:
          type: array
          items:
            $ref: '#/components/schemas/SetPinChange'
        unchanged:
          type: integer
          minimum: 0
        release:
          description: The difference of the two sets' releases; null when both read the same release.
          oneOf:
            - $ref: '#/components/schemas/ReleaseDiff'
            - type: 'null'
    SetCapturePreview:
      type: object
      required:
        - dimensions
        - mappingSets
        - bridges
        - leftOutDimensions
        - leftOutBridges
        - releaseId
      properties:
        dimensions:
          type: integer
          minimum: 0
        mappingSets:
          type: integer
          minimum: 0
        bridges:
          type: integer
          minimum: 0
        leftOutDimensions:
          type: integer
          minimum: 0
          description: Report dimensions a capture leaves out.
        leftOutBridges:
          type: integer
          minimum: 0
          description: Bridges into report dimensions a capture leaves out.
        releaseId:
          $ref: '#/components/schemas/Id'
          description: The active release, which the capture records.
    CaptureSetInput:
      type: object
      required:
        - key
        - displayName
        - description
      properties:
        key:
          $ref: '#/components/schemas/AssumptionSetKey'
        displayName:
          type: string
          minLength: 1
        description:
          type:
            - string
            - 'null'
          maxLength: 1024
    RelabelSetInput:
      type: object
      required:
        - displayName
        - description
      properties:
        displayName:
          type: string
          minLength: 1
        description:
          type:
            - string
            - 'null'
          maxLength: 1024
    ModelFormulaLanguage:
      type: string
      enum:
        - '1.0'
        - '1.1'
        - '1.2'
      description: 1.1 adds `POWER`; 1.2 adds `@param`, text comparisons and `YEARFRAC(convention)` (C3).
    AttributionMethod:
      type: string
      enum:
        - shapley
        - sequential
    ModelParameterValueType:
      type: string
      enum:
        - number
        - text
    ModelOutputDataType:
      type: string
      enum:
        - decimal
        - int64
        - int32
    CalcModel:
      type: object
      description: The model's own settings (`qe_calculation_model`).
      required:
        - id
        - key
        - displayName
        - currencyCode
        - calendarKey
        - formulaLanguage
        - attributionMethod
        - isEnabled
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
          description: Fixed after creation (C9).
        displayName:
          type: string
        currencyCode:
          type: string
          examples:
            - USD
        calendarKey:
          type: string
          examples:
            - gregorian
        formulaLanguage:
          $ref: '#/components/schemas/ModelFormulaLanguage'
        attributionMethod:
          $ref: '#/components/schemas/AttributionMethod'
        isEnabled:
          type: boolean
    ModelVariable:
      type: object
      description: An input metric read from the report's sources (`qe_variable`). Its key shares the model's metric namespace (C1).
      required:
        - key
        - displayName
        - displayFormat
        - unitKey
        - missingBehavior
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        displayFormat:
          type: string
          examples:
            - currency
        unitKey:
          type:
            - string
            - 'null'
        missingBehavior:
          $ref: '#/components/schemas/VariableMissingBehavior'
    ModelMeasure:
      type: object
      description: A calculated measure (`qe_calculated_measure`); `formula` is `expression_text`.
      required:
        - key
        - displayName
        - formula
        - outputDataType
        - outputPrecision
        - outputScale
        - roundingMode
        - unitKey
        - displayFormat
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        formula:
          type: string
          examples:
            - '[m.INTEREST_INCOME] - [m.INTEREST_EXPENSE]'
        outputDataType:
          $ref: '#/components/schemas/ModelOutputDataType'
        outputPrecision:
          type:
            - integer
            - 'null'
        outputScale:
          type:
            - integer
            - 'null'
        roundingMode:
          oneOf:
            - $ref: '#/components/schemas/RoundingMode'
            - type: 'null'
        unitKey:
          type:
            - string
            - 'null'
        displayFormat:
          type: string
          examples:
            - percent
    ModelParameter:
      type: object
      description: A model parameter (`qe_model_parameter`, language 1.2). It sets exactly the default its type names; only text parameters have allowed values, and they include the default (C5).
      required:
        - key
        - displayName
        - valueType
        - allowedValues
        - defaultNumber
        - defaultText
        - description
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        valueType:
          $ref: '#/components/schemas/ModelParameterValueType'
        allowedValues:
          type:
            - array
            - 'null'
          description: Null means any value.
          items:
            type: string
        defaultNumber:
          type:
            - number
            - 'null'
        defaultText:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
    AttributionDriver:
      type: object
      description: One driver of an attribution; its position in the list is `sort_order`.
      required:
        - key
        - displayName
        - inputs
      properties:
        key:
          $ref: '#/components/schemas/Key'
          description: Never `residual`.
        displayName:
          type: string
        inputs:
          type: array
          description: Metric keys and day parameters (`@periodDays`, `@yearDays`) the driver owns (`input_keys_json`).
          items:
            type: string
    Attribution:
      type: object
      description: An explicit attribution row (`qe_metric_attribution` and its drivers). A metric without one uses default drivers, listed in `ModelDocument.effectiveDrivers` (C6).
      required:
        - metricKey
        - expression
        - weightVariableKey
        - drivers
      properties:
        metricKey:
          $ref: '#/components/schemas/Key'
        expression:
          type:
            - string
            - 'null'
          description: Required for a variable; null on a calculated measure splits its own formula.
        weightVariableKey:
          type:
            - string
            - 'null'
        drivers:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/AttributionDriver'
    ModelReportUse:
      type: object
      description: A report that reads the model (`qe_report.calculation_model_id`, OI-44).
      required:
        - reportId
        - reportKey
        - displayName
        - isEnabled
      properties:
        reportId:
          $ref: '#/components/schemas/Id'
        reportKey:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        isEnabled:
          type: boolean
    ModelListItem:
      allOf:
        - $ref: '#/components/schemas/CalcModel'
        - type: object
          required:
            - variableCount
            - measureCount
            - usedBy
          properties:
            variableCount:
              type: integer
            measureCount:
              type: integer
            usedBy:
              type: array
              items:
                $ref: '#/components/schemas/ModelReportUse'
    ModelDocument:
      allOf:
        - $ref: '#/components/schemas/CalcModel'
        - type: object
          description: The whole model; the change-set state of a model.
          required:
            - variables
            - measures
            - parameters
            - attributions
            - effectiveDrivers
            - usedBy
          properties:
            variables:
              type: array
              items:
                $ref: '#/components/schemas/ModelVariable'
            measures:
              type: array
              items:
                $ref: '#/components/schemas/ModelMeasure'
            parameters:
              type: array
              items:
                $ref: '#/components/schemas/ModelParameter'
            attributions:
              type: array
              description: Explicit attribution rows only.
              items:
                $ref: '#/components/schemas/Attribution'
            effectiveDrivers:
              type: object
              description: Server-computed drivers in effect per metric key, explicit or default. A metric that cannot be attributed (a variable without an attribution) has no entry.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/AttributionDriver'
            usedBy:
              type: array
              items:
                $ref: '#/components/schemas/ModelReportUse'
    CalcModelCreateInput:
      type: object
      required:
        - key
        - displayName
        - currencyCode
        - formulaLanguage
        - attributionMethod
      properties:
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
          minLength: 1
        currencyCode:
          type: string
          minLength: 1
        formulaLanguage:
          $ref: '#/components/schemas/ModelFormulaLanguage'
        attributionMethod:
          $ref: '#/components/schemas/AttributionMethod'
    CalcModelPatch:
      type: object
      description: The model settings an `updateModel` operation changes; absent properties are kept.
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
        currencyCode:
          type: string
          minLength: 1
        calendarKey:
          type: string
          minLength: 1
        formulaLanguage:
          $ref: '#/components/schemas/ModelFormulaLanguage'
        attributionMethod:
          $ref: '#/components/schemas/AttributionMethod'
        isEnabled:
          type: boolean
    ModelFormulaCheckRequest:
      type: object
      required:
        - formula
        - selfKey
      properties:
        formula:
          type: string
        selfKey:
          type:
            - string
            - 'null'
          description: The key of the metric that owns the formula, so self-reads are reported; null for a new metric.
    ModelFormulaError:
      type: object
      required:
        - message
        - start
        - end
      properties:
        message:
          type: string
        start:
          type: integer
          description: Zero-based character offset where the error starts.
        end:
          type: integer
          description: Zero-based character offset just past the error.
    ModelFormulaCheck:
      type: object
      required:
        - errors
        - reads
        - parameters
        - requiresLanguage
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ModelFormulaError'
        reads:
          type: array
          description: Metric keys the formula reads, in order of first use.
          items:
            type: string
        parameters:
          type: array
          description: Declared parameter keys (`@param`) the formula reads; never `periodDays` or `yearDays`.
          items:
            type: string
        requiresLanguage:
          $ref: '#/components/schemas/ModelFormulaLanguage'
    ModelUpdateModelOperation:
      type: object
      required:
        - op
        - patch
      properties:
        op:
          const: updateModel
        patch:
          $ref: '#/components/schemas/CalcModelPatch'
    ModelSaveVariableOperation:
      type: object
      required:
        - op
        - input
      properties:
        op:
          const: saveVariable
        input:
          $ref: '#/components/schemas/ModelVariable'
        originalKey:
          type: string
          description: Present when an existing variable is edited; a key differing from it is refused (keys are fixed).
    ModelDeleteVariableOperation:
      type: object
      required:
        - op
        - key
      properties:
        op:
          const: deleteVariable
        key:
          type: string
    ModelSaveMeasureOperation:
      type: object
      required:
        - op
        - input
      properties:
        op:
          const: saveMeasure
        input:
          $ref: '#/components/schemas/ModelMeasure'
        originalKey:
          type: string
          description: Present when an existing measure is edited; a key differing from it is refused (keys are fixed).
    ModelDeleteMeasureOperation:
      type: object
      required:
        - op
        - key
      properties:
        op:
          const: deleteMeasure
        key:
          type: string
    ModelSaveParameterOperation:
      type: object
      required:
        - op
        - input
      properties:
        op:
          const: saveParameter
        input:
          $ref: '#/components/schemas/ModelParameter'
        originalKey:
          type: string
          description: Present when an existing parameter is edited; a key differing from it is refused (keys are fixed).
    ModelDeleteParameterOperation:
      type: object
      required:
        - op
        - key
      properties:
        op:
          const: deleteParameter
        key:
          type: string
    ModelSetAttributionOperation:
      type: object
      required:
        - op
        - input
      properties:
        op:
          const: setAttribution
        input:
          $ref: '#/components/schemas/Attribution'
    ModelClearAttributionOperation:
      type: object
      required:
        - op
        - metricKey
      properties:
        op:
          const: clearAttribution
        metricKey:
          type: string
    ModelOperation:
      description: One edit of a model change set, named after the `ModelsApi` edit method it records.
      oneOf:
        - $ref: '#/components/schemas/ModelUpdateModelOperation'
        - $ref: '#/components/schemas/ModelSaveVariableOperation'
        - $ref: '#/components/schemas/ModelDeleteVariableOperation'
        - $ref: '#/components/schemas/ModelSaveMeasureOperation'
        - $ref: '#/components/schemas/ModelDeleteMeasureOperation'
        - $ref: '#/components/schemas/ModelSaveParameterOperation'
        - $ref: '#/components/schemas/ModelDeleteParameterOperation'
        - $ref: '#/components/schemas/ModelSetAttributionOperation'
        - $ref: '#/components/schemas/ModelClearAttributionOperation'
      discriminator:
        propertyName: op
        mapping:
          updateModel: '#/components/schemas/ModelUpdateModelOperation'
          saveVariable: '#/components/schemas/ModelSaveVariableOperation'
          deleteVariable: '#/components/schemas/ModelDeleteVariableOperation'
          saveMeasure: '#/components/schemas/ModelSaveMeasureOperation'
          deleteMeasure: '#/components/schemas/ModelDeleteMeasureOperation'
          saveParameter: '#/components/schemas/ModelSaveParameterOperation'
          deleteParameter: '#/components/schemas/ModelDeleteParameterOperation'
          setAttribution: '#/components/schemas/ModelSetAttributionOperation'
          clearAttribution: '#/components/schemas/ModelClearAttributionOperation'
    ModelChangeSetRequest:
      allOf:
        - $ref: '#/components/schemas/ChangeSetRequest'
        - type: object
          required:
            - operations
          properties:
            operations:
              type: array
              items:
                $ref: '#/components/schemas/ModelOperation'
    ModelChangeSetPreview:
      allOf:
        - $ref: '#/components/schemas/ChangeSetPreview'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/ModelDocument'
    ModelChangeSetCommit:
      allOf:
        - $ref: '#/components/schemas/ChangeSetCommit'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/ModelDocument'
    ReportLayout:
      type: string
      enum:
        - statement
        - list
    ReportSubtotalPosition:
      type: string
      enum:
        - above
        - below
    ReportRowKind:
      type: string
      description: '`data` and `group` rows are report dimension members (a `group` has members under it); `section` and `formula` rows are overlay lines (OI-48).'
      enum:
        - data
        - group
        - section
        - formula
    ReportMappingMethod:
      type: string
      description: '`bridge` reaches rows through the source''s report bridge; `direct` matches a field''s values to row keys.'
      enum:
        - bridge
        - direct
    ReportSelectionScope:
      type: string
      description: '`exact` needs a leaf member.'
      enum:
        - exact
        - descendants
    ReportStyleRole:
      type: string
      enum:
        - header
        - subtotal
        - total
        - detail
        - formula
    ReportFontWeight:
      type: string
      enum:
        - normal
        - medium
        - semibold
        - bold
    ReportBorderStyle:
      type: string
      enum:
        - none
        - thin
        - medium
        - thick
        - double
    ReportColumnValueKind:
      type: string
      enum:
        - variable
        - calculated
    ReportSummary:
      type: object
      required:
        - id
        - key
        - displayName
        - reportType
        - modelId
        - modelKey
        - isEnabled
        - periodicity
        - profileCount
        - sourceCount
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        reportType:
          type: string
        modelId:
          $ref: '#/components/schemas/Id'
        modelKey:
          $ref: '#/components/schemas/DottedKey'
        isEnabled:
          type: boolean
        periodicity:
          oneOf:
            - $ref: '#/components/schemas/Periodicity'
            - type: 'null'
        profileCount:
          type: integer
          minimum: 0
        sourceCount:
          type: integer
          minimum: 0
    ReportSettings:
      type: object
      required:
        - displayName
        - reportType
        - subtotalPosition
        - defaultProfileKey
        - periodicity
        - layout
        - defaultBreakout
        - defaultFilter
      properties:
        displayName:
          type: string
        reportType:
          type: string
        subtotalPosition:
          $ref: '#/components/schemas/ReportSubtotalPosition'
        defaultProfileKey:
          type:
            - string
            - 'null'
        periodicity:
          oneOf:
            - $ref: '#/components/schemas/Periodicity'
            - type: 'null'
        layout:
          $ref: '#/components/schemas/ReportLayout'
        defaultBreakout:
          type: array
          description: Calculation dimension keys.
          items:
            type: string
        defaultFilter:
          description: Filter over calculation dimension keys.
          oneOf:
            - $ref: '#/components/schemas/FilterNode'
            - type: 'null'
    ReportSettingsPatch:
      type: object
      description: The settings to change; absent properties keep their value.
      properties:
        displayName:
          type: string
        reportType:
          type: string
        subtotalPosition:
          $ref: '#/components/schemas/ReportSubtotalPosition'
        defaultProfileKey:
          type:
            - string
            - 'null'
        periodicity:
          oneOf:
            - $ref: '#/components/schemas/Periodicity'
            - type: 'null'
        layout:
          $ref: '#/components/schemas/ReportLayout'
        defaultBreakout:
          type: array
          items:
            type: string
        defaultFilter:
          oneOf:
            - $ref: '#/components/schemas/FilterNode'
            - type: 'null'
    ReportRow:
      type: object
      required:
        - key
        - label
        - kind
        - parentKey
        - isVisible
        - showsValues
        - calculatedMeasureKey
        - valueColumnKey
        - styleKey
        - parameters
      properties:
        key:
          $ref: '#/components/schemas/Key'
        label:
          type: string
        kind:
          $ref: '#/components/schemas/ReportRowKind'
        parentKey:
          type:
            - string
            - 'null'
        isVisible:
          type: boolean
        showsValues:
          type: boolean
          description: Member rows; false makes a header that shows no values.
        calculatedMeasureKey:
          type:
            - string
            - 'null'
          description: Formula rows.
        valueColumnKey:
          type:
            - string
            - 'null'
          description: Formula rows.
        styleKey:
          type:
            - string
            - 'null'
        parameters:
          type: object
          description: The row's own model parameter values; missing keys inherit.
          additionalProperties:
            type:
              - string
              - number
    ReportRowPosition:
      type: object
      required:
        - parentKey
        - index
      properties:
        parentKey:
          type:
            - string
            - 'null'
        index:
          type: integer
          minimum: 0
          description: Index among the new siblings after the move.
    ReportSourceRule:
      type: object
      required:
        - itemKey
        - selection
        - factor
      properties:
        itemKey:
          type: string
        selection:
          $ref: '#/components/schemas/SourceSelection'
        factor:
          type: number
          description: The only number a rule carries; -1 on an item already included excludes it (OI-52).
    ReportSourceVariable:
      type: object
      required:
        - variableKey
        - measureKey
        - filter
        - missingBehavior
      properties:
        variableKey:
          type: string
        measureKey:
          type: string
        filter:
          description: Filter over the dataset's filterable fields, applied before aggregation.
          oneOf:
            - $ref: '#/components/schemas/FilterNode'
            - type: 'null'
        missingBehavior:
          description: Replaces the variable's own missing behavior for this source; null keeps the variable's.
          oneOf:
            - $ref: '#/components/schemas/VariableMissingBehavior'
            - type: 'null'
    ReportSourceInput:
      type: object
      required:
        - key
        - displayName
        - datasetId
        - timeFieldKey
        - method
        - roleId
        - fieldKey
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        datasetId:
          $ref: '#/components/schemas/Id'
        timeFieldKey:
          type: string
        method:
          $ref: '#/components/schemas/ReportMappingMethod'
        roleId:
          type:
            - string
            - 'null'
          description: Bridge sources.
        fieldKey:
          type:
            - string
            - 'null'
          description: Direct sources.
    ReportSource:
      allOf:
        - $ref: '#/components/schemas/ReportSourceInput'
        - type: object
          required:
            - bridgeId
            - variables
            - rules
            - leftOut
          properties:
            bridgeId:
              type:
                - string
                - 'null'
              description: Bridge sources; the report bridge the source owns.
            variables:
              type: array
              items:
                $ref: '#/components/schemas/ReportSourceVariable'
            rules:
              type: object
              description: Bridge sources; rules by row key.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/ReportSourceRule'
            leftOut:
              type: array
              description: Bridge sources; items excluded on purpose, which coverage does not count as gaps.
              items:
                type: string
    ReportProfile:
      type: object
      required:
        - key
        - displayName
        - isEnabled
        - picks
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        isEnabled:
          type: boolean
        picks:
          type: object
          description: Variable key to source key.
          additionalProperties:
            type: string
    ReportCalculationDimension:
      type: object
      required:
        - key
        - displayName
        - roleId
        - grouping
        - isGroupable
        - isFilterable
        - isEnabled
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        roleId:
          $ref: '#/components/schemas/Id'
        grouping:
          $ref: '#/components/schemas/Grouping'
        isGroupable:
          type: boolean
        isFilterable:
          type: boolean
        isEnabled:
          type: boolean
    ReportScenario:
      type: object
      description: A role whose members a run reads one at a time; its display name is the role's (OI-50).
      required:
        - roleId
      properties:
        roleId:
          $ref: '#/components/schemas/Id'
    ReportVariableScope:
      type: object
      description: One scope per variable (OI-50).
      required:
        - variableKey
        - scopeMemberKey
        - selectionScope
      properties:
        variableKey:
          type: string
        scopeMemberKey:
          type: string
        selectionScope:
          $ref: '#/components/schemas/ReportSelectionScope'
    ReportColumn:
      type: object
      required:
        - key
        - displayName
        - valueKind
        - metricKey
        - displayFormat
        - isVisible
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type:
            - string
            - 'null'
          description: Null keeps the metric's label.
        valueKind:
          $ref: '#/components/schemas/ReportColumnValueKind'
        metricKey:
          type: string
        displayFormat:
          type:
            - string
            - 'null'
          description: Null keeps the metric's format.
        isVisible:
          type: boolean
    ReportStyle:
      type: object
      description: A null property keeps the client's own styling.
      required:
        - key
        - displayName
        - defaultRole
        - fontFamily
        - fontSize
        - fontWeight
        - isItalic
        - textColor
        - backgroundColor
        - borderTop
        - borderBottom
        - indent
      properties:
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        defaultRole:
          oneOf:
            - $ref: '#/components/schemas/ReportStyleRole'
            - type: 'null'
        fontFamily:
          type:
            - string
            - 'null'
        fontSize:
          type:
            - number
            - 'null'
          description: Points.
        fontWeight:
          oneOf:
            - $ref: '#/components/schemas/ReportFontWeight'
            - type: 'null'
        isItalic:
          type: boolean
        textColor:
          $ref: '#/components/schemas/ReportColor'
        backgroundColor:
          $ref: '#/components/schemas/ReportColor'
        borderTop:
          oneOf:
            - $ref: '#/components/schemas/ReportBorderStyle'
            - type: 'null'
        borderBottom:
          oneOf:
            - $ref: '#/components/schemas/ReportBorderStyle'
            - type: 'null'
        indent:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Indent levels added to the row's depth.
    ReportColor:
      type:
        - string
        - 'null'
      pattern: ^#[0-9A-Fa-f]{6}$
    ReportDocument:
      type: object
      required:
        - id
        - key
        - isEnabled
        - modelId
        - reportDimensionId
        - reportDimensionVersionId
        - settings
        - rows
        - sources
        - profiles
        - calculationDimensions
        - scenarios
        - variableScopes
        - columns
        - styles
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        isEnabled:
          type: boolean
        modelId:
          $ref: '#/components/schemas/Id'
        reportDimensionId:
          $ref: '#/components/schemas/Id'
        reportDimensionVersionId:
          $ref: '#/components/schemas/Id'
        settings:
          $ref: '#/components/schemas/ReportSettings'
        rows:
          type: array
          description: Hierarchy order.
          items:
            $ref: '#/components/schemas/ReportRow'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ReportSource'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ReportProfile'
        calculationDimensions:
          type: array
          items:
            $ref: '#/components/schemas/ReportCalculationDimension'
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/ReportScenario'
        variableScopes:
          type: array
          items:
            $ref: '#/components/schemas/ReportVariableScope'
        columns:
          type: array
          description: Sort order is the position.
          items:
            $ref: '#/components/schemas/ReportColumn'
        styles:
          type: array
          items:
            $ref: '#/components/schemas/ReportStyle'
    ReportDiagnostics:
      type: object
      description: Server-computed readiness, coverage and profile resolution (OI-05).
      required:
        - ready
        - steps
        - coverage
        - resolution
      properties:
        ready:
          type: boolean
          description: Every report rule passes, so the report can be enabled.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ReportDiagnosticsStep'
        coverage:
          type: object
          description: By source key.
          additionalProperties:
            $ref: '#/components/schemas/ReportSourceCoverage'
        resolution:
          type: object
          description: Profile key to variable key to resolution.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/ReportVariableResolution'
    ReportDiagnosticsStep:
      type: object
      required:
        - step
        - status
        - violations
      properties:
        step:
          type: string
          enum:
            - rows
            - sources
            - variables
            - items
            - profiles
            - dimensions
            - columns
        status:
          type: string
          enum:
            - ok
            - warn
            - fail
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    ReportSourceCoverage:
      type: object
      required:
        - unmapped
        - multi
        - leftOut
      properties:
        unmapped:
          type: array
          items:
            type: string
        multi:
          type: array
          description: Items that reach more than one row.
          items:
            $ref: '#/components/schemas/ReportCoverageMulti'
        leftOut:
          type: array
          items:
            type: string
    ReportCoverageMulti:
      type: object
      required:
        - itemKey
        - net
        - rows
      properties:
        itemKey:
          type: string
        net:
          type: number
          description: Sum of the factors with which the item reaches rows.
        rows:
          type: array
          description: Row keys.
          items:
            type: string
    ReportVariableResolution:
      type: object
      required:
        - status
        - sourceKey
        - rowGaps
      properties:
        status:
          type: string
          enum:
            - ok
            - shadowed
            - gap
            - unresolved
            - na
        sourceKey:
          type:
            - string
            - 'null'
        rowGaps:
          type: array
          description: Row keys the picked source does not supply.
          items:
            type: string
    ReportCreateInput:
      type: object
      description: '`startFromDimensionId` and `copyFromReportId` exclude each other.'
      required:
        - key
        - displayName
        - reportType
        - modelId
      properties:
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        reportType:
          type: string
        modelId:
          $ref: '#/components/schemas/Id'
        startFromDimensionId:
          $ref: '#/components/schemas/Id'
          description: A categorical or hierarchical dimension whose published members become the rows.
        copyFromReportId:
          $ref: '#/components/schemas/Id'
          description: A report whose rows, sources and content are copied.
    ReportEnabledInput:
      type: object
      required:
        - isEnabled
      properties:
        isEnabled:
          type: boolean
    ReportOperation:
      oneOf:
        - $ref: '#/components/schemas/ReportUpdateSettingsOperation'
        - $ref: '#/components/schemas/ReportSaveRowOperation'
        - $ref: '#/components/schemas/ReportMoveRowOperation'
        - $ref: '#/components/schemas/ReportDeleteRowOperation'
        - $ref: '#/components/schemas/ReportSaveSourceOperation'
        - $ref: '#/components/schemas/ReportDeleteSourceOperation'
        - $ref: '#/components/schemas/ReportSetSourceVariablesOperation'
        - $ref: '#/components/schemas/ReportSetRowRulesOperation'
        - $ref: '#/components/schemas/ReportSetLeftOutOperation'
        - $ref: '#/components/schemas/ReportSaveProfileOperation'
        - $ref: '#/components/schemas/ReportDeleteProfileOperation'
        - $ref: '#/components/schemas/ReportSaveCalculationDimensionOperation'
        - $ref: '#/components/schemas/ReportDeleteCalculationDimensionOperation'
        - $ref: '#/components/schemas/ReportSetScenariosOperation'
        - $ref: '#/components/schemas/ReportSetVariableScopesOperation'
        - $ref: '#/components/schemas/ReportSetColumnsOperation'
        - $ref: '#/components/schemas/ReportSaveStyleOperation'
        - $ref: '#/components/schemas/ReportDeleteStyleOperation'
      discriminator:
        propertyName: op
        mapping:
          updateSettings: '#/components/schemas/ReportUpdateSettingsOperation'
          saveRow: '#/components/schemas/ReportSaveRowOperation'
          moveRow: '#/components/schemas/ReportMoveRowOperation'
          deleteRow: '#/components/schemas/ReportDeleteRowOperation'
          saveSource: '#/components/schemas/ReportSaveSourceOperation'
          deleteSource: '#/components/schemas/ReportDeleteSourceOperation'
          setSourceVariables: '#/components/schemas/ReportSetSourceVariablesOperation'
          setRowRules: '#/components/schemas/ReportSetRowRulesOperation'
          setLeftOut: '#/components/schemas/ReportSetLeftOutOperation'
          saveProfile: '#/components/schemas/ReportSaveProfileOperation'
          deleteProfile: '#/components/schemas/ReportDeleteProfileOperation'
          saveCalculationDimension: '#/components/schemas/ReportSaveCalculationDimensionOperation'
          deleteCalculationDimension: '#/components/schemas/ReportDeleteCalculationDimensionOperation'
          setScenarios: '#/components/schemas/ReportSetScenariosOperation'
          setVariableScopes: '#/components/schemas/ReportSetVariableScopesOperation'
          setColumns: '#/components/schemas/ReportSetColumnsOperation'
          saveStyle: '#/components/schemas/ReportSaveStyleOperation'
          deleteStyle: '#/components/schemas/ReportDeleteStyleOperation'
    ReportUpdateSettingsOperation:
      type: object
      required:
        - op
        - patch
      properties:
        op:
          const: updateSettings
        patch:
          $ref: '#/components/schemas/ReportSettingsPatch'
    ReportSaveRowOperation:
      type: object
      description: Creates the row when its key is new, otherwise updates it; the key is fixed once created.
      required:
        - op
        - row
        - index
      properties:
        op:
          const: saveRow
        row:
          $ref: '#/components/schemas/ReportRow'
        index:
          type: integer
          minimum: 0
          description: Index among the row's siblings.
    ReportMoveRowOperation:
      type: object
      required:
        - op
        - key
        - to
      properties:
        op:
          const: moveRow
        key:
          type: string
        to:
          $ref: '#/components/schemas/ReportRowPosition'
    ReportDeleteRowOperation:
      type: object
      description: Children move up; the row's rules, scopes, parameters and member option go (OI-56).
      required:
        - op
        - key
      properties:
        op:
          const: deleteRow
        key:
          type: string
    ReportSaveSourceOperation:
      type: object
      description: Creates the source when its key is new, otherwise updates it. Creating a bridge source creates its report bridge. `copyFromSourceKey` copies another source's variables, rules and left-out items into a new source.
      required:
        - op
        - input
      properties:
        op:
          const: saveSource
        input:
          $ref: '#/components/schemas/ReportSourceInput'
        copyFromSourceKey:
          type: string
    ReportDeleteSourceOperation:
      type: object
      description: Deletes the source's report bridge and clears profile picks naming it (OI-56).
      required:
        - op
        - key
      properties:
        op:
          const: deleteSource
        key:
          type: string
    ReportSetSourceVariablesOperation:
      type: object
      required:
        - op
        - sourceKey
        - variables
      properties:
        op:
          const: setSourceVariables
        sourceKey:
          type: string
        variables:
          type: array
          items:
            $ref: '#/components/schemas/ReportSourceVariable'
    ReportSetRowRulesOperation:
      type: object
      description: Replaces the bridge rules of one row of a bridge source.
      required:
        - op
        - sourceKey
        - rowKey
        - rules
      properties:
        op:
          const: setRowRules
        sourceKey:
          type: string
        rowKey:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ReportSourceRule'
    ReportSetLeftOutOperation:
      type: object
      required:
        - op
        - sourceKey
        - itemKeys
      properties:
        op:
          const: setLeftOut
        sourceKey:
          type: string
        itemKeys:
          type: array
          items:
            type: string
    ReportSaveProfileOperation:
      type: object
      description: '`originalKey` names the profile to update; absent creates one.'
      required:
        - op
        - profile
      properties:
        op:
          const: saveProfile
        profile:
          $ref: '#/components/schemas/ReportProfile'
        originalKey:
          type: string
    ReportDeleteProfileOperation:
      type: object
      description: Refused while the profile is the default.
      required:
        - op
        - key
      properties:
        op:
          const: deleteProfile
        key:
          type: string
    ReportSaveCalculationDimensionOperation:
      type: object
      description: '`originalKey` names the calculation dimension to update; absent creates one.'
      required:
        - op
        - input
      properties:
        op:
          const: saveCalculationDimension
        input:
          $ref: '#/components/schemas/ReportCalculationDimension'
        originalKey:
          type: string
    ReportDeleteCalculationDimensionOperation:
      type: object
      description: Also removes the key from the default breakout and default filter (OI-56).
      required:
        - op
        - key
      properties:
        op:
          const: deleteCalculationDimension
        key:
          type: string
    ReportSetScenariosOperation:
      type: object
      required:
        - op
        - roleIds
      properties:
        op:
          const: setScenarios
        roleIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
    ReportSetVariableScopesOperation:
      type: object
      required:
        - op
        - scopes
      properties:
        op:
          const: setVariableScopes
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ReportVariableScope'
    ReportSetColumnsOperation:
      type: object
      required:
        - op
        - columns
      properties:
        op:
          const: setColumns
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ReportColumn'
    ReportSaveStyleOperation:
      type: object
      description: Creates the style when its key is new, otherwise updates it.
      required:
        - op
        - style
      properties:
        op:
          const: saveStyle
        style:
          $ref: '#/components/schemas/ReportStyle'
    ReportDeleteStyleOperation:
      type: object
      description: Refused with `report_styles_resolve` while a row names the style.
      required:
        - op
        - key
      properties:
        op:
          const: deleteStyle
        key:
          type: string
    ReportChangeSetRequest:
      allOf:
        - $ref: '#/components/schemas/ChangeSetRequest'
        - type: object
          required:
            - operations
          properties:
            operations:
              type: array
              items:
                $ref: '#/components/schemas/ReportOperation'
    ReportChangeSetPreview:
      allOf:
        - $ref: '#/components/schemas/ChangeSetPreview'
        - type: object
          required:
            - state
            - diagnostics
          properties:
            state:
              $ref: '#/components/schemas/ReportDocument'
            diagnostics:
              $ref: '#/components/schemas/ReportDiagnostics'
    ReportChangeSetCommit:
      allOf:
        - $ref: '#/components/schemas/ChangeSetCommit'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/ReportDocument'
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: The tenant directory key.
      schema:
        type: string
    DatasetIdPath:
      name: datasetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DatasetVersionIdPath:
      name: versionId
      in: path
      required: true
      description: A dataset version id.
      schema:
        $ref: '#/components/schemas/Id'
    DatasetFieldIdPath:
      name: fieldId
      in: path
      required: true
      description: A field of the version.
      schema:
        $ref: '#/components/schemas/Id'
    DatasetSourceObjectKindPath:
      name: kind
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DatasetSourceObjectKind'
    DatasetSourceObjectNamePath:
      name: name
      in: path
      required: true
      description: The table or view name.
      schema:
        type: string
    DimensionId:
      name: dimensionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DimensionVersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DimensionMemberId:
      name: memberId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DimensionLevelId:
      name: levelId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DimensionRoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DimensionProfileKey:
      name: profileKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Key'
    MappingSetId:
      name: mappingSetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MappingVersionId:
      name: mappingVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BridgeId:
      name: bridgeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BridgeVersionId:
      name: bridgeVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReleaseIdPath:
      name: releaseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReleaseDiffFrom:
      name: from
      in: query
      required: true
      description: The release compared from.
      schema:
        $ref: '#/components/schemas/Id'
    ReleaseDiffTo:
      name: to
      in: query
      required: true
      description: The release compared to.
      schema:
        $ref: '#/components/schemas/Id'
    AssumptionSetIdPath:
      name: setId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SetCompareFrom:
      name: from
      in: query
      required: true
      description: The assumption set compared from.
      schema:
        $ref: '#/components/schemas/Id'
    SetCompareTo:
      name: to
      in: query
      required: true
      description: The assumption set compared to.
      schema:
        $ref: '#/components/schemas/Id'
    ModelId:
      name: modelId
      in: path
      required: true
      description: The calculation model id.
      schema:
        $ref: '#/components/schemas/Id'
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReportSourceKey:
      name: sourceKey
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The body, route or query does not bind, or an input validator failed; see `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: No access to the route tenant, or `SystemAdmin` missing on `/api/system/*`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: An id in the route names no row in the tenant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: A precondition failed (not a draft, not editable, owned by a report, delete blocked, release not published).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: The change would break a rule; see `violations`. Nothing was written.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

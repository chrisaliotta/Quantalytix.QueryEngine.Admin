  /api/tenants/{tenantId}/reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReportId'
    get:
      operationId: getReport
      summary: Read a report's whole document.
      tags:
        - reports
      responses:
        '200':
          description: The report as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteReport
      summary: Delete a report with its report dimension, report bridges and content.
      description: Never blocked (P12).
      tags:
        - reports
      responses:
        '204':
          description: The report and everything it owns were deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/reports/{reportId}/diagnostics:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReportId'
    get:
      operationId: getReportDiagnostics
      summary: Check the stored report against the report rules, with coverage and profile resolution.
      description: Serves the port's `getDiagnostics`. Pending edits are diagnosed by the change-set preview instead.
      tags:
        - reports
      responses:
        '200':
          description: The diagnostics of the stored report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDiagnostics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/reports/{reportId}/sources/{sourceKey}/unmapped:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReportId'
      - $ref: '#/components/parameters/ReportSourceKey'
    get:
      operationId: getReportUnmappedItems
      summary: List the items a source reads that reach no row and are not left out.
      description: Serves the port's `getUnmappedItems`. Bridge sources list members of the role's dimension; direct sources list values of the field that are not row keys.
      tags:
        - reports
      responses:
        '200':
          description: Item keys, in the source dimension's order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: No such report, or the report has no source with that key.
  /api/tenants/{tenantId}/reports/{reportId}/changes/preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReportId'
    post:
      operationId: previewReportChanges
      summary: Apply staged report operations in memory and return the resulting document and diagnostics.
      description: Never writes. Serves every edit method of the port (01, Change-set protocol).
      tags:
        - reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportChangeSetRequest'
      responses:
        '200':
          description: Every operation applies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportChangeSetPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: An operation names a row, source, profile, dimension or style the report does not have.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: The report is enabled and the result fails the report gate, or a cascade is refused.
  /api/tenants/{tenantId}/reports/{reportId}/changes:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReportId'
    post:
      operationId: commitReportChanges
      summary: Apply and write staged report operations as one batch.
      description: Replays the operations onto the stored report; any failure writes nothing. Serves `commitChanges`.
      tags:
        - reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportChangeSetRequest'
      responses:
        '200':
          description: Every operation applied and was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportChangeSetCommit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: An operation names a row, source, profile, dimension or style the report does not have.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: The report is enabled and the result fails the report gate, or a cascade is refused.
  /api/tenants/{tenantId}/reports/{reportId}/enabled:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReportId'
    put:
      operationId: setReportEnabled
      summary: Enable or disable a report.
      description: Serves the port's `setEnabled`. Enabling runs every report rule on the stored report.
      tags:
        - reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportEnabledInput'
      responses:
        '200':
          description: The report's new state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: A report rule fails; the report stays disabled.
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A JWT carrying `sub`, exactly one `tenant_id`, and `role: SystemAdmin` for callers who may reach any tenant (blueprint 01, Authentication and authorization).'
  schemas:
    Id:
      type: string
      description: Opaque identifier. Tables use BIGINT ids below 2^53; the API serializes them as strings. Inside a change set, an item created by an earlier operation is referenced by its client-generated temporary id, `tmp:<uuid>`.
      examples:
        - '1042'
    Key:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_]*$
      description: Natural key, fixed after creation (OI-29, OI-36).
    DottedKey:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_.]*$
      description: Natural key of a dataset, calculation model, report, mapping set or bridge; also allows `.`, matching the seed (`bank.balance_monthly`, `bank.margin_model`, `bank.margin_statement`) and report-derived bridge keys (OI-29).
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC timestamp.
    VersionStatus:
      type: string
      enum:
        - draft
        - validated
        - published
        - retired
    DimensionKind:
      type: string
      enum:
        - categorical
        - hierarchical
        - range
        - time
    DimensionPurpose:
      type: string
      enum:
        - analytical
        - report
    DefinitionOrigin:
      type: string
      enum:
        - system
        - user
    AssumptionSetStatus:
      type: string
      enum:
        - active
        - historical
    BindingKind:
      type: string
      enum:
        - direct
        - mapped
        - range
        - bridge
        - time
    Periodicity:
      type: string
      enum:
        - day
        - month
        - quarter
        - year
    MeasureKind:
      type: string
      enum:
        - aggregate
        - weighted_sum
        - weighted_average
        - period_average
        - formula
        - specialized
    ComponentRole:
      type: string
      enum:
        - value
        - weight
        - period_days
        - numerator
        - denominator
    RoundingMode:
      type: string
      enum:
        - half_even
        - half_up
        - down
        - up
        - truncate
    SourceSelection:
      type: string
      enum:
        - member
        - descendants
      description: '`descendants` is used only by report bridges and report rules (B8, OI-28).'
    VariableMissingBehavior:
      type: string
      enum:
        - 'null'
        - zero
    Problem:
      type: object
      description: The one error body (`application/problem+json`) for every 4xx and 5xx response (OI-06). 400 carries `errors`; 409 carries `violations` for delete blockers and `detail` otherwise; 422 carries `violations`; 401, 403 and 404 carry the title only; 500 carries `traceId`.
      required:
        - type
        - title
        - status
        - errors
      properties:
        type:
          type: string
          format: uri
          description: Stable problem code.
          examples:
            - urn:qe:problem:rules-violated
        title:
          type: string
          description: Short, user-facing summary.
        status:
          type: integer
          enum:
            - 400
            - 401
            - 403
            - 404
            - 409
            - 422
            - 500
        detail:
          type: string
        errors:
          type: object
          description: Input path to messages. `''` is the form-level key. Paths are camelCase, dotted and indexed (`components[0].fieldId`); inside a change set they are prefixed by the failing operation (`operations[3].memberKey`).
          additionalProperties:
            type: array
            items:
              type: string
        violations:
          type: array
          description: Rule violations (422) and delete blockers (409).
          items:
            $ref: '#/components/schemas/Violation'
        traceId:
          type: string
    Violation:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: The rule code, snake_case.
          examples:
            - member_key_unique
        message:
          type: string
          description: Phrased for display.
        target:
          $ref: '#/components/schemas/ViolationTarget'
    ViolationTarget:
      type: object
      description: Where to take the user to fix a violation.
      required:
        - area
      properties:
        area:
          type: string
          description: Module-specific area such as a dataset tab, a dimension tab, a release manifest row or a report section.
        itemId:
          $ref: '#/components/schemas/Id'
        itemKey:
          type: string
        filter:
          type: string
          description: Search text that narrows a table to the offending rows.
    DeleteCheck:
      type: object
      description: Answer of `GET <resource>/delete-check`; `DELETE <resource>` answers 409 with the same violations when blocked (OI-07).
      required:
        - allowed
        - message
        - reasons
      properties:
        allowed:
          type: boolean
        message:
          type:
            - string
            - 'null'
          description: One-sentence summary when blocked.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/DeleteBlocker'
    DeleteBlocker:
      description: A reason a delete is refused; a `Violation` whose code is a `DeleteBlockerCode`.
      allOf:
        - $ref: '#/components/schemas/Violation'
        - type: object
          required:
            - code
          properties:
            code:
              $ref: '#/components/schemas/DeleteBlockerCode'
    DeleteBlockerCode:
      type: string
      description: One list for every module (01, Delete checks). `referenced_by_<kind>` names the kind of object that still reads the target; the other codes name a state of the target itself.
      enum:
        - not_removable
        - system_dimension
        - published_version
        - live_version
        - has_published_versions
        - has_children
        - required_by_profile
        - assigned_by_bands
        - named_by_consumers
        - owned_by_report
        - referenced_by_member
        - referenced_by_dataset_binding
        - referenced_by_mapping_set
        - referenced_by_bridge
        - referenced_by_calculation_dimension
        - referenced_by_report_scenario
        - referenced_by_report_source
        - referenced_by_assumption_set
        - referenced_by_release
        - referenced_by_report
    ValidationReport:
      type: object
      description: Answer of a read-only `check`; never writes.
      required:
        - versionId
        - checkedAt
        - violations
      properties:
        versionId:
          $ref: '#/components/schemas/Id'
        checkedAt:
          $ref: '#/components/schemas/Timestamp'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    ChangeSetRequest:
      type: object
      description: 'Body of `POST <aggregate>/changes/preview` and `POST <aggregate>/changes` (OI-01). Generic over the aggregate''s operation union: an aggregate specializes it with `allOf` and a narrowed `operations.items` (see README.md).'
      required:
        - operations
      properties:
        operations:
          type: array
          items:
            description: One operation of the aggregate's union, discriminated by `op`.
    ChangeSetPreview:
      type: object
      description: '200 answer of `POST <aggregate>/changes/preview`: the operations apply. Generic over the aggregate content: an aggregate specializes it with `allOf` and a narrowed `state`.'
      required:
        - state
        - violations
      properties:
        state:
          description: The aggregate content after the operations apply; what the editor renders.
        violations:
          type: array
          description: Publication-rule findings that do not block saving.
          items:
            $ref: '#/components/schemas/Violation'
    ChangeSetCommit:
      type: object
      description: '200 answer of `POST <aggregate>/changes`: every operation applied and was written. Generic over the aggregate content: an aggregate specializes it with `allOf` and a narrowed `state`.'
      required:
        - state
        - idMap
      properties:
        state:
          description: The aggregate content as stored after the commit.
        idMap:
          type: object
          description: Temporary id (`tmp:<uuid>`) to the real id of each item the commit created.
          additionalProperties:
            $ref: '#/components/schemas/Id'
    FreezeInput:
      type: object
      description: Body of `POST <kind>-versions/{versionId}/freeze` for dimensions, mapping sets and bridges (OI-14).
      required:
        - note
      properties:
        note:
          type:
            - string
            - 'null'
          description: Why the version is frozen, e.g. "FY26 close"; stored as `freeze_note` (OI-15).
    FreezeResult:
      type: object
      description: '200 answer of a freeze: every rule passed, version n is frozen and `live` is the new live version n+1. Generic over the version summary: each living kind specializes `live` with `allOf`. Over HTTP a failed rule answers 422 and changes nothing, so a 200 always carries a non-null `live`; the web HTTP adapter turns the 422 into the port''s `live: null` (01, Results and errors).'
      required:
        - report
        - live
      properties:
        report:
          $ref: '#/components/schemas/ValidationReport'
        live:
          description: The new live version.
    Grouping:
      description: How a role's members group.
      oneOf:
        - $ref: '#/components/schemas/GroupingMember'
        - $ref: '#/components/schemas/GroupingLevel'
        - $ref: '#/components/schemas/GroupingAncestor'
        - $ref: '#/components/schemas/GroupingDepth'
      discriminator:
        propertyName: mode
        mapping:
          member: '#/components/schemas/GroupingMember'
          level: '#/components/schemas/GroupingLevel'
          ancestor: '#/components/schemas/GroupingAncestor'
          depth: '#/components/schemas/GroupingDepth'
    GroupingMember:
      type: object
      required:
        - mode
      properties:
        mode:
          const: member
    GroupingLevel:
      type: object
      required:
        - mode
        - levelKey
      properties:
        mode:
          const: level
        levelKey:
          type: string
    GroupingAncestor:
      type: object
      required:
        - mode
        - memberKey
      properties:
        mode:
          const: ancestor
        memberKey:
          type: string
    GroupingDepth:
      type: object
      required:
        - mode
        - depth
      properties:
        mode:
          const: depth
        depth:
          type: integer
          minimum: 0
    FilterNode:
      description: The query engine's structured `filterNode`, as the schema stores it in `default_filter_json` and `source_filter_json`. A dimension operand's grouping uses `Grouping`; the server serializes it into the engine's shape (OI-54).
      oneOf:
        - $ref: '#/components/schemas/FilterLogical'
        - $ref: '#/components/schemas/FilterNot'
        - $ref: '#/components/schemas/FilterComparison'
        - $ref: '#/components/schemas/FilterIn'
        - $ref: '#/components/schemas/FilterNullCheck'
    FilterLogical:
      type: object
      required:
        - operator
        - operands
      properties:
        operator:
          type: string
          enum:
            - and
            - or
        operands:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FilterNode'
    FilterNot:
      type: object
      required:
        - operator
        - operand
      properties:
        operator:
          const: not
        operand:
          $ref: '#/components/schemas/FilterNode'
    FilterComparison:
      type: object
      required:
        - operator
        - left
        - right
      properties:
        operator:
          type: string
          enum:
            - eq
            - ne
            - lt
            - le
            - gt
            - ge
        left:
          $ref: '#/components/schemas/FilterOperand'
        right:
          $ref: '#/components/schemas/FilterOperand'
    FilterIn:
      type: object
      required:
        - operator
        - left
        - values
      properties:
        operator:
          const: in
        left:
          $ref: '#/components/schemas/FilterOperand'
        values:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FilterOperand'
    FilterNullCheck:
      type: object
      required:
        - operator
        - operand
      properties:
        operator:
          type: string
          enum:
            - isNull
            - isNotNull
        operand:
          $ref: '#/components/schemas/FilterOperand'
    FilterOperand:
      oneOf:
        - $ref: '#/components/schemas/FilterReferenceOperand'
        - $ref: '#/components/schemas/FilterDimensionOperand'
        - $ref: '#/components/schemas/FilterLiteralOperand'
      discriminator:
        propertyName: type
        mapping:
          field: '#/components/schemas/FilterReferenceOperand'
          measure: '#/components/schemas/FilterReferenceOperand'
          parameter: '#/components/schemas/FilterReferenceOperand'
          dimension: '#/components/schemas/FilterDimensionOperand'
          literal: '#/components/schemas/FilterLiteralOperand'
    FilterReferenceOperand:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - field
            - measure
            - parameter
        id:
          type: string
          description: The field, measure or parameter key.
    FilterDimensionOperand:
      type: object
      required:
        - type
        - id
      properties:
        type:
          const: dimension
        id:
          type: string
          description: The calculation dimension key.
        grouping:
          $ref: '#/components/schemas/Grouping'
    FilterLiteralOperand:
      type: object
      required:
        - type
        - value
      properties:
        type:
          const: literal
        value:
          type:
            - string
            - number
            - boolean
            - 'null'
    VocabularyTerm:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
          description: The schema's value.
        label:
          type: string
        description:
          type: string
    Session:
      type: object
      description: Who the caller is, as the API sees its bearer token. There are no tenant roles (OI-09).
      required:
        - subject
        - displayName
        - tenantId
        - isSystemAdmin
      properties:
        subject:
          type: string
          description: The token's `sub`.
        displayName:
          type:
            - string
            - 'null'
          description: The token's name claim; null when it carries none.
        tenantId:
          type:
            - string
            - 'null'
          description: The caller's tenant when the token carries exactly one tenant claim; otherwise null.
        isSystemAdmin:
          type: boolean
          description: Whether the caller may reach every tenant and the tenant directory.
    AccessibleTenant:
      type: object
      required:
        - tenantId
        - isEnabled
      properties:
        tenantId:
          type: string
          description: The tenant directory key.
        isEnabled:
          type: boolean
          description: Whether query routing is permitted for the tenant.
    TenantInfo:
      type: object
      description: The tenant database's identity and the revision the engine keys its metadata cache by.
      required:
        - tenantKey
        - metadataSchemaVersion
        - semanticRevision
        - activeReleaseId
      properties:
        tenantKey:
          type: string
          description: '`qe_database_info.tenant_key`.'
        metadataSchemaVersion:
          type: integer
        semanticRevision:
          type: integer
          format: int64
          description: Advances once per commit or command that changes what the engine reads.
        activeReleaseId:
          type:
            - string
            - 'null'
          description: The release runtime queries use; null when the tenant has none.
    TenantOverview:
      description: The tenant at a glance for the overview screen.
      allOf:
        - $ref: '#/components/schemas/TenantInfo'
        - type: object
          required:
            - counts
            - drafts
          properties:
            counts:
              $ref: '#/components/schemas/TenantOverviewCounts'
            drafts:
              $ref: '#/components/schemas/TenantOverviewDrafts'
    TenantOverviewCounts:
      type: object
      description: How much metadata the tenant holds.
      required:
        - datasets
        - dimensions
        - mappingSets
        - bridges
        - releases
        - assumptionSets
        - models
        - reports
        - activeMeasures
      properties:
        datasets:
          type: integer
        dimensions:
          type: integer
          description: Analytical dimensions; report-owned dimensions are not counted (OI-22).
        mappingSets:
          type: integer
        bridges:
          type: integer
          description: Analytical bridges; report-owned bridges are not counted (OI-22).
        releases:
          type: integer
        assumptionSets:
          type: integer
        models:
          type: integer
        reports:
          type: integer
        activeMeasures:
          type: integer
          description: Measures of the dataset versions the active release pins.
    TenantOverviewDrafts:
      type: object
      description: 'Work in progress: the kinds that still have a draft status. Dimensions, mapping sets and bridges follow the living lifecycle and have no drafts (OI-14).'
      required:
        - datasetVersions
        - releases
      properties:
        datasetVersions:
          type: integer
        releases:
          type: integer
    TenantCatalog:
      type: object
      description: The union of what every module's pickers and cross-module links read (OI-13).
      required:
        - tenant
        - datasets
        - dimensions
        - roles
        - mappingSets
        - bridges
        - models
        - reports
        - releases
        - assumptionSets
      properties:
        tenant:
          $ref: '#/components/schemas/TenantInfo'
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogDataset'
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogDimension'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogRole'
        mappingSets:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogMappingSet'
        bridges:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogBridge'
        models:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogModel'
        reports:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogReport'
        releases:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogRelease'
        assumptionSets:
          type: array
          items:
            $ref: '#/components/schemas/TenantCatalogAssumptionSet'
    TenantCatalogDataset:
      type: object
      required:
        - id
        - key
        - displayName
        - isEnabled
        - activeVersionId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        isEnabled:
          type: boolean
        activeVersionId:
          type:
            - string
            - 'null'
          description: The dataset version the active release pins; null when it pins none.
    TenantCatalogDimension:
      type: object
      required:
        - id
        - key
        - displayName
        - kind
        - purpose
        - origin
        - isEnabled
        - publishedVersionId
        - publishedVersionNumber
        - ownerReportId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        kind:
          $ref: '#/components/schemas/DimensionKind'
        purpose:
          $ref: '#/components/schemas/DimensionPurpose'
        origin:
          $ref: '#/components/schemas/DefinitionOrigin'
        isEnabled:
          type: boolean
        publishedVersionId:
          type:
            - string
            - 'null'
          description: The live version; null when none is published.
        publishedVersionNumber:
          type:
            - integer
            - 'null'
        ownerReportId:
          type:
            - string
            - 'null'
          description: The report that owns a `report` purpose dimension; null otherwise.
    TenantCatalogRole:
      type: object
      required:
        - id
        - key
        - displayName
        - dimensionId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        dimensionId:
          $ref: '#/components/schemas/Id'
    TenantCatalogMappingSet:
      type: object
      required:
        - id
        - key
        - displayName
        - dimensionId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        dimensionId:
          $ref: '#/components/schemas/Id'
    TenantCatalogBridge:
      type: object
      required:
        - id
        - key
        - displayName
        - sourceDimensionId
        - targetDimensionId
        - ownerReportId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        sourceDimensionId:
          $ref: '#/components/schemas/Id'
        targetDimensionId:
          $ref: '#/components/schemas/Id'
        ownerReportId:
          type:
            - string
            - 'null'
          description: The report that owns a report bridge; null for an analytical bridge.
    TenantCatalogModel:
      type: object
      required:
        - id
        - key
        - displayName
        - isEnabled
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        isEnabled:
          type: boolean
    TenantCatalogReport:
      type: object
      required:
        - id
        - key
        - displayName
        - isEnabled
        - modelId
        - reportDimensionId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        isEnabled:
          type: boolean
        modelId:
          $ref: '#/components/schemas/Id'
        reportDimensionId:
          $ref: '#/components/schemas/Id'
    TenantCatalogRelease:
      type: object
      description: A release has a key and no display name (OI-39).
      required:
        - id
        - key
        - status
        - isActive
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        isActive:
          type: boolean
    TenantCatalogAssumptionSet:
      type: object
      required:
        - id
        - key
        - displayName
        - status
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          type: string
        displayName:
          type: string
        status:
          $ref: '#/components/schemas/AssumptionSetStatus'
    PublishedMembers:
      type: object
      description: The members of a dimension's published version, fetched per picker.
      required:
        - dimensionId
        - versionId
        - members
      properties:
        dimensionId:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
        members:
          type: array
          items:
            $ref: '#/components/schemas/PublishedMember'
    PublishedMember:
      type: object
      required:
        - key
        - displayName
        - parentKey
        - isAssignable
        - levelKey
      properties:
        key:
          type: string
        displayName:
          type: string
        parentKey:
          type:
            - string
            - 'null'
        isAssignable:
          type: boolean
        levelKey:
          type:
            - string
            - 'null'
    Vocabularies:
      type: object

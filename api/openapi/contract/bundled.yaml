        sourceFieldId:
          type:
            - string
            - 'null'
        mappingSetId:
          type:
            - string
            - 'null'
        bridgeId:
          type:
            - string
            - 'null'
        sourceDimensionBindingId:
          type:
            - string
            - 'null'
        raggedBehavior:
          $ref: '#/components/schemas/DatasetRaggedBehavior'
        defaultPeriodAlignment:
          $ref: '#/components/schemas/DatasetPeriodAlignment'
        unmappedBehavior:
          $ref: '#/components/schemas/DatasetUnmappedBehavior'
        unknownMemberKey:
          type:
            - string
            - 'null'
        isRequired:

openapi: 3.1.0
info:
  title: Quantalytix Query Engine Admin API
  version: 1.0.0
  description: |
    Metadata administration for Query Engine tenants. Conventions (routing, ids, problems, change sets) are defined in
    docs/blueprint/01-api-conventions.md; each tag's module is specified by the blueprint file named in its description.
  license:
    name: Proprietary
    identifier: LicenseRef-Quantalytix-Proprietary
servers:
  - url: http://localhost:5180
    description: Local development host (api/src launch profile "http").
security:
  - Bearer: []
tags:
  - name: tenant
    x-displayName: Tenant, session and catalog
    description: Session, tenant directory, overview, catalog and vocabularies. Blueprint 10-tenant-session-catalog.md.
  - name: datasets
    x-displayName: Datasets
    description: Datasets, dataset versions, fields, grains, bindings, measures and source objects. Blueprint 11-datasets.md.
  - name: dimensions
    x-displayName: Dimensions
    description: Dimensions, roles, the live and frozen versions, levels, members and range bands. Blueprint 12-dimensions.md.
  - name: mappings
    x-displayName: Mapping sets and bridges
    description: Mapping sets, bridges and their live and frozen versions. Blueprint 13-mappings-and-bridges.md.
  - name: releases
    x-displayName: Releases and assumption sets
    description: Semantic releases, activation and assumption sets. Blueprint 14-releases-and-assumption-sets.md.
  - name: models
    x-displayName: Calculation models
    description: Calculation models, variables, calculated measures, parameters and attributions. Blueprint 15-calculation-models.md.
  - name: reports
    x-displayName: Reports
    description: Reports and their rows, sources, profiles, scenarios, scopes, columns and styles. Blueprint 16-reports.md.
paths:
  /api/tenants/{tenantId}/mapping-sets:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listMappingSets
      summary: List mapping sets
      description: Every mapping set, or those targeting one dimension, with version summaries and bindings.
      tags:
        - mappings
      parameters:
        - name: dimensionId
          in: query
          required: false
          description: Only mapping sets that target this dimension.
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: The mapping sets, ordered by key.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MappingSetListItem'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createMappingSet
      summary: Create a mapping set
      description: Creates the mapping set with an empty live v1 (OI-27).
      tags:
        - mappings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMappingSetInput'
      responses:
        '201':
          description: Created, with its live v1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSetCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The key is taken, or the dimension is not an analytical categorical or hierarchical dimension (B1).
  /api/tenants/{tenantId}/mapping-sets/{mappingSetId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/MappingSetId'
    get:
      operationId: getMappingSet
      summary: Get a mapping set
      tags:
        - mappings
      responses:
        '200':
          description: The mapping set with its bindings and assumption set pins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSetDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMappingSet
      summary: Delete a mapping set
      description: Deletes the mapping set and every version when no binding uses it and no historical set pins it (B12).
      tags:
        - mappings
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Blocked; `violations` lists the same reasons as the delete check.
  /api/tenants/{tenantId}/mapping-sets/{mappingSetId}/delete-check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/MappingSetId'
    get:
      operationId: checkDeleteMappingSet
      summary: Check whether a mapping set can be deleted
      tags:
        - mappings
      responses:
        '200':
          description: Whether the delete is allowed, and why not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCheck'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/mapping-sets/{mappingSetId}/changes/preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/MappingSetId'
    post:
      operationId: previewMappingSetChanges
      summary: Preview mapping set changes
      description: Applies the operations to the stored mapping set and its live version in memory and writes nothing. Entries that break a rule come back as `violations` so the editor can flag them (B11).
      tags:
        - mappings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MappingSetChangeSetRequest'
      responses:
        '200':
          description: The operations apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSetChangeSetPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: An operation targets a frozen version.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /api/tenants/{tenantId}/mapping-sets/{mappingSetId}/changes:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/MappingSetId'
    post:
      operationId: commitMappingSetChanges
      summary: Commit mapping set changes
      description: Applies the operations to the stored mapping set and its live version and writes them. Refused while any rule violation remains (B11); advances `semantic_revision` once.
      tags:
        - mappings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MappingSetChangeSetRequest'
      responses:
        '200':
          description: Every operation applied and was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSetChangeSetCommit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: An operation targets a frozen version.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: The live version would break a rule; see `violations`. Nothing was written.
  /api/tenants/{tenantId}/mapping-versions/{mappingVersionId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/MappingVersionId'
    get:
      operationId: getMappingVersion
      summary: Get a mapping version's content
      tags:
        - mappings
      responses:
        '200':
          description: The version, its entries, coverage and rule findings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingVersionContent'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMappingVersion
      summary: Delete a frozen mapping version
      tags:
        - mappings
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The version is live, or a historical assumption set pins it.
  /api/tenants/{tenantId}/mapping-versions/{mappingVersionId}/check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/MappingVersionId'
    post:
      operationId: checkMappingVersion
      summary: Run the mapping version rules
      description: Runs every mapping version rule on any version and writes nothing (OI-30).
      tags:
        - mappings
      responses:
        '200':
          description: The rule report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/mapping-versions/{mappingVersionId}/freeze:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/MappingVersionId'
    post:
      operationId: freezeMappingVersion
      summary: Freeze the live mapping version
      description: Runs the rules; when they pass, makes the live version a frozen snapshot and continues in a live clone (12, The version model).
      tags:
        - mappings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MappingFreezeInput'
      responses:
        '200':
          description: Frozen; `live` is the new live version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingFreezeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The version is not live.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: A rule failed; see `violations`. Nothing was written.
  /api/tenants/{tenantId}/mapping-versions/{mappingVersionId}/delete-check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/MappingVersionId'
    get:
      operationId: checkDeleteMappingVersion
      summary: Check whether a mapping version can be deleted
      tags:
        - mappings
      responses:
        '200':
          description: Whether the delete is allowed, and why not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCheck'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/bridges:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listBridges
      summary: List bridges
      description: Analytical and report bridges. With `dimensionId`, the bridges starting or ending at that dimension. With `reportId` and `sourceKey`, the one report bridge of that report source, or none (serves `findReportBridge`).
      tags:
        - mappings
      parameters:
        - name: dimensionId
          in: query
          required: false
          description: Only bridges whose source or target is this dimension.
          schema:
            $ref: '#/components/schemas/Id'
        - name: reportId
          in: query
          required: false
          description: Only the report bridge owned by this report; used with `sourceKey`.
          schema:
            $ref: '#/components/schemas/Id'
        - name: sourceKey
          in: query
          required: false
          description: The report source whose bridge is wanted; used with `reportId`.
          schema:
            type: string
      responses:
        '200':
          description: Analytical bridges first, then report bridges, each ordered by key.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BridgeListItem'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createBridge
      summary: Create an analytical bridge
      description: Creates the bridge with an empty live v1, `many_to_one` / `none` (OI-27). Report bridges come from their report.
      tags:
        - mappings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBridgeInput'
      responses:
        '201':
          description: Created, with its live v1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The key is taken, or the endpoints break B4 (equal, time source, report dimension).
  /api/tenants/{tenantId}/bridges/{bridgeId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BridgeId'
    get:
      operationId: getBridge
      summary: Get a bridge
      tags:
        - mappings
      responses:
        '200':
          description: The bridge with its bindings and assumption set pins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteBridge
      summary: Delete an analytical bridge
      description: Deletes the bridge and every version when no binding uses it and no historical set pins it (B12).
      tags:
        - mappings
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Blocked (`violations` as in the delete check), or owned by a report.
  /api/tenants/{tenantId}/bridges/{bridgeId}/delete-check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BridgeId'
    get:
      operationId: checkDeleteBridge
      summary: Check whether a bridge can be deleted
      tags:
        - mappings
      responses:
        '200':
          description: Whether the delete is allowed, and why not. A report bridge is never allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCheck'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/bridges/{bridgeId}/changes/preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BridgeId'
    post:
      operationId: previewBridgeChanges
      summary: Preview bridge changes
      description: Applies the operations to the stored analytical bridge and its live version in memory and writes nothing. Mappings that break the cardinality, allocation or member rules come back as `violations` (B11).
      tags:
        - mappings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeChangeSetRequest'
      responses:
        '200':
          description: The operations apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeChangeSetPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The bridge is owned by a report, or an operation targets a frozen version.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /api/tenants/{tenantId}/bridges/{bridgeId}/changes:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BridgeId'
    post:
      operationId: commitBridgeChanges
      summary: Commit bridge changes
      description: Applies the operations to the stored analytical bridge and its live version and writes them. Refused while any rule violation remains (B11); advances `semantic_revision` once.
      tags:
        - mappings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeChangeSetRequest'
      responses:
        '200':
          description: Every operation applied and was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeChangeSetCommit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The bridge is owned by a report, or an operation targets a frozen version.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: The live version would break a rule; see `violations`. Nothing was written.
  /api/tenants/{tenantId}/bridge-versions/{bridgeVersionId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BridgeVersionId'
    get:
      operationId: getBridgeVersion
      summary: Get a bridge version's content
      tags:
        - mappings
      responses:
        '200':
          description: The version, its mappings, the allocation summary and rule findings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeVersionContent'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteBridgeVersion
      summary: Delete a frozen bridge version
      tags:
        - mappings
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The version is live, a historical assumption set pins it, or the bridge is owned by a report.
  /api/tenants/{tenantId}/bridge-versions/{bridgeVersionId}/check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BridgeVersionId'
    post:
      operationId: checkBridgeVersion
      summary: Run the bridge version rules
      description: Runs every bridge version rule on any version and writes nothing (OI-30).
      tags:
        - mappings
      responses:
        '200':
          description: The rule report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tenants/{tenantId}/bridge-versions/{bridgeVersionId}/freeze:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BridgeVersionId'
    post:
      operationId: freezeBridgeVersion
      summary: Freeze the live bridge version
      description: Runs the rules; when they pass, makes the live version a frozen snapshot and continues in a live clone with the same settings and mappings (12, The version model).
      tags:
        - mappings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeFreezeInput'
      responses:
        '200':
          description: Frozen; `live` is the new live version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeFreezeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The version is not live, or the bridge is owned by a report.
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: A rule failed; see `violations`. Nothing was written.
  /api/tenants/{tenantId}/bridge-versions/{bridgeVersionId}/delete-check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BridgeVersionId'
    get:
      operationId: checkDeleteBridgeVersion
      summary: Check whether a bridge version can be deleted
      tags:
        - mappings
      responses:
        '200':
          description: Whether the delete is allowed, and why not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCheck'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A JWT carrying `sub`, exactly one `tenant_id`, and `role: SystemAdmin` for callers who may reach any tenant (blueprint 01, Authentication and authorization).'
  schemas:
    Id:
      type: string
      description: Opaque identifier. Tables use BIGINT ids below 2^53; the API serializes them as strings. Inside a change set, an item created by an earlier operation is referenced by its client-generated temporary id, `tmp:<uuid>`.
      examples:
        - '1042'
    Key:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_]*$
      description: Natural key, fixed after creation (OI-29, OI-36).
    DottedKey:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_.]*$
      description: Natural key of a mapping set or bridge; also allows `.` (OI-29).
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC timestamp.
    VersionStatus:
      type: string
      enum:
        - draft
        - validated
        - published
        - retired
    Problem:
      type: object
      description: The one error body (`application/problem+json`) for every 4xx and 5xx response (OI-06). 400 carries `errors`; 409 carries `violations` for delete blockers and `detail` otherwise; 422 carries `violations`; 401, 403 and 404 carry the title only; 500 carries `traceId`.
      required:
        - type
        - title
        - status
        - errors
      properties:
        type:
          type: string
          format: uri
          description: Stable problem code.
          examples:
            - urn:qe:problem:rules-violated
        title:
          type: string
          description: Short, user-facing summary.
        status:
          type: integer
          enum:
            - 400
            - 401
            - 403
            - 404
            - 409
            - 422
            - 500
        detail:
          type: string
        errors:
          type: object
          description: Input path to messages. `''` is the form-level key. Paths are camelCase, dotted and indexed (`components[0].fieldId`); inside a change set they are prefixed by the failing operation (`operations[3].memberKey`).
          additionalProperties:
            type: array
            items:
              type: string
        violations:
          type: array
          description: Rule violations (422) and delete blockers (409).
          items:
            $ref: '#/components/schemas/Violation'
        traceId:
          type: string
    Violation:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: The rule code, snake_case.
          examples:
            - member_key_unique
        message:
          type: string
          description: Phrased for display.
        target:
          $ref: '#/components/schemas/ViolationTarget'
    ViolationTarget:
      type: object
      description: Where to take the user to fix a violation.
      required:
        - area
      properties:
        area:
          type: string
          description: Module-specific area such as a dataset tab, a dimension tab, a release manifest row or a report section.
        itemId:
          $ref: '#/components/schemas/Id'
        itemKey:
          type: string
        filter:
          type: string
          description: Search text that narrows a table to the offending rows.
    DeleteCheck:
      type: object
      description: Answer of `GET <resource>/delete-check`; `DELETE <resource>` answers 409 with the same violations when blocked (OI-07).
      required:
        - allowed
        - message
        - reasons
      properties:
        allowed:
          type: boolean
        message:
          type:
            - string
            - 'null'
          description: One-sentence summary when blocked.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    ValidationReport:
      type: object
      description: Answer of a read-only `check`; never writes.
      required:
        - versionId
        - checkedAt
        - violations
      properties:
        versionId:
          $ref: '#/components/schemas/Id'
        checkedAt:
          $ref: '#/components/schemas/Timestamp'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    ChangeSetRequest:
      type: object
      description: 'Body of `POST <aggregate>/changes/preview` and `POST <aggregate>/changes` (OI-01). Generic over the aggregate''s operation union: an aggregate specializes it with `allOf` and a narrowed `operations.items` (see README.md).'
      required:
        - operations
      properties:
        operations:
          type: array
          items:
            description: One operation of the aggregate's union, discriminated by `op`.
    ChangeSetPreview:
      type: object
      description: '200 answer of `POST <aggregate>/changes/preview`: the operations apply. Generic over the aggregate content: an aggregate specializes it with `allOf` and a narrowed `state`.'
      required:
        - state
        - violations
      properties:
        state:
          description: The aggregate content after the operations apply; what the editor renders.
        violations:
          type: array
          description: Publication-rule findings that do not block saving.
          items:
            $ref: '#/components/schemas/Violation'
    ChangeSetCommit:
      type: object
      description: '200 answer of `POST <aggregate>/changes`: every operation applied and was written. Generic over the aggregate content: an aggregate specializes it with `allOf` and a narrowed `state`.'
      required:
        - state
        - idMap
      properties:
        state:
          description: The aggregate content as stored after the commit.
        idMap:
          type: object
          description: Temporary id (`tmp:<uuid>`) to the real id of each item the commit created.
          additionalProperties:
            $ref: '#/components/schemas/Id'
    VocabularyTerm:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
          description: The schema's value.
        label:
          type: string
        description:
          type: string
    MappingCardinality:
      type: string
      enum:
        - many_to_one
        - many_to_many
    MappingAllocationMode:
      type: string
      enum:
        - none
        - partition
        - replicate
      description: '`many_to_one` allows `none` only; `many_to_many` allows `partition` or `replicate` (B5).'
    MappingSourceSelection:
      type: string
      enum:
        - member
        - descendants
      description: '`descendants` is used only by report bridges (B8, OI-28).'
    MappingDimensionRef:
      type: object
      description: A read-only slice of a dimension, enough to label it and to state which version keys resolve against.
      required:
        - id
        - key
        - displayName
        - kind
        - purpose
        - publishedVersionId
        - publishedVersionNumber
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Key'
        displayName:
          type: string
        kind:
          type: string
          enum:
            - categorical
            - hierarchical
            - range
            - time
        purpose:
          type: string
          enum:
            - analytical
            - report
        publishedVersionId:
          type:
            - string
            - 'null'
          description: The live version, whose members entry and mapping keys resolve against.
        publishedVersionNumber:
          type:
            - integer
            - 'null'
    MappingBindingUsage:
      type: object
      description: A dataset binding that names a mapping set or bridge by identity (B13); drives Used by and delete blockers.
      required:
        - datasetId
        - datasetKey
        - datasetVersionId
        - datasetVersionNumber
        - status
        - fieldKey
        - roleKey
        - sourceRoleKey
      properties:
        datasetId:
          $ref: '#/components/schemas/Id'
        datasetKey:
          $ref: '#/components/schemas/Key'
        datasetVersionId:
          $ref: '#/components/schemas/Id'
        datasetVersionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        fieldKey:
          $ref: '#/components/schemas/Key'
        roleKey:
          $ref: '#/components/schemas/Key'
        sourceRoleKey:
          type:
            - string
            - 'null'
          description: Bridge bindings only, the role of the binding the bridge remaps; null for mapping sets.
    MappingAssumptionPin:
      type: object
      description: An assumption set that pins one version of a mapping set or bridge.
      required:
        - assumptionSetId
        - assumptionSetKey
        - assumptionSetDisplayName
        - isActive
        - versionId
        - versionNumber
      properties:
        assumptionSetId:
          $ref: '#/components/schemas/Id'
        assumptionSetKey:
          type: string
        assumptionSetDisplayName:
          type: string
        isActive:
          type: boolean
          description: The active set always pins the live version; historical sets keep the version they captured.
        versionId:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
    MappingViolationCode:
      type: string
      description: Rule codes of mapping versions.
      enum:
        - source_key_unique
        - dimension_version_published
        - entry_member_in_version
        - entry_member_assignable
    BridgeViolationCode:
      type: string
      description: Rule codes of bridge versions.
      enum:
        - endpoint_versions_published
        - mapping_members_in_endpoint_versions
        - cardinality_many_to_one
        - allocation_none
        - allocation_partition
        - allocation_replicate
        - pair_unique
        - descendants_report_only
    MappingSet:
      type: object
      required:
        - id
        - key
        - displayName
        - sourceNamespace
        - dimensionId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        sourceNamespace:
          type: string
          description: Free text naming the source system (B14).
        dimensionId:
          $ref: '#/components/schemas/Id'
    MappingVersion:
      type: object
      description: Stored `published` is the live version and `retired` a frozen snapshot (B10).
      required:
        - id
        - mappingSetId
        - versionNumber
        - status
        - createdAt
        - publishedAt
        - retiredAt
        - freezeNote
      properties:
        id:
          $ref: '#/components/schemas/Id'
        mappingSetId:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        retiredAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was frozen.
        freezeNote:
          type:
            - string
            - 'null'
    MappingEntry:
      type: object
      required:
        - id
        - versionId
        - sourceKeyValue
        - memberKey
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
        sourceKeyValue:
          type: string
          description: Compared exactly as text, never trimmed or coerced (B2).
        memberKey:
          type: string
    MappingVersionSummary:
      type: object
      required:
        - id
        - versionNumber
        - status
        - createdAt
        - publishedAt
        - retiredAt
        - freezeNote
        - entryCount
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        retiredAt:
          type:
            - string
            - 'null'
          format: date-time
        freezeNote:
          type:
            - string
            - 'null'
        entryCount:
          type: integer
    MappingSetListItem:
      allOf:
        - $ref: '#/components/schemas/MappingSet'
        - type: object
          required:
            - dimension
            - versions
            - publishedEntryCount
            - bindings
          properties:
            dimension:
              $ref: '#/components/schemas/MappingDimensionRef'
            versions:
              type: array
              items:
                $ref: '#/components/schemas/MappingVersionSummary'
            publishedEntryCount:
              type: integer
              description: Entries of the live version.
            bindings:
              type: array
              items:
                $ref: '#/components/schemas/MappingBindingUsage'
    MappingSetDetail:
      allOf:
        - $ref: '#/components/schemas/MappingSetListItem'
        - type: object
          required:
            - pins
          properties:
            pins:
              type: array
              items:
                $ref: '#/components/schemas/MappingAssumptionPin'
    MappingCoverage:
      type: object
      description: Assignable members of the dimension's live version and those no entry maps to.
      required:
        - assignableMemberCount
        - uncoveredMemberKeys
      properties:
        assignableMemberCount:
          type: integer
        uncoveredMemberKeys:
          type: array
          items:
            type: string
    MappingVersionContent:
      type: object
      required:
        - version
        - entries
        - coverage
        - violations
      properties:
        version:
          $ref: '#/components/schemas/MappingVersion'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MappingEntry'
        coverage:
          $ref: '#/components/schemas/MappingCoverage'
        violations:
          type: array
          description: Rule findings on this content, with `target.itemId` naming the entry at fault. Empty on a saved live version, because commits refuse violations (B11); a preview's state carries the findings of the pending edits.
          items:
            $ref: '#/components/schemas/Violation'
    MappingSetEditState:
      type: object
      description: What the mapping set editor renders; the state of a mapping set change set.
      required:
        - set
        - content
      properties:
        set:
          $ref: '#/components/schemas/MappingSetDetail'
        content:
          $ref: '#/components/schemas/MappingVersionContent'
    CreateMappingSetInput:
      type: object
      required:
        - key
        - displayName
        - sourceNamespace
        - dimensionId
      properties:
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
          minLength: 1
        sourceNamespace:
          type: string
          minLength: 1
        dimensionId:
          $ref: '#/components/schemas/Id'
    MappingSetCreated:
      type: object
      required:
        - mappingSetId
        - versionId
      properties:
        mappingSetId:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
          description: The empty live v1.
    MappingSetPatch:
      type: object
      description: Key and dimension are fixed after creation.
      properties:
        displayName:
          type: string
          minLength: 1
        sourceNamespace:
          type: string
          minLength: 1
    MappingEntryInput:
      type: object
      required:
        - id
        - sourceKeyValue
        - memberKey
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: The entry's id, or a client-generated `tmp:<uuid>` for a new entry.
        sourceKeyValue:
          type: string
          minLength: 1
        memberKey:
          type: string
          minLength: 1
    MappingFreezeInput:
      type: object
      required:
        - note
      properties:
        note:
          type:
            - string
            - 'null'
          description: Why the version was frozen, e.g. `FY26 close` (OI-15).
    MappingFreezeResult:
      type: object
      description: The rule report of the frozen version, and the new live version.
      required:
        - report
        - live
      properties:
        report:
          $ref: '#/components/schemas/ValidationReport'
        live:
          description: 'The new live version. Over HTTP a failed rule answers 422, so a 200 always carries it; the port turns the 422 into `live: null` (01, Results and errors).'
          oneOf:
            - $ref: '#/components/schemas/MappingVersionSummary'
            - type: 'null'
    MappingSetUpdateOperation:
      type: object
      required:
        - op
        - patch
      properties:
        op:
          const: updateMappingSet
        patch:
          $ref: '#/components/schemas/MappingSetPatch'
    MappingEntrySaveOperation:
      type: object
      description: Adds the entry, or replaces the entry with the same id.
      required:
        - op
        - versionId
        - input
      properties:
        op:
          const: saveEntry
        versionId:
          $ref: '#/components/schemas/Id'
        input:
          $ref: '#/components/schemas/MappingEntryInput'
    MappingEntryDeleteOperation:
      type: object
      required:
        - op
        - versionId
        - entryId
      properties:
        op:
          const: deleteEntry
        versionId:
          $ref: '#/components/schemas/Id'
        entryId:
          $ref: '#/components/schemas/Id'
    MappingEntriesReplaceOperation:
      type: object
      description: Replaces every entry of the version (bulk paste).
      required:
        - op
        - versionId
        - entries
      properties:
        op:
          const: replaceEntries
        versionId:
          $ref: '#/components/schemas/Id'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MappingEntryInput'
    MappingOperation:
      description: One edit of a mapping set change set; `versionId` names the live version.
      oneOf:
        - $ref: '#/components/schemas/MappingSetUpdateOperation'
        - $ref: '#/components/schemas/MappingEntrySaveOperation'
        - $ref: '#/components/schemas/MappingEntryDeleteOperation'
        - $ref: '#/components/schemas/MappingEntriesReplaceOperation'
      discriminator:
        propertyName: op
        mapping:
          updateMappingSet: '#/components/schemas/MappingSetUpdateOperation'
          saveEntry: '#/components/schemas/MappingEntrySaveOperation'
          deleteEntry: '#/components/schemas/MappingEntryDeleteOperation'
          replaceEntries: '#/components/schemas/MappingEntriesReplaceOperation'
    MappingSetChangeSetRequest:
      allOf:
        - $ref: '#/components/schemas/ChangeSetRequest'
        - type: object
          required:
            - operations
          properties:
            operations:
              type: array
              items:
                $ref: '#/components/schemas/MappingOperation'
    MappingSetChangeSetPreview:
      allOf:
        - $ref: '#/components/schemas/ChangeSetPreview'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/MappingSetEditState'
    MappingSetChangeSetCommit:
      allOf:
        - $ref: '#/components/schemas/ChangeSetCommit'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/MappingSetEditState'
    BridgeOwner:
      type: object
      description: The report source a report bridge belongs to (B9, OI-31).
      required:
        - reportId
        - reportKey
        - sourceKey
      properties:
        reportId:
          $ref: '#/components/schemas/Id'
        reportKey:
          type: string
        sourceKey:
          type: string
    Bridge:
      type: object
      required:
        - id
        - key
        - displayName
        - sourceDimensionId
        - targetDimensionId
        - isEnabled
        - owner
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        sourceDimensionId:
          $ref: '#/components/schemas/Id'
        targetDimensionId:
          $ref: '#/components/schemas/Id'
        isEnabled:
          type: boolean
        owner:
          description: Set for report bridges, which are written only through their report's change set.
          oneOf:
            - $ref: '#/components/schemas/BridgeOwner'
            - type: 'null'
    BridgeVersion:
      type: object
      description: Stored `published` is the live version and `retired` a frozen snapshot (B10).
      required:
        - id
        - bridgeId
        - versionNumber
        - status
        - cardinality
        - allocationMode
        - createdAt
        - publishedAt
        - retiredAt
        - freezeNote
      properties:
        id:
          $ref: '#/components/schemas/Id'
        bridgeId:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        cardinality:
          $ref: '#/components/schemas/MappingCardinality'
        allocationMode:
          $ref: '#/components/schemas/MappingAllocationMode'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        retiredAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was frozen.
        freezeNote:
          type:
            - string
            - 'null'
    BridgeMapping:
      type: object
      required:
        - id
        - versionId
        - sourceMemberKey
        - targetMemberKey
        - factor
        - allocationWeight
        - sourceSelection
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
        sourceMemberKey:
          type: string
        targetMemberKey:
          type: string
        factor:
          type: number
          description: Affects only measures with `bridge_factor_behavior = value` (B7).
        allocationWeight:
          type: number
        sourceSelection:
          $ref: '#/components/schemas/MappingSourceSelection'
    BridgeVersionSummary:
      type: object
      required:
        - id
        - versionNumber
        - status
        - cardinality
        - allocationMode
        - createdAt
        - publishedAt
        - retiredAt
        - freezeNote
        - mappingCount
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        cardinality:
          $ref: '#/components/schemas/MappingCardinality'
        allocationMode:
          $ref: '#/components/schemas/MappingAllocationMode'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        retiredAt:
          type:
            - string
            - 'null'
          format: date-time
        freezeNote:
          type:
            - string
            - 'null'
        mappingCount:
          type: integer
    BridgeListItem:
      allOf:
        - $ref: '#/components/schemas/Bridge'
        - type: object
          required:
            - source
            - target
            - versions
            - publishedMappingCount
            - bindings
          properties:
            source:
              $ref: '#/components/schemas/MappingDimensionRef'
            target:
              $ref: '#/components/schemas/MappingDimensionRef'
            versions:
              type: array
              items:
                $ref: '#/components/schemas/BridgeVersionSummary'
            publishedMappingCount:
              type: integer
              description: Mappings of the live version.
            bindings:
              type: array
              items:
                $ref: '#/components/schemas/MappingBindingUsage'
    BridgeDetail:
      allOf:
        - $ref: '#/components/schemas/BridgeListItem'
        - type: object
          required:
            - pins
          properties:
            pins:
              type: array
              items:
                $ref: '#/components/schemas/MappingAssumptionPin'
    BridgeSourceAllocation:
      type: object
      description: One source member's targets and the sum of its allocation weights.
      required:
        - sourceMemberKey
        - targetCount
        - weightSum
      properties:
        sourceMemberKey:
          type: string
        targetCount:
          type: integer
        weightSum:
          type: number
    BridgeAllocationSummary:
      type: object
      required:
        - sources
      properties:
        sources:
          type: array
          description: Every source member the version maps, ordered by key.
          items:
            $ref: '#/components/schemas/BridgeSourceAllocation'
    BridgeVersionContent:
      type: object
      required:
        - version
        - mappings
        - allocation
        - violations
      properties:
        version:
          $ref: '#/components/schemas/BridgeVersion'
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/BridgeMapping'
        allocation:
          $ref: '#/components/schemas/BridgeAllocationSummary'
        violations:
          type: array
          description: Rule findings on this content; `target.itemId` names the mapping at fault, or `target.itemKey` the source member for per-source rules. Empty on a saved live version, because commits refuse violations (B11); a preview's state carries the findings of the pending edits.
          items:
            $ref: '#/components/schemas/Violation'
    BridgeEditState:
      type: object
      description: What the bridge editor renders; the state of a bridge change set.
      required:
        - bridge
        - content
      properties:
        bridge:
          $ref: '#/components/schemas/BridgeDetail'
        content:
          $ref: '#/components/schemas/BridgeVersionContent'
    CreateBridgeInput:
      type: object
      description: Endpoints are fixed at creation, differ, and the source is neither `time` nor a report dimension (B4).
      required:
        - key
        - displayName
        - sourceDimensionId
        - targetDimensionId
        - isEnabled
      properties:
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
          minLength: 1
        sourceDimensionId:
          $ref: '#/components/schemas/Id'
        targetDimensionId:
          $ref: '#/components/schemas/Id'
        isEnabled:
          type: boolean
    BridgeCreated:
      type: object
      required:
        - bridgeId
        - versionId
      properties:
        bridgeId:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
          description: The empty live v1, `many_to_one` / `none`.
    BridgePatch:
      type: object
      description: Key and endpoints are fixed after creation.
      properties:
        displayName:
          type: string
          minLength: 1
        isEnabled:
          type: boolean
    BridgeVersionPatch:
      type: object
      description: Edited in place on the live version (OI-26); mappings that no longer comply become violations.
      required:
        - cardinality
        - allocationMode
      properties:
        cardinality:
          $ref: '#/components/schemas/MappingCardinality'
        allocationMode:
          $ref: '#/components/schemas/MappingAllocationMode'
    BridgeMappingInput:
      type: object
      required:
        - id
        - sourceMemberKey
        - targetMemberKey
        - factor
        - allocationWeight
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: The mapping's id, or a client-generated `tmp:<uuid>` for a new mapping.
        sourceMemberKey:
          type: string
          minLength: 1
        targetMemberKey:
          type: string
          minLength: 1
        factor:
          type: number
        allocationWeight:
          type: number
        sourceSelection:
          $ref: '#/components/schemas/MappingSourceSelection'
          description: Accepted only on report bridges, written by the report editor; absent means `member` (OI-28).
    BridgeFreezeInput:
      type: object
      required:
        - note
      properties:
        note:
          type:
            - string
            - 'null'
          description: Why the version was frozen, e.g. `FY26 close` (OI-15).
    BridgeFreezeResult:
      type: object
      description: The rule report of the frozen version, and the new live version.
      required:
        - report
        - live
      properties:
        report:
          $ref: '#/components/schemas/ValidationReport'
        live:
          description: 'The new live version. Over HTTP a failed rule answers 422, so a 200 always carries it; the port turns the 422 into `live: null` (01, Results and errors).'
          oneOf:
            - $ref: '#/components/schemas/BridgeVersionSummary'
            - type: 'null'
    BridgeUpdateOperation:
      type: object
      required:
        - op
        - patch
      properties:
        op:
          const: updateBridge
        patch:
          $ref: '#/components/schemas/BridgePatch'
    BridgeVersionUpdateOperation:
      type: object
      required:
        - op
        - versionId
        - patch
      properties:
        op:
          const: updateBridgeVersion
        versionId:
          $ref: '#/components/schemas/Id'
        patch:
          $ref: '#/components/schemas/BridgeVersionPatch'
    BridgeMappingSaveOperation:
      type: object
      description: Adds the mapping, or replaces the mapping with the same id.
      required:
        - op
        - versionId
        - input
      properties:
        op:
          const: saveBridgeMapping
        versionId:
          $ref: '#/components/schemas/Id'
        input:
          $ref: '#/components/schemas/BridgeMappingInput'
    BridgeMappingDeleteOperation:
      type: object
      required:
        - op
        - versionId
        - mappingId
      properties:
        op:
          const: deleteBridgeMapping
        versionId:
          $ref: '#/components/schemas/Id'
        mappingId:
          $ref: '#/components/schemas/Id'
    BridgeMappingsReplaceOperation:
      type: object
      description: Replaces every mapping of the version (bulk paste).
      required:
        - op
        - versionId
        - rows
      properties:
        op:
          const: replaceBridgeMappings
        versionId:
          $ref: '#/components/schemas/Id'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/BridgeMappingInput'
    BridgeOperation:
      description: One edit of an analytical bridge change set; `versionId` names the live version.
      oneOf:
        - $ref: '#/components/schemas/BridgeUpdateOperation'
        - $ref: '#/components/schemas/BridgeVersionUpdateOperation'
        - $ref: '#/components/schemas/BridgeMappingSaveOperation'
        - $ref: '#/components/schemas/BridgeMappingDeleteOperation'
        - $ref: '#/components/schemas/BridgeMappingsReplaceOperation'
      discriminator:
        propertyName: op
        mapping:
          updateBridge: '#/components/schemas/BridgeUpdateOperation'
          updateBridgeVersion: '#/components/schemas/BridgeVersionUpdateOperation'
          saveBridgeMapping: '#/components/schemas/BridgeMappingSaveOperation'
          deleteBridgeMapping: '#/components/schemas/BridgeMappingDeleteOperation'
          replaceBridgeMappings: '#/components/schemas/BridgeMappingsReplaceOperation'
    BridgeChangeSetRequest:
      allOf:
        - $ref: '#/components/schemas/ChangeSetRequest'
        - type: object
          required:
            - operations
          properties:
            operations:
              type: array
              items:
                $ref: '#/components/schemas/BridgeOperation'
    BridgeChangeSetPreview:
      allOf:
        - $ref: '#/components/schemas/ChangeSetPreview'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/BridgeEditState'
    BridgeChangeSetCommit:
      allOf:
        - $ref: '#/components/schemas/ChangeSetCommit'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/BridgeEditState'
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: The tenant directory key.
      schema:
        type: string
    MappingSetId:
      name: mappingSetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MappingVersionId:
      name: mappingVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BridgeId:
      name: bridgeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BridgeVersionId:
      name: bridgeVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    BadRequest:
      description: The body, route or query does not bind, or an input validator failed; see `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: No access to the route tenant, or `SystemAdmin` missing on `/api/system/*`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: An id in the route names no row in the tenant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: A precondition failed (not a draft, not editable, owned by a report, delete blocked, release not published).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: The change would break a rule; see `violations`. Nothing was written.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

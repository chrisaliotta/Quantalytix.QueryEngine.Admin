        - interval_close
    DatasetBoundaryMatch:
      type: string
      enum:
        - exact
        - on_or_before
        - strictly_before
    DatasetDurationUnit:
      type: string
      enum:
        - calendar_day
        - elapsed_second
    DatasetPartialIntervalBehavior:
      type: string
      enum:
        - exact_only
        - uniform_estimate
    DatasetMissingPeriodBehavior:
      type: string
      enum:
        - 'null'
        - zero
    DatasetMaterializationState:
      type: string
      enum:
        - building
        - ready
        - failed
    DatasetTab:
      type: string
      description: Editor tab; the `target.area` of a dataset violation and the tab of a dependent.
      enum:
        - fields
        - grains
        - bindings
        - measures
        - settings
    DatasetSourceObject:
      type: object
      required:
        - name
        - kind
        - isManaged
        - stats
      properties:
        name:
          type: string
        kind:
          $ref: '#/components/schemas/DatasetSourceObjectKind'
        isManaged:
          type: boolean
          description: Created by the API through "New dataset" and registered (OI-33); fields may add columns to it.
        stats:
          oneOf:
            - $ref: '#/components/schemas/DatasetSourceObjectStats'
            - type: 'null'
          description: Null when the engine has not measured the object yet.
    DatasetSourceObjectStats:
      type: object
      description: Read live from `information_schema` with a short cache (OI-34).
      required:
        - rowCount
        - sizeBytes
        - measuredAt
      properties:
        rowCount:
          type: integer
          format: int64
        sizeBytes:
          type: integer
          format: int64
          description: On-disk size; a view reports its materialized storage, 0 if none.
        measuredAt:
          $ref: '#/components/schemas/Timestamp'
    DatasetSourceColumn:
      type: object
      required:
        - name
        - nativeType
        - mappedType
        - numericPrecision
        - numericScale
        - isNullable
        - isGenerated
      properties:
        name:
          type: string
        nativeType:
          type: string
        mappedType:
          oneOf:
            - $ref: '#/components/schemas/DatasetDataType'
            - type: 'null'
          description: The field type this column reads as; null when fields cannot read it.
        numericPrecision:
          type:
            - integer
            - 'null'
        numericScale:
          type:
            - integer
            - 'null'
        isNullable:
          type: boolean
        isGenerated:
          type: boolean
          description: The API added the column on a field's behalf (`createColumn`).
    Dataset:
      type: object
      description: The dataset identity (`qe_dataset`), shared by every version.
      required:
        - id
        - key
        - displayName
        - isEnabled
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DottedKey'
        displayName:
          type: string
        isEnabled:
          type: boolean
    DatasetPatch:
      type: object
      description: Identity edits; the key is fixed after creation (OI-36).
      properties:
        displayName:
          type: string
        isEnabled:
          type: boolean
    DatasetReleasePin:
      type: object
      description: A release that pins the version.
      required:
        - releaseId
        - releaseKey
        - isActive
      properties:
        releaseId:
          $ref: '#/components/schemas/Id'
        releaseKey:
          type: string
        isActive:
          type: boolean
    DatasetVersionSummary:
      type: object
      required:
        - id
        - datasetId
        - versionNumber
        - status
        - sourceObject
        - createdAt
        - publishedAt
        - clonedFromVersionId
        - releases
      properties:
        id:
          $ref: '#/components/schemas/Id'
        datasetId:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        sourceObject:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        clonedFromVersionId:
          type:
            - string
            - 'null'
          description: The version this one was cloned from (SG-04, OI-12).
        releases:
          type: array
          items:
            $ref: '#/components/schemas/DatasetReleasePin'
    DatasetListItem:
      allOf:
        - $ref: '#/components/schemas/Dataset'
        - type: object
          required:
            - versions
            - activeVersionId
            - storage
          properties:
            versions:
              type: array
              description: Newest first.
              items:
                $ref: '#/components/schemas/DatasetVersionSummary'
            activeVersionId:
              type:
                - string
                - 'null'
              description: The version the active release pins; what the engine reads.
            storage:
              oneOf:
                - $ref: '#/components/schemas/DatasetSourceObjectStats'
                - type: 'null'
              description: Statistics of the latest version's source object.
    DatasetVersionSettings:
      type: object
      required:
        - sourceObjectKind
        - sourceObject
        - supportsAggregate
        - supportsDetail
        - defaultTimeBindingId
        - expressionLanguageVersion
        - securityPolicyKey
        - properties
      properties:
        sourceObjectKind:
          $ref: '#/components/schemas/DatasetSourceObjectKind'
        sourceObject:
          type: string
        supportsAggregate:
          type: boolean
        supportsDetail:
          type: boolean
        defaultTimeBindingId:
          type:
            - string
            - 'null'
        expressionLanguageVersion:
          type: string
        securityPolicyKey:
          type:
            - string
            - 'null'
        properties:
          type: string
          description: Free JSON text; carries no query semantics.
    DatasetDependent:
      type: object
      description: Something that reads an item of the version; computed from the delete-blocker graph (OI-35).
      required:
        - tab
        - itemId
        - itemKey
        - relation
        - blocksDelete
      properties:
        tab:
          $ref: '#/components/schemas/DatasetTab'
        itemId:
          type:
            - string
            - 'null'
          description: Null for the settings tab.
        itemKey:
          type: string
        relation:
          type: string
          description: How the dependent reads the item, such as "grain component", "formula" or "default time binding".
        blocksDelete:
          type: boolean
    DatasetVersion:
      description: The whole editable content of one version; the state of its change set.
      allOf:
        - $ref: '#/components/schemas/DatasetVersionSummary'
        - type: object
          required:
            - dataset
            - settings
            - fields
            - grains
            - bindings
            - measures
            - dependents
          properties:
            dataset:
              $ref: '#/components/schemas/Dataset'
              description: The dataset identity as the change set leaves it, so a preview shows a staged `updateDataset`.
            settings:
              $ref: '#/components/schemas/DatasetVersionSettings'
            fields:
              type: array
              items:
                $ref: '#/components/schemas/DatasetField'
            grains:
              type: array
              items:
                $ref: '#/components/schemas/DatasetGrain'
            bindings:
              type: array
              items:
                $ref: '#/components/schemas/DatasetBinding'
            measures:
              type: array
              items:
                $ref: '#/components/schemas/DatasetMeasure'
            dependents:
              type: object
              description: Item id to what reads it.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetDependent'
    DatasetFieldMaterialization:
      type: object
      description: The field's column in its source object's materialized view; state, refresh time and error come from the view's refresh status (OI-32).

# Module: tenant (Tenant, session and catalog). Owner: the tenant module agent (C1, then R1).
# Blueprint: docs/blueprint/10-tenant-session-catalog.md
# Holds this module's paths and components only; every operation is tagged `tenant`. Shared types come from
# ./common.yaml. Composition and naming rules: ./README.md.
openapi: 3.1.0
info:
  title: Tenant, session and catalog
  version: 1.0.0
paths:
  /api/me:
    get:
      operationId: getSession
      summary: Read who the caller is
      tags: [tenant]
      responses:
        '200':
          description: The caller as the API sees its bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }

  /api/tenants:
    get:
      operationId: listTenants
      summary: List the tenants the caller can reach
      description: A system admin reaches every tenant in the directory; any other caller reaches its token's tenant.
      tags: [tenant]
      responses:
        '200':
          description: The accessible tenants, ordered by tenant id.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccessibleTenant' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }

  /api/vocabularies:
    get:
      operationId: getVocabularies
      summary: Read every enumeration the UI renders
      tags: [tenant]
      responses:
        '200':
          description: Every vocabulary, keyed by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vocabularies' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }

  /api/tenants/{tenantId}/overview:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
    get:
      operationId: getOverview
      summary: Read the tenant's state, counts and work in progress
      tags: [tenant]
      responses:
        '200':
          description: The tenant overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantOverview' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

  /api/tenants/{tenantId}/catalog:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
    get:
      operationId: getCatalog
      summary: Read the names and ids every picker and cross-module link resolves against
      description: >-
        One catalog for every module, cached by the client on `tenant.semanticRevision` (OI-13). Report-owned
        dimensions and bridges are included only so references resolve; pickers and lists never offer them (OI-22).
      tags: [tenant]
      responses:
        '200':
          description: The tenant catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantCatalog' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

  /api/tenants/{tenantId}/dimensions/{dimensionId}/published-members:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
      - name: dimensionId
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Id' }
    get:
      operationId: getPublishedMembers
      summary: Read the members of a dimension's published version
      tags: [tenant]
      responses:
        '200':
          description: The published version's members, in hierarchy order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedMembers' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound', description: The dimension does not exist or has no published version. }

  /api/system/tenants:
    get:
      operationId: listSystemTenants
      summary: List every tenant in the directory
      tags: [tenant]
      responses:
        '200':
          description: The directory entries, ordered by tenant id, with masked connection strings.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TenantDirectoryEntry' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      operationId: createSystemTenant
      summary: Register a tenant after verifying its connection string
      tags: [tenant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCreateInput' }
      responses:
        '201':
          description: The tenant was registered; the body is its entry with a masked connection string.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDirectoryEntry' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest', description: A field breaks a rule; a `connectionString` error gives the reason verification failed. }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

  /api/system/tenants/verify:
    post:
      operationId: verifySystemTenantConnection
      summary: Test a connection string for a tenant without storing it
      description: >-
        The connection must open, and its `qe_database_info` must name the tenant and have the metadata schema version
        this API supports.
      tags: [tenant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantVerifyInput' }
      responses:
        '200':
          description: The test ran; `isValid` and `message` give its outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantConnectionCheck' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

  /api/system/tenants/{tenantId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
    get:
      operationId: getSystemTenant
      summary: Read one tenant's directory entry
      tags: [tenant]
      responses:
        '200':
          description: The directory entry with a masked connection string.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDirectoryEntry' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound', description: The directory has no such tenant. }
    put:
      operationId: updateSystemTenant
      summary: Change a tenant's provider, cache lifetime and connection string
      tags: [tenant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantUpdateInput' }
      responses:
        '200':
          description: The updated entry with a masked connection string.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDirectoryEntry' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest', description: A field breaks a rule; a `connectionString` error gives the reason verification failed. }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound', description: The directory has no such tenant. }

  /api/system/tenants/{tenantId}/enabled:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
    put:
      operationId: setSystemTenantEnabled
      summary: Permit or stop query routing for a tenant
      tags: [tenant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantEnabledInput' }
      responses:
        '200':
          description: The updated entry with a masked connection string.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDirectoryEntry' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound', description: The directory has no such tenant. }

components:
  schemas:
    # ───────────── Session ─────────────

    Session:
      type: object
      description: Who the caller is, as the API sees its bearer token. There are no tenant roles (OI-09).
      required: [subject, displayName, tenantId, isSystemAdmin]
      properties:
        subject:
          type: string
          description: The token's `sub`.
        displayName:
          type: [string, 'null']
          description: The token's name claim; null when it carries none.
        tenantId:
          type: [string, 'null']
          description: The caller's tenant when the token carries exactly one tenant claim; otherwise null.
        isSystemAdmin:
          type: boolean
          description: Whether the caller may reach every tenant and the tenant directory.

    AccessibleTenant:
      type: object
      required: [tenantId, isEnabled]
      properties:
        tenantId:
          type: string
          description: The tenant directory key.
        isEnabled:
          type: boolean
          description: Whether query routing is permitted for the tenant.

    # ───────────── Tenant state ─────────────

    TenantInfo:
      type: object
      description: The tenant database's identity and the revision the engine keys its metadata cache by.
      required: [tenantKey, metadataSchemaVersion, semanticRevision, activeReleaseId]
      properties:
        tenantKey:
          type: string
          description: '`qe_database_info.tenant_key`.'
        metadataSchemaVersion:
          type: integer
        semanticRevision:
          type: integer
          format: int64
          description: Advances once per commit or command that changes what the engine reads.
        activeReleaseId:
          type: [string, 'null']
          description: The release runtime queries use; null when the tenant has none.

    TenantOverview:
      description: The tenant at a glance for the overview screen.
      allOf:
        - $ref: '#/components/schemas/TenantInfo'
        - type: object
          required: [counts, drafts]
          properties:
            counts: { $ref: '#/components/schemas/TenantOverviewCounts' }
            drafts: { $ref: '#/components/schemas/TenantOverviewDrafts' }

    TenantOverviewCounts:
      type: object
      description: How much metadata the tenant holds.
      required: [datasets, dimensions, mappingSets, bridges, releases, assumptionSets, models, reports, activeMeasures]
      properties:
        datasets: { type: integer }
        dimensions:
          type: integer
          description: Analytical dimensions; report-owned dimensions are not counted (OI-22).
        mappingSets: { type: integer }
        bridges:
          type: integer
          description: Analytical bridges; report-owned bridges are not counted (OI-22).
        releases: { type: integer }
        assumptionSets: { type: integer }
        models: { type: integer }
        reports: { type: integer }
        activeMeasures:
          type: integer
          description: Measures of the dataset versions the active release pins.

    TenantOverviewDrafts:
      type: object
      description: >-
        Work in progress: the kinds that still have a draft status. Dimensions, mapping sets and bridges follow the
        living lifecycle and have no drafts (OI-14).
      required: [datasetVersions, releases]
      properties:
        datasetVersions: { type: integer }
        releases: { type: integer }

    # ───────────── Catalog ─────────────

    TenantCatalog:
      type: object
      description: The union of what every module's pickers and cross-module links read (OI-13).
      required: [tenant, datasets, dimensions, roles, mappingSets, bridges, models, reports, releases, assumptionSets]
      properties:
        tenant: { $ref: '#/components/schemas/TenantInfo' }
        datasets:
          type: array
          items: { $ref: '#/components/schemas/TenantCatalogDataset' }
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/TenantCatalogDimension' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/TenantCatalogRole' }
        mappingSets:
          type: array
          items: { $ref: '#/components/schemas/TenantCatalogMappingSet' }
        bridges:
          type: array
          items: { $ref: '#/components/schemas/TenantCatalogBridge' }
        models:
          type: array
          items: { $ref: '#/components/schemas/TenantCatalogModel' }
        reports:
          type: array
          items: { $ref: '#/components/schemas/TenantCatalogReport' }
        releases:
          type: array
          items: { $ref: '#/components/schemas/TenantCatalogRelease' }
        assumptionSets:
          type: array
          items: { $ref: '#/components/schemas/TenantCatalogAssumptionSet' }

    TenantCatalogDataset:
      type: object
      required: [id, key, displayName, isEnabled, activeVersionId]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        key: { $ref: './common.yaml#/components/schemas/Key' }
        displayName: { type: string }
        isEnabled: { type: boolean }
        activeVersionId:
          type: [string, 'null']
          description: The dataset version the active release pins; null when it pins none.

    TenantCatalogDimension:
      type: object
      required: [id, key, displayName, kind, purpose, origin, isEnabled, publishedVersionId, publishedVersionNumber, ownerReportId]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        key: { $ref: './common.yaml#/components/schemas/Key' }
        displayName: { type: string }
        kind: { $ref: './common.yaml#/components/schemas/DimensionKind' }
        purpose: { $ref: './common.yaml#/components/schemas/DimensionPurpose' }
        origin: { $ref: './common.yaml#/components/schemas/DefinitionOrigin' }
        isEnabled: { type: boolean }
        publishedVersionId:
          type: [string, 'null']
          description: The live version; null when none is published.
        publishedVersionNumber:
          type: [integer, 'null']
        ownerReportId:
          type: [string, 'null']
          description: The report that owns a `report` purpose dimension; null otherwise.

    TenantCatalogRole:
      type: object
      required: [id, key, displayName, dimensionId]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        key: { $ref: './common.yaml#/components/schemas/Key' }
        displayName: { type: string }
        dimensionId: { $ref: './common.yaml#/components/schemas/Id' }

    TenantCatalogMappingSet:
      type: object
      required: [id, key, displayName, dimensionId]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        key: { $ref: './common.yaml#/components/schemas/DottedKey' }
        displayName: { type: string }
        dimensionId: { $ref: './common.yaml#/components/schemas/Id' }

    TenantCatalogBridge:
      type: object
      required: [id, key, displayName, sourceDimensionId, targetDimensionId, ownerReportId]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        key: { $ref: './common.yaml#/components/schemas/DottedKey' }
        displayName: { type: string }
        sourceDimensionId: { $ref: './common.yaml#/components/schemas/Id' }
        targetDimensionId: { $ref: './common.yaml#/components/schemas/Id' }
        ownerReportId:
          type: [string, 'null']
          description: The report that owns a report bridge; null for an analytical bridge.

    TenantCatalogModel:
      type: object
      required: [id, key, displayName, isEnabled]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        key: { $ref: './common.yaml#/components/schemas/Key' }
        displayName: { type: string }
        isEnabled: { type: boolean }

    TenantCatalogReport:
      type: object
      required: [id, key, displayName, isEnabled, modelId, reportDimensionId]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        key: { $ref: './common.yaml#/components/schemas/Key' }
        displayName: { type: string }
        isEnabled: { type: boolean }
        modelId: { $ref: './common.yaml#/components/schemas/Id' }
        reportDimensionId: { $ref: './common.yaml#/components/schemas/Id' }

    TenantCatalogRelease:
      type: object
      description: A release has a key and no display name (OI-39).
      required: [id, key, status, isActive]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        key: { type: string }
        status: { $ref: './common.yaml#/components/schemas/VersionStatus' }
        isActive: { type: boolean }

    TenantCatalogAssumptionSet:
      type: object
      required: [id, key, displayName, status]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        key: { type: string }
        displayName: { type: string }
        status: { $ref: './common.yaml#/components/schemas/AssumptionSetStatus' }

    PublishedMembers:
      type: object
      description: The members of a dimension's published version, fetched per picker.
      required: [dimensionId, versionId, members]
      properties:
        dimensionId: { $ref: './common.yaml#/components/schemas/Id' }
        versionId: { $ref: './common.yaml#/components/schemas/Id' }
        members:
          type: array
          items: { $ref: '#/components/schemas/PublishedMember' }

    PublishedMember:
      type: object
      required: [key, displayName, parentKey, isAssignable, levelKey]
      properties:
        key: { type: string }
        displayName: { type: string }
        parentKey: { type: [string, 'null'] }
        isAssignable: { type: boolean }
        levelKey: { type: [string, 'null'] }

    # ───────────── Vocabularies ─────────────

    Vocabularies:
      type: object
      description: >-
        Every enumeration a select renders, keyed by name (OI-11). Values are the schema's; open vocabularies
        (`expressionLanguageVersion`, `displayFormat`, `timeZone`) list the offered values of a free-text column.
      required:
        - versionStatus
        - assumptionSetStatus
        - dataType
        - measureOutputDataType
        - sourceObjectKind
        - fieldSourceKind
        - grainKind
        - dimensionKind
        - dimensionPurpose
        - definitionOrigin
        - rangeDataType
        - editPolicy
        - bindingKind
        - groupingMode
        - raggedBehavior
        - periodAlignment
        - unmappedBehavior
        - timeValueType
        - observationKind
        - periodicity
        - cumulativeOrigin
        - measureKind
        - aggregationFunction
        - componentRole
        - componentRolesByKind
        - valueNullBehavior
        - negativeWeightBehavior
        - emptySetBehavior
        - bridgeFactorBehavior
        - bridgeAllocationBehavior
        - totalBehavior
        - roundingMode
        - observationSelection
        - valueTimeRole
        - boundaryMatch
        - durationUnit
        - partialIntervalBehavior
        - missingPeriodBehavior
        - expressionLanguageVersion
        - timeZone
        - cardinality
        - allocationMode
        - sourceSelection
        - formulaLanguageVersion
        - attributionMethod
        - parameterValueType
        - variableMissingBehavior
        - dayCountConvention
        - displayFormat
        - mappingMethod
        - selectionScope
        - columnValueKind
        - subtotalPosition
        - styleRole
        - fontWeight
        - borderStyle
        - layout
        - provider
      properties:
        versionStatus:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './common.yaml#/components/schemas/VersionStatus' } } }
        assumptionSetStatus:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './common.yaml#/components/schemas/AssumptionSetStatus' } } }
        dataType:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './datasets.yaml#/components/schemas/DatasetDataType' } } }
        measureOutputDataType:
          type: array
          description: Every `dataType` except `json`.
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { type: string, enum: [boolean, int32, int64, decimal, string, date, datetime, timestamp] } } }
        sourceObjectKind:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './datasets.yaml#/components/schemas/DatasetSourceObjectKind' } } }
        fieldSourceKind:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './datasets.yaml#/components/schemas/DatasetFieldSourceKind' } } }
        grainKind:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './datasets.yaml#/components/schemas/DatasetGrainKind' } } }
        dimensionKind:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './common.yaml#/components/schemas/DimensionKind' } } }
        dimensionPurpose:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './common.yaml#/components/schemas/DimensionPurpose' } } }
        definitionOrigin:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './common.yaml#/components/schemas/DefinitionOrigin' } } }
        rangeDataType:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './dimensions.yaml#/components/schemas/RangeDataType' } } }
        editPolicy:
          type: array
          description: How far a dimension profile lets users edit a profiled dimension.
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './dimensions.yaml#/components/schemas/DimensionEditPolicy' } } }
        bindingKind:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './common.yaml#/components/schemas/BindingKind' } } }
        groupingMode:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { type: string, enum: [member, level, ancestor, depth] } } }
        raggedBehavior:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { type: string, enum: ['null', self, exclude] } } }
        periodAlignment:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './datasets.yaml#/components/schemas/DatasetPeriodAlignment' } } }
        unmappedBehavior:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { type: string, enum: ['null', exclude, unknown] } } }
        timeValueType:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './datasets.yaml#/components/schemas/DatasetTimeValueType' } } }
        observationKind:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './datasets.yaml#/components/schemas/DatasetObservationKind' } } }
        periodicity:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './common.yaml#/components/schemas/Periodicity' } } }
        cumulativeOrigin:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './datasets.yaml#/components/schemas/DatasetCumulativeOrigin' } } }
        measureKind:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './common.yaml#/components/schemas/MeasureKind' } } }
        aggregationFunction:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './datasets.yaml#/components/schemas/DatasetAggregationFunction' } } }
        componentRole:
          type: array
          items:
            allOf:
              - $ref: './common.yaml#/components/schemas/VocabularyTerm'
              - { required: [value], properties: { value: { $ref: './common.yaml#/components/schemas/ComponentRole' } } }
        componentRolesByKind:
          type: object

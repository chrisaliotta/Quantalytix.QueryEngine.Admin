# Module: snapshots (Snapshots). Owner: the snapshots module agent.
# Blueprint: docs/blueprint/14-snapshots.md
# Holds this module's paths and components only; every operation is tagged `snapshots`. Shared types come from
# ./common.yaml. Composition and naming rules: ./README.md.
# A snapshot holds one version of every identity of six kinds. The live snapshot is edited in place; capture copies every
# live version into a new frozen snapshot, and restore copies a frozen snapshot's versions back over live. Each kind's
# version read (`dataset-versions`, `dimension-versions`, `mapping-versions`, `bridge-versions`,
# `calculation-model-versions`, `report-versions`) shows the version a `SnapshotEntry` names.
openapi: 3.1.0
info:
  title: Snapshots
  version: 1.0.0
paths:
  /api/tenants/{tenantId}/snapshots:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
    get:
      operationId: listSnapshots
      summary: List the live snapshot and the frozen ones with their version counts
      tags: [snapshots]
      responses:
        '200':
          description: The live snapshot and every frozen one, newest capture first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotList' }
    post:
      operationId: captureSnapshot
      summary: Capture every live version into a new frozen snapshot
      description: >-
        Copies every live version of the six kinds, report dimensions and report bridges included, then stores the
        snapshot. The semantic revision is read before and after the copies; when a commit landed in between, the copies
        are deleted and the capture is refused with 409. Advances `semanticRevision`.
      tags: [snapshots]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureSnapshotInput' }
      responses:
        '201':
          description: The new frozen snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '409': { $ref: './common.yaml#/components/responses/Conflict', description: 'The key is taken, or live changed during the capture.' }

  /api/tenants/{tenantId}/snapshots/capture-preview:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
    get:
      operationId: previewSnapshotCapture
      summary: Count the live versions a capture would copy
      tags: [snapshots]
      responses:
        '200':
          description: The live versions of each kind.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotCounts' }

  /api/tenants/{tenantId}/snapshots/compare:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
    get:
      operationId: compareSnapshots
      summary: Compare the identities and versions two snapshots hold
      tags: [snapshots]
      parameters:
        - $ref: '#/components/parameters/SnapshotCompareFrom'
        - $ref: '#/components/parameters/SnapshotCompareTo'
      responses:
        '200':
          description: What `to` holds that `from` does not, the reverse, and what both hold.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotComparison' }
        '404': { $ref: './common.yaml#/components/responses/NotFound', description: '`from` or `to` names no snapshot.' }

  /api/tenants/{tenantId}/snapshots/{snapshotId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SnapshotIdPath'
    get:
      operationId: getSnapshot
      summary: Get a snapshot with the version it holds of each identity and its restores
      tags: [snapshots]
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotDetail' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    put:
      operationId: relabelSnapshot
      summary: Change a frozen snapshot's display name and description
      description: The key and the versions never change. Does not advance `semanticRevision`.
      tags: [snapshots]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelabelSnapshotInput' }
      responses:
        '200':
          description: The relabelled snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict', description: The live snapshot. }
    delete:
      operationId: deleteSnapshot
      summary: Delete a frozen snapshot with every version it holds
      description: >-
        Deletes the snapshot, its restore log and every version it holds with their content, and each identity no other
        snapshot holds. Advances `semanticRevision`.
      tags: [snapshots]
      responses:
        '204': { description: Deleted. }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict', description: The live snapshot. }

  /api/tenants/{tenantId}/snapshots/{snapshotId}/restore:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SnapshotIdPath'
    post:
      operationId: restoreSnapshot
      summary: Make live equal a frozen snapshot
      description: >-
        Every version the snapshot holds must first pass its kind's rules against the database as it is now; any
        violation refuses with 422 and nothing changes. Then each frozen version replaces its identity's live content,
        or joins live when live lacks the identity; the live version of an identity the snapshot lacks is deleted, with
        the identity when no frozen snapshot holds it. The restore is logged. Advances `semanticRevision`.
      tags: [snapshots]
      responses:
        '200':
          description: The tenant state the restore produced.
          content:
            application/json:
              schema: { $ref: './tenant.yaml#/components/schemas/TenantInfo' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict', description: The live snapshot. }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableContent', description: A version breaks a rule; nothing was restored. }

components:
  parameters:
    SnapshotIdPath:
      name: snapshotId
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Id' }
    SnapshotCompareFrom:
      name: from
      in: query
      required: true
      description: The snapshot compared from.
      schema: { $ref: './common.yaml#/components/schemas/Id' }
    SnapshotCompareTo:
      name: to
      in: query
      required: true
      description: The snapshot compared to.
      schema: { $ref: './common.yaml#/components/schemas/Id' }

  schemas:
    SnapshotKey:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_]{0,127}$'
      description: Natural key of a snapshot, fixed after capture; requests name the snapshot by it. The live snapshot is `live`.
      examples: [fy2026_q3_close]

    SnapshotKind:
      type: string
      description: The identities a snapshot holds one version of, in capture order.
      enum: [dataset, dimension, mapping_set, bridge, calculation_model, report]

    Snapshot:
      type: object
      description: One row of `qe_snapshot`.
      required: [id, key, displayName, description, isLive, capturedAt, capturedBy, createdAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        key: { $ref: '#/components/schemas/SnapshotKey' }
        displayName: { type: string }
        description: { type: [string, 'null'] }
        isLive:
          type: boolean
          description: The live snapshot is edited in place; it is never relabelled, deleted or restored.
        capturedAt:
          type: [string, 'null']
          format: date-time
          description: When a frozen snapshot was captured; null for the live snapshot.
        capturedBy:
          type: [string, 'null']
          description: The token subject of whoever captured a frozen snapshot; null for the live snapshot.
        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }

    SnapshotCounts:
      type: object
      description: How many versions a snapshot holds, or a capture would copy, of each kind.
      required: [datasets, dimensions, mappingSets, bridges, calculationModels, reports]
      properties:
        datasets: { type: integer, minimum: 0 }
        dimensions:
          type: integer
          minimum: 0
          description: Report dimensions included.
        mappingSets: { type: integer, minimum: 0 }
        bridges:
          type: integer
          minimum: 0
          description: Report bridges included.
        calculationModels: { type: integer, minimum: 0 }
        reports: { type: integer, minimum: 0 }

    SnapshotRestore:
      type: object
      description: One row of the restore log, `qe_snapshot_restore`.
      required: [snapshotId, restoredAt, restoredBy]
      properties:
        snapshotId: { $ref: './common.yaml#/components/schemas/Id' }
        restoredAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        restoredBy:
          type: string
          description: The token subject of the caller.

    SnapshotListItem:
      allOf:
        - $ref: '#/components/schemas/Snapshot'
        - type: object
          required: [counts, lastRestore]
          properties:
            counts: { $ref: '#/components/schemas/SnapshotCounts' }
            lastRestore:
              description: The snapshot's latest restore into live; null when never restored, and always for the live snapshot.
              oneOf:
                - $ref: '#/components/schemas/SnapshotRestore'
                - type: 'null'

    SnapshotList:
      type: object
      required: [live, frozen]
      properties:
        live: { $ref: '#/components/schemas/SnapshotListItem' }
        frozen:
          type: array
          description: Newest capture first.
          items: { $ref: '#/components/schemas/SnapshotListItem' }

    SnapshotEntry:
      type: object
      description: The version a snapshot holds of one identity; the kind's version read shows it.
      required: [kind, identityId, key, displayName, versionId]
      properties:
        kind: { $ref: '#/components/schemas/SnapshotKind' }
        identityId: { $ref: './common.yaml#/components/schemas/Id' }
        key: { type: string }
        displayName:
          type: string
          description: The identity's name; a model's or report's as its version names it.
        versionId: { $ref: './common.yaml#/components/schemas/Id' }

    SnapshotDetail:
      type: object
      required: [snapshot, entries, restores]
      properties:
        snapshot: { $ref: '#/components/schemas/Snapshot' }
        entries:
          type: array
          description: Kind by kind in capture order, each by key.
          items: { $ref: '#/components/schemas/SnapshotEntry' }
        restores:
          type: array
          description: Restores of the snapshot into live, newest first; none for the live snapshot.
          items: { $ref: '#/components/schemas/SnapshotRestore' }

    SnapshotPair:
      type: object
      description: An identity both compared snapshots hold, with each one's version.
      required: [kind, identityId, key, fromVersionId, toVersionId]
      properties:
        kind: { $ref: '#/components/schemas/SnapshotKind' }
        identityId: { $ref: './common.yaml#/components/schemas/Id' }
        key: { type: string }
        fromVersionId: { $ref: './common.yaml#/components/schemas/Id' }
        toVersionId: { $ref: './common.yaml#/components/schemas/Id' }

    SnapshotComparison:
      type: object
      description: What `toSnapshotId` holds that `fromSnapshotId` does not, the reverse, and what both hold.
      required: [fromSnapshotId, toSnapshotId, added, removed, common]
      properties:
        fromSnapshotId: { $ref: './common.yaml#/components/schemas/Id' }
        toSnapshotId: { $ref: './common.yaml#/components/schemas/Id' }
        added:
          type: array
          description: Identities only `to` holds, with `to`'s version.
          items: { $ref: '#/components/schemas/SnapshotEntry' }
        removed:
          type: array
          description: Identities only `from` holds, with `from`'s version.
          items: { $ref: '#/components/schemas/SnapshotEntry' }
        common:
          type: array
          description: Identities both hold, with both versions.
          items: { $ref: '#/components/schemas/SnapshotPair' }

    CaptureSnapshotInput:
      type: object
      required: [key, displayName, description]
      properties:
        key: { $ref: '#/components/schemas/SnapshotKey' }
        displayName: { type: string, minLength: 1 }
        description: { type: [string, 'null'], maxLength: 1024 }

    RelabelSnapshotInput:
      type: object
      required: [displayName, description]
      properties:
        displayName: { type: string, minLength: 1 }
        description: { type: [string, 'null'], maxLength: 1024 }

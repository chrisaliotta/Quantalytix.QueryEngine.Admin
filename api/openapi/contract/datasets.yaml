# Module: datasets (Datasets). Owner: the datasets module agent (C2, then R2).
# Blueprint: docs/blueprint/11-datasets.md
# Holds this module's paths and components only; every operation is tagged `datasets`. Shared types come from
# ./common.yaml. Composition and naming rules: ./README.md.
openapi: 3.1.0
info:
  title: Datasets
  version: 1.0.0

paths:
  /api/tenants/{tenantId}/source-objects:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
    get:
      operationId: listSourceObjects
      summary: List the tables and views of the tenant database
      tags: [datasets]
      responses:
        '200':
          description: Every table and view, with live storage statistics (OI-34).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetSourceObject'

  /api/tenants/{tenantId}/source-objects/{kind}/{name}/columns:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetSourceObjectKindPath'
      - $ref: '#/components/parameters/DatasetSourceObjectNamePath'
    get:
      operationId: getSourceColumns
      summary: List the columns of a table or view
      tags: [datasets]
      responses:
        '200':
          description: The object's columns in ordinal order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetSourceColumn'
        '404': { $ref: './common.yaml#/components/responses/NotFound', description: No table or view of that kind and name. }

  /api/tenants/{tenantId}/datasets:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
    get:
      operationId: listDatasets
      summary: List datasets with their version summaries
      tags: [datasets]
      responses:
        '200':
          description: Every dataset of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetListItem'
    post:
      operationId: createDataset
      summary: Create a dataset and its live version
      description: >-
        Mode `existing` registers a table or view that already exists. Mode `new` creates a managed table (OI-33) with
        the given columns, then a live version whose fields read them. Advances `semanticRevision`.
      tags: [datasets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreateInput'
      responses:
        '201':
          description: The dataset, with its live version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListItem'
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '409': { $ref: './common.yaml#/components/responses/Conflict', description: The dataset key or table name is taken. }

  /api/tenants/{tenantId}/datasets/{datasetId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetIdPath'
    get:
      operationId: getDataset
      summary: Get one dataset with its version summaries
      tags: [datasets]
      responses:
        '200':
          description: The dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListItem'
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    delete:
      operationId: deleteDataset
      summary: Delete a dataset and its live version
      description: Allowed only when no frozen snapshot holds a version of the dataset (D10). Advances `semanticRevision`.
      tags: [datasets]
      responses:
        '204':
          description: Deleted.
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict', description: Delete blocked; `violations` are the reasons of the delete check. }

  /api/tenants/{tenantId}/datasets/{datasetId}/delete-check:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetIdPath'
    get:
      operationId: checkDeleteDataset
      summary: Tell whether a dataset can be deleted, and why not
      description: >-
        Never writes. Reasons carry the code `referenced_by_snapshot` (a frozen snapshot holds a version of the dataset).
      tags: [datasets]
      responses:
        '200':
          description: The delete check.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/DeleteCheck'
        '404': { $ref: './common.yaml#/components/responses/NotFound' }

  /api/tenants/{tenantId}/dataset-versions/{versionId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    get:
      operationId: getDatasetVersion
      summary: Get the whole content of one dataset version, live or frozen
      tags: [datasets]
      responses:
        '200':
          description: Settings, fields, grains, bindings, measures and dependents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersion'
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /api/tenants/{tenantId}/dataset-versions/{versionId}/changes/preview:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: previewDatasetChanges
      summary: Apply staged operations to the live dataset version in memory and return the result
      description: >-
        Never writes. `errors` keys of a refused operation are prefixed `operations[n].` (OI-01). `violations` are the
        commit rules' findings. Rule codes: `source_object_exists`, `version_supports_a_mode`,
        `default_time_binding_in_version`, `field_key_unique`, `field_columns_exist`, `expression_field_references`,
        `expression_field_acyclic`, `grain_key_unique`, `grain_fields_in_version`, `series_grain_excludes_time_field`,
        `binding_fields_in_version`, `binding_source_field_groupable`, `bound_roles_distinct`,
        `mapped_binding_mapping_set_dimension`, `range_binding_dimension_kind`, `time_binding_dimension_kind`,
        `bridge_binding_route`, `bound_dimensions_resolvable`, `mapped_bindings_resolvable`, `bridge_bindings_resolvable`,
        `unknown_members_in_version`, `interval_estimates_for_finer_periods`, `measure_key_unique`,
        `component_fields_in_version`, `component_roles_match_kind`, `formula_references_known_measures`,
        `formula_acyclic`, `time_policy_series_grain`, `time_policy_time_binding_in_version`, `expressions_fit_language`, and the report rules
        `report_sources_resolve` and `report_factors_apply` of the enabled reports over the dataset. Each violation's
        `target.area` is a `DatasetTab`.
      tags: [datasets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetChangeSetRequest'
      responses:
        '200':
          description: The operations apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetChangeSetPreview'
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict', description: 'The version is frozen, the table is not a managed one, or an item delete is blocked by its dependents.' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableContent' }

  /api/tenants/{tenantId}/dataset-versions/{versionId}/changes:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
    post:
      operationId: commitDatasetChanges
      summary: Apply and write staged operations to the live dataset version
      description: >-
        Replays the operations onto the stored version (last write wins, OI-02) and writes them; a commit-rule finding
        refuses with 422. Any failure writes nothing except DDL already run for `createColumn`, which leaves an unread
        column. Advances `semanticRevision`.
      tags: [datasets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetChangeSetRequest'
      responses:
        '200':
          description: Every operation applied and was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetChangeSetCommit'
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict', description: 'The version is frozen, the table is not a managed one, or an item delete is blocked by its dependents.' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableContent' }

  /api/tenants/{tenantId}/dataset-versions/{versionId}/fields/{fieldId}/materialization:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
      - $ref: '#/components/parameters/DatasetFieldIdPath'
    post:
      operationId: materializeDatasetField
      summary: Add a JSON path field to its source object's materialized view
      description: >-
        Returns at once with `materialization.state` = `building`; poll the version for `ready` or `failed` (OI-32).
        Allowed on the live version only.
      tags: [datasets]
      responses:
        '200':
          description: The field with its materialization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetField'
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict', description: The version is frozen or the field is not a JSON path field. }
    delete:
      operationId: dematerializeDatasetField
      summary: Remove a field's column from the materialized view
      description: The field reads the JSON path again; the view is dropped when no column is left.
      tags: [datasets]
      responses:
        '200':
          description: The field, with `materialization` null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetField'
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict', description: The version is frozen or the field is not a JSON path field. }

  /api/tenants/{tenantId}/dataset-versions/{versionId}/fields/{fieldId}/materialization/refresh:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DatasetVersionIdPath'
      - $ref: '#/components/parameters/DatasetFieldIdPath'
    post:
      operationId: refreshDatasetFieldMaterialization
      summary: Trigger a refresh of a materialized field
      tags: [datasets]
      responses:
        '200':
          description: The field, with `materialization.state` = `building`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetField'
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict', description: The version is frozen or the field is not materialized. }

components:
  parameters:
    DatasetIdPath:
      name: datasetId
      in: path
      required: true
      schema:
        $ref: './common.yaml#/components/schemas/Id'
    DatasetVersionIdPath:
      name: versionId
      in: path
      required: true
      description: A dataset version id.
      schema:
        $ref: './common.yaml#/components/schemas/Id'
    DatasetFieldIdPath:
      name: fieldId
      in: path
      required: true
      description: A field of the version.
      schema:
        $ref: './common.yaml#/components/schemas/Id'
    DatasetSourceObjectKindPath:
      name: kind
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DatasetSourceObjectKind'
    DatasetSourceObjectNamePath:
      name: name
      in: path
      required: true
      description: The table or view name.
      schema:
        type: string

  schemas:
    # ───────────── Enumerations (labels come from GET /api/vocabularies) ─────────────

    DatasetSourceObjectKind:
      type: string
      enum: [table, view]
    DatasetFieldSourceKind:
      type: string
      enum: [column, json_path, expression]
    DatasetDataType:
      type: string
      enum: [boolean, int32, int64, decimal, float, double, string, date, datetime, timestamp, json]
    DatasetMeasureOutputDataType:
      type: string
      description: Every `DatasetDataType` except `float` and `json`.
      enum: [boolean, int32, int64, decimal, double, string, date, datetime, timestamp]
    DatasetGrainKind:
      type: string
      enum: [row, series]
    DatasetRaggedBehavior:
      type: string
      description: What a row whose member lacks the requested ancestor reads; `null` reads a null member.
      enum: ['null', self, exclude]
    DatasetPeriodAlignment:
      type: string
      enum: [observation, start, end]
    DatasetUnmappedBehavior:
      type: string
      description: What a value with no member reads; `null` reads a null member.
      enum: ['null', exclude, unknown]
    DatasetTimeValueType:
      type: string
      enum: [date, timestamp]
    DatasetObservationKind:
      type: string
      enum: [instant, snapshot, interval]
    DatasetCumulativeOrigin:
      type: string
      enum: [output_range_start, fixed_start]
    DatasetAggregationFunction:
      type: string
      enum: [sum, avg, min, max, count, count_distinct]
    DatasetCompoundingForm:
      type: string
      enum: [decay, growth]
    DatasetValueNullBehavior:
      type: string
      enum: [exclude, zero]
    DatasetNegativeWeightBehavior:
      type: string
      enum: [allow, exclude]
    DatasetEmptySetBehavior:
      type: string
      enum: ['null', zero]
    DatasetBridgeFactorBehavior:
      type: string
      enum: [ignore, value]
    DatasetBridgeAllocationBehavior:
      type: string
      enum: [apply, ignore]
    DatasetTotalBehavior:
      type: string
      enum: [recompute, sum_children]
    DatasetObservationSelection:
      type: string
      enum: [all, first_in_period, last_in_period, at_start, at_end]
    DatasetValueTimeRole:
      type: string
      enum: [point, interval_open, interval_close]
    DatasetBoundaryMatch:
      type: string
      enum: [exact, on_or_before, strictly_before]
    DatasetDurationUnit:
      type: string
      enum: [calendar_day, elapsed_second]
    DatasetPartialIntervalBehavior:
      type: string
      enum: [exact_only, uniform_estimate]
    DatasetMissingPeriodBehavior:
      type: string
      enum: ['null', zero]
    DatasetMaterializationState:
      type: string
      enum: [building, ready, failed]
    DatasetTab:
      type: string
      description: Editor tab; the `target.area` of a dataset violation and the tab of a dependent.
      enum: [fields, grains, bindings, measures, settings]

    # ───────────── Source introspection ─────────────

    DatasetSourceObject:
      type: object
      required: [name, kind, isManaged, stats]
      properties:
        name:
          type: string
        kind:
          $ref: '#/components/schemas/DatasetSourceObjectKind'
        isManaged:
          type: boolean
          description: Created by the API through "New dataset" and registered (OI-33); fields may add columns to it.
        stats:
          oneOf:
            - $ref: '#/components/schemas/DatasetSourceObjectStats'
            - type: 'null'
          description: Null when the engine has not measured the object yet.

    DatasetSourceObjectStats:
      type: object
      description: Read live from `information_schema` with a short cache (OI-34).
      required: [rowCount, sizeBytes, measuredAt]
      properties:
        rowCount:
          type: integer
          format: int64
        sizeBytes:
          type: integer
          format: int64
          description: On-disk size; a view reports its materialized storage, 0 if none.
        measuredAt:
          $ref: './common.yaml#/components/schemas/Timestamp'

    DatasetSourceColumn:
      type: object
      required: [name, nativeType, mappedType, numericPrecision, numericScale, isNullable, isGenerated]
      properties:
        name:
          type: string
        nativeType:
          type: string
        mappedType:
          oneOf:
            - $ref: '#/components/schemas/DatasetDataType'
            - type: 'null'
          description: The field type this column reads as; null when fields cannot read it.
        numericPrecision:
          type: [integer, 'null']
        numericScale:
          type: [integer, 'null']
        isNullable:
          type: boolean
        isGenerated:
          type: boolean
          description: The API added the column on a field's behalf (`createColumn`).

    # ───────────── Dataset and versions ─────────────

    Dataset:
      type: object
      description: The dataset identity (`qe_dataset`), shared by every version, with one version's enabled flag.
      required: [id, key, displayName, isEnabled]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        key:
          $ref: './common.yaml#/components/schemas/DottedKey'
        displayName:
          type: string
        isEnabled:
          type: boolean
          description: The live version's flag, or a frozen version's own.

    DatasetPatch:
      type: object
      description: Identity edits and the live version's enabled flag; the key is fixed after creation (OI-36).
      properties:
        displayName:
          type: string
        isEnabled:
          type: boolean

    DatasetVersionSummary:
      type: object
      description: One version of a dataset and the snapshot it belongs to.
      required: [id, datasetId, snapshotId, isLive, sourceObject, createdAt]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        datasetId:
          $ref: './common.yaml#/components/schemas/Id'
        snapshotId:
          $ref: './common.yaml#/components/schemas/Id'
        isLive:
          type: boolean
          description: The live version is editable; a frozen version is read-only.
        sourceObject:
          type: string
        createdAt:
          $ref: './common.yaml#/components/schemas/Timestamp'

    DatasetListItem:
      allOf:
        - $ref: '#/components/schemas/Dataset'
        - type: object
          required: [versions, liveVersionId, storage]
          properties:
            versions:
              type: array
              description: One per snapshot holding the dataset, the live version first, then frozen ones newest first.
              items:
                $ref: '#/components/schemas/DatasetVersionSummary'
            liveVersionId:
              $ref: './common.yaml#/components/schemas/Id'
              description: The live version, which change sets edit and requests that name no snapshot read.
            storage:
              oneOf:
                - $ref: '#/components/schemas/DatasetSourceObjectStats'
                - type: 'null'
              description: Statistics of the live version's source object.

    DatasetVersionSettings:
      type: object
      required: [sourceObjectKind, sourceObject, supportsAggregate, supportsDetail, defaultTimeBindingId, expressionLanguageVersion, securityPolicyKey, properties]
      properties:
        sourceObjectKind:
          $ref: '#/components/schemas/DatasetSourceObjectKind'
        sourceObject:
          type: string
        supportsAggregate:
          type: boolean
        supportsDetail:
          type: boolean
        defaultTimeBindingId:
          type: [string, 'null']
        expressionLanguageVersion:
          type: string
        securityPolicyKey:
          type: [string, 'null']
        properties:
          type: string
          description: Free JSON text; carries no query semantics.

    DatasetDependent:
      type: object
      description: Something that reads an item of the version; computed from the delete-blocker graph (OI-35).
      required: [tab, itemId, itemKey, relation, blocksDelete]
      properties:
        tab:
          $ref: '#/components/schemas/DatasetTab'
        itemId:
          type: [string, 'null']
          description: Null for the settings tab.
        itemKey:
          type: string
        relation:
          type: string
          description: How the dependent reads the item, such as "grain component", "formula" or "default time binding".
        blocksDelete:
          type: boolean

    DatasetVersion:
      description: The whole editable content of one version; the state of its change set.
      allOf:
        - $ref: '#/components/schemas/DatasetVersionSummary'
        - type: object
          required: [dataset, settings, fields, grains, bindings, measures, dependents]
          properties:
            dataset:
              $ref: '#/components/schemas/Dataset'
              description: The dataset identity as the change set leaves it, so a preview shows a staged `updateDataset`.
            settings:
              $ref: '#/components/schemas/DatasetVersionSettings'
            fields:
              type: array
              items:
                $ref: '#/components/schemas/DatasetField'
            grains:
              type: array
              items:
                $ref: '#/components/schemas/DatasetGrain'
            bindings:
              type: array
              items:
                $ref: '#/components/schemas/DatasetBinding'
            measures:
              type: array
              items:
                $ref: '#/components/schemas/DatasetMeasure'
            dependents:
              type: object
              description: Item id to what reads it.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetDependent'

    # ───────────── Fields ─────────────

    DatasetFieldMaterialization:
      type: object
      description: >-
        The field's column in its source object's materialized view; state, refresh time and error come from the
        view's refresh status (OI-32).
      required: [viewName, columnName, state, requestedAt, refreshedAt, error]
      properties:
        viewName:
          type: string
        columnName:
          type: string
        state:
          $ref: '#/components/schemas/DatasetMaterializationState'
        requestedAt:
          $ref: './common.yaml#/components/schemas/Timestamp'
        refreshedAt:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        error:
          type: [string, 'null']

    DatasetFieldDefinition:
      type: object
      description: The writable content of a field, shared by `DatasetField` and `DatasetFieldInput`.
      required: [key, displayName, fieldSourceKind, sourceColumn, jsonPath, expressionText, dataType, numericPrecision, numericScale, isNullable, unitKey, isSelectable, isFilterable, isSortable, isGroupable, isEnabled]
      properties:
        key:
          $ref: './common.yaml#/components/schemas/Key'
        displayName:
          type: string
        fieldSourceKind:
          $ref: '#/components/schemas/DatasetFieldSourceKind'
        sourceColumn:
          type: [string, 'null']
        jsonPath:
          type: [string, 'null']
        expressionText:
          type: [string, 'null']
        dataType:
          $ref: '#/components/schemas/DatasetDataType'
        numericPrecision:
          type: [integer, 'null']
        numericScale:
          type: [integer, 'null']
        isNullable:
          type: boolean
        unitKey:
          type: [string, 'null']
        isSelectable:
          type: boolean
        isFilterable:
          type: boolean
        isSortable:
          type: boolean
        isGroupable:
          type: boolean
        isEnabled:
          type: boolean

    DatasetField:
      allOf:
        - type: object
          required: [id, materialization]
          properties:
            id:
              $ref: './common.yaml#/components/schemas/Id'
            materialization:
              oneOf:
                - $ref: '#/components/schemas/DatasetFieldMaterialization'
                - type: 'null'
              description: JSON path fields only; managed by the materialization sub-resource, not by `saveField`.
        - $ref: '#/components/schemas/DatasetFieldDefinition'

    DatasetFieldInput:
      allOf:
        - $ref: '#/components/schemas/DatasetFieldDefinition'
        - type: object
          properties:
            id:
              $ref: './common.yaml#/components/schemas/Id'
              description: Absent or temporary (`tmp:<uuid>`) to create; a stored id to update.
            createColumn:
              type: boolean
              description: >-
                Column fields on a managed table: `sourceColumn` names a new column, added at commit (typed from
                `dataType`, precision, scale and nullability) before the field is written (OI-33).
            materialize:
              type: boolean
              description: JSON path fields; request materialization once the field is written.

    # ───────────── Grains ─────────────

    DatasetGrainDefinition:
      type: object
      required: [key, grainKind, fieldIds]
      properties:
        key:
          $ref: './common.yaml#/components/schemas/Key'
        grainKind:
          $ref: '#/components/schemas/DatasetGrainKind'
        fieldIds:
          type: array
          description: Ordered; position is the component ordinal.
          items:
            $ref: './common.yaml#/components/schemas/Id'

    DatasetGrain:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              $ref: './common.yaml#/components/schemas/Id'
        - $ref: '#/components/schemas/DatasetGrainDefinition'

    DatasetGrainInput:
      allOf:
        - $ref: '#/components/schemas/DatasetGrainDefinition'
        - type: object
          properties:
            id:
              $ref: './common.yaml#/components/schemas/Id'
              description: Absent or temporary (`tmp:<uuid>`) to create; a stored id to update.

    # ───────────── Bindings ─────────────

    DatasetTimeBinding:
      type: object
      description: The time axis of a `time` binding (`qe_time_binding`).
      required: [timeValueType, sourceTimeZone, defaultQueryTimeZone, observationKind, nativePeriodicity, intervalEndFieldId, allowedPeriodicities, cumulativeOrigin, cumulativeFixedStart]
      properties:
        timeValueType:
          $ref: '#/components/schemas/DatasetTimeValueType'
        sourceTimeZone:
          type: [string, 'null']
        defaultQueryTimeZone:
          type: string
        observationKind:
          $ref: '#/components/schemas/DatasetObservationKind'
        nativePeriodicity:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Periodicity'
            - type: 'null'
        intervalEndFieldId:
          type: [string, 'null']
        allowedPeriodicities:
          type: array
          items:
            $ref: './common.yaml#/components/schemas/Periodicity'
        cumulativeOrigin:
          $ref: '#/components/schemas/DatasetCumulativeOrigin'
        cumulativeFixedStart:
          type: [string, 'null']
          format: date

    DatasetBindingDefinition:
      type: object
      required: [bindingKind, dimensionRoleId, dimensionId, sourceFieldId, mappingSetId, bridgeId, sourceDimensionBindingId, raggedBehavior, defaultPeriodAlignment, unmappedBehavior, unknownMemberKey, isRequired, isGroupable, isFilterable, isEnabled, time]
      properties:
        bindingKind:
          $ref: './common.yaml#/components/schemas/BindingKind'
        dimensionRoleId:
          type: [string, 'null']
          description: Non-time bindings; the role requests address the binding by.
        dimensionId:
          type: [string, 'null']
          description: Time bindings; the time-kind dimension.
        sourceFieldId:
          type: [string, 'null']
        mappingSetId:
          type: [string, 'null']
        bridgeId:
          type: [string, 'null']
        sourceDimensionBindingId:
          type: [string, 'null']
        raggedBehavior:
          $ref: '#/components/schemas/DatasetRaggedBehavior'
        defaultPeriodAlignment:
          $ref: '#/components/schemas/DatasetPeriodAlignment'
        unmappedBehavior:
          $ref: '#/components/schemas/DatasetUnmappedBehavior'
        unknownMemberKey:
          type: [string, 'null']
        isRequired:
          type: boolean
          description: Set by the server; a required binding cannot be disabled or deleted.
        isGroupable:
          type: boolean
        isFilterable:
          type: boolean
        isEnabled:
          type: boolean
        time:
          oneOf:
            - $ref: '#/components/schemas/DatasetTimeBinding'
            - type: 'null'

    DatasetBinding:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              $ref: './common.yaml#/components/schemas/Id'
        - $ref: '#/components/schemas/DatasetBindingDefinition'

    DatasetBindingInput:
      allOf:
        - $ref: '#/components/schemas/DatasetBindingDefinition'
        - type: object
          properties:
            id:
              $ref: './common.yaml#/components/schemas/Id'
              description: Absent or temporary (`tmp:<uuid>`) to create; a stored id to update.

    # ───────────── Measures ─────────────

    DatasetMeasureComponent:
      type: object
      required: [role, fieldId]
      properties:
        role:
          $ref: './common.yaml#/components/schemas/ComponentRole'
        fieldId:
          $ref: './common.yaml#/components/schemas/Id'

    DatasetMeasureTimePolicy:
      type: object
      required: [requiredTimeBindingId, selectionDatasetGrainId, observationSelection, valueTimeRole, boundaryMatch, maxLookbackSeconds, durationUnit, partialIntervalBehavior, missingPeriodBehavior]
      properties:
        requiredTimeBindingId:
          type: [string, 'null']
        selectionDatasetGrainId:
          type: [string, 'null']
        observationSelection:
          $ref: '#/components/schemas/DatasetObservationSelection'
        valueTimeRole:
          $ref: '#/components/schemas/DatasetValueTimeRole'
        boundaryMatch:
          $ref: '#/components/schemas/DatasetBoundaryMatch'
        maxLookbackSeconds:
          type: [integer, 'null']
          format: int64
        durationUnit:
          $ref: '#/components/schemas/DatasetDurationUnit'
        partialIntervalBehavior:
          $ref: '#/components/schemas/DatasetPartialIntervalBehavior'
        missingPeriodBehavior:
          $ref: '#/components/schemas/DatasetMissingPeriodBehavior'

    DatasetMeasureDefinition:
      type: object
      required: [key, displayName, isEnabled, measureKind, aggregationFunction, expressionText, compoundingPeriodicity, compoundingForm, implementationKey, implementationVersion, configurationJson, components, rowFilterExpression, valueNullBehavior, negativeWeightBehavior, emptySetBehavior, bridgeFactorBehavior, bridgeAllocationBehavior, totalBehavior, outputDataType, outputPrecision, outputScale, roundingMode, unitKey, accumulatorPrecision, accumulatorScale, timePolicy]
      properties:
        key:
          $ref: './common.yaml#/components/schemas/Key'
        displayName:
          type: string
        isEnabled:
          type: boolean
        measureKind:
          $ref: './common.yaml#/components/schemas/MeasureKind'
        aggregationFunction:
          oneOf:
            - $ref: '#/components/schemas/DatasetAggregationFunction'
            - type: 'null'
        expressionText:
          type: [string, 'null']
          description: >-
            Formula measures, and the per-step rate of compound measures; composes other measures (`[m.key]`). Only formulas
            read `@periodDays`, `@yearDays` and `YEARFRAC('<convention>')`, from expression language 1.2.
        compoundingPeriodicity:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Periodicity'
            - type: 'null'
          description: Compound measures; the step the rate compounds over.
        compoundingForm:
          oneOf:
            - $ref: '#/components/schemas/DatasetCompoundingForm'
            - type: 'null'
          description: Compound measures; `decay` is 1 - prod(1 - r), `growth` is prod(1 + r) - 1.
        implementationKey:
          type: [string, 'null']
        implementationVersion:
          type: [string, 'null']
        configurationJson:
          type: [string, 'null']
        components:
          type: array
          items:
            $ref: '#/components/schemas/DatasetMeasureComponent'
        rowFilterExpression:
          type: [string, 'null']
        valueNullBehavior:
          $ref: '#/components/schemas/DatasetValueNullBehavior'
        negativeWeightBehavior:
          $ref: '#/components/schemas/DatasetNegativeWeightBehavior'
        emptySetBehavior:
          $ref: '#/components/schemas/DatasetEmptySetBehavior'
        bridgeFactorBehavior:
          $ref: '#/components/schemas/DatasetBridgeFactorBehavior'
        bridgeAllocationBehavior:
          $ref: '#/components/schemas/DatasetBridgeAllocationBehavior'
        totalBehavior:
          $ref: '#/components/schemas/DatasetTotalBehavior'
        outputDataType:
          $ref: '#/components/schemas/DatasetMeasureOutputDataType'
        outputPrecision:
          type: [integer, 'null']
        outputScale:
          type: [integer, 'null']
        roundingMode:
          oneOf:
            - $ref: './common.yaml#/components/schemas/RoundingMode'
            - type: 'null'
          description: Null when the measure names none, which the engine reads as no rounding.
        unitKey:
          type: [string, 'null']
        accumulatorPrecision:
          type: integer
        accumulatorScale:
          type: integer
        timePolicy:
          oneOf:
            - $ref: '#/components/schemas/DatasetMeasureTimePolicy'
            - type: 'null'

    DatasetMeasure:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              $ref: './common.yaml#/components/schemas/Id'
        - $ref: '#/components/schemas/DatasetMeasureDefinition'

    DatasetMeasureInput:
      allOf:
        - $ref: '#/components/schemas/DatasetMeasureDefinition'
        - type: object
          properties:
            id:
              $ref: './common.yaml#/components/schemas/Id'
              description: Absent or temporary (`tmp:<uuid>`) to create; a stored id to update.

    # ───────────── Commands ─────────────

    DatasetNewColumnInput:
      type: object
      description: A physical column the API creates; each one also becomes a column field of the same name.
      required: [name, dataType, numericPrecision, numericScale, isNullable]
      properties:
        name:
          type: string
        dataType:
          $ref: '#/components/schemas/DatasetDataType'
        numericPrecision:
          type: [integer, 'null']
        numericScale:
          type: [integer, 'null']
        isNullable:
          type: boolean

    DatasetCreateInput:
      oneOf:
        - $ref: '#/components/schemas/DatasetCreateFromExistingInput'
        - $ref: '#/components/schemas/DatasetCreateWithNewTableInput'
      discriminator:
        propertyName: mode
        mapping:
          existing: '#/components/schemas/DatasetCreateFromExistingInput'
          new: '#/components/schemas/DatasetCreateWithNewTableInput'

    DatasetCreateFromExistingInput:
      type: object
      description: Registers a table or view that already exists in the tenant database.
      required: [mode, key, displayName, sourceObjectKind, sourceObject]
      properties:
        mode:
          const: existing
        key:
          $ref: './common.yaml#/components/schemas/DottedKey'
        displayName:
          type: string
        sourceObjectKind:
          $ref: '#/components/schemas/DatasetSourceObjectKind'
        sourceObject:
          type: string

    DatasetCreateWithNewTableInput:
      type: object
      description: Creates and registers a managed table with these columns (possibly none), then a live version whose fields read them.
      required: [mode, key, displayName, tableName, columns]
      properties:
        mode:
          const: new
        key:
          $ref: './common.yaml#/components/schemas/DottedKey'
        displayName:
          type: string
        tableName:
          type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/DatasetNewColumnInput'

    # ───────────── Change set (one per dataset version) ─────────────

    DatasetOperation:
      description: One staged edit of a dataset version, named after the `DatasetsApi` edit method it records.
      oneOf:
        - $ref: '#/components/schemas/DatasetUpdateDatasetOperation'
        - $ref: '#/components/schemas/DatasetSaveSettingsOperation'
        - $ref: '#/components/schemas/DatasetRenameSourceTableOperation'
        - $ref: '#/components/schemas/DatasetSaveFieldOperation'
        - $ref: '#/components/schemas/DatasetDeleteFieldOperation'
        - $ref: '#/components/schemas/DatasetAddFieldsFromColumnsOperation'
        - $ref: '#/components/schemas/DatasetSaveGrainOperation'
        - $ref: '#/components/schemas/DatasetDeleteGrainOperation'
        - $ref: '#/components/schemas/DatasetSaveBindingOperation'
        - $ref: '#/components/schemas/DatasetDeleteBindingOperation'
        - $ref: '#/components/schemas/DatasetSaveMeasureOperation'
        - $ref: '#/components/schemas/DatasetDeleteMeasureOperation'
      discriminator:
        propertyName: op
        mapping:
          updateDataset: '#/components/schemas/DatasetUpdateDatasetOperation'
          saveSettings: '#/components/schemas/DatasetSaveSettingsOperation'
          renameSourceTable: '#/components/schemas/DatasetRenameSourceTableOperation'
          saveField: '#/components/schemas/DatasetSaveFieldOperation'
          deleteField: '#/components/schemas/DatasetDeleteFieldOperation'
          addFieldsFromColumns: '#/components/schemas/DatasetAddFieldsFromColumnsOperation'
          saveGrain: '#/components/schemas/DatasetSaveGrainOperation'
          deleteGrain: '#/components/schemas/DatasetDeleteGrainOperation'
          saveBinding: '#/components/schemas/DatasetSaveBindingOperation'
          deleteBinding: '#/components/schemas/DatasetDeleteBindingOperation'
          saveMeasure: '#/components/schemas/DatasetSaveMeasureOperation'
          deleteMeasure: '#/components/schemas/DatasetDeleteMeasureOperation'

    DatasetUpdateDatasetOperation:
      type: object
      description: Edits the display name and the live version's enabled flag.
      required: [op, patch]
      properties:
        op:
          const: updateDataset
        patch:
          $ref: '#/components/schemas/DatasetPatch'

    DatasetSaveSettingsOperation:
      type: object
      required: [op, settings]
      properties:
        op:
          const: saveSettings
        settings:
          $ref: '#/components/schemas/DatasetVersionSettings'

    DatasetRenameSourceTableOperation:
      type: object
      description: Renames the managed table the live version reads; refused while another version, live or frozen, reads it (OI-33).
      required: [op, tableName]
      properties:
        op:
          const: renameSourceTable
        tableName:
          type: string

    DatasetSaveFieldOperation:
      type: object
      required: [op, input]
      properties:
        op:
          const: saveField
        input:
          $ref: '#/components/schemas/DatasetFieldInput'

    DatasetDeleteFieldOperation:
      type: object
      required: [op, fieldId]
      properties:
        op:
          const: deleteField
        fieldId:
          $ref: './common.yaml#/components/schemas/Id'

    DatasetAddFieldsFromColumnsOperation:
      type: object
      description: >-
        Creates one column field per named column. The created fields carry temporary ids that stay the same on every
        replay of the same operation list.
      required: [op, columns]
      properties:
        op:
          const: addFieldsFromColumns
        columns:
          type: array
          items:
            type: string

    DatasetSaveGrainOperation:
      type: object
      required: [op, input]
      properties:
        op:
          const: saveGrain
        input:
          $ref: '#/components/schemas/DatasetGrainInput'

    DatasetDeleteGrainOperation:
      type: object
      required: [op, grainId]
      properties:
        op:
          const: deleteGrain
        grainId:
          $ref: './common.yaml#/components/schemas/Id'

    DatasetSaveBindingOperation:
      type: object
      required: [op, input]
      properties:
        op:
          const: saveBinding
        input:
          $ref: '#/components/schemas/DatasetBindingInput'

    DatasetDeleteBindingOperation:
      type: object
      required: [op, bindingId]
      properties:
        op:
          const: deleteBinding
        bindingId:
          $ref: './common.yaml#/components/schemas/Id'

    DatasetSaveMeasureOperation:
      type: object
      required: [op, input]
      properties:
        op:
          const: saveMeasure
        input:
          $ref: '#/components/schemas/DatasetMeasureInput'

    DatasetDeleteMeasureOperation:
      type: object
      required: [op, measureId]
      properties:
        op:
          const: deleteMeasure
        measureId:
          $ref: './common.yaml#/components/schemas/Id'

    DatasetChangeSetRequest:
      allOf:
        - $ref: './common.yaml#/components/schemas/ChangeSetRequest'
        - type: object
          required: [operations]
          properties:
            operations:
              type: array
              items:
                $ref: '#/components/schemas/DatasetOperation'

    DatasetChangeSetPreview:
      allOf:
        - $ref: './common.yaml#/components/schemas/ChangeSetPreview'
        - type: object
          required: [state]
          properties:
            state:
              $ref: '#/components/schemas/DatasetVersion'

    DatasetChangeSetCommit:
      allOf:
        - $ref: './common.yaml#/components/schemas/ChangeSetCommit'
        - type: object
          required: [state]
          properties:
            state:
              $ref: '#/components/schemas/DatasetVersion'
